[workspace]
resolver = "3"
members = [
    "crates/semon-claude",
    "crates/semon-codex",
    "crates/semon-control",
    "crates/semon-push",
    "crates/semon-relay",
    "crates/semon-runtime",
    "crates/semon-sessions",
    "crates/semon-store",
]
# Patched in through [patch.crates-io] below, not a member: fmt, clippy and
# tests leave its upstream code as published.
exclude = ["vendor/tiny_http"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
age = "=0.12.1"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = "=2.2.0"
hex = "0.4.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
libc = "0.2.189"
# Held at 0.39: its libsqlite3-sys ^0.37 must fit the embedding server's sqlx 0.9 (<0.38); both link sqlite3.
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = { version = "1.0.150", features = ["preserve_order", "raw_value"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
thiserror = "2"
tiny_http = { version = "=0.12.0", features = ["ssl-rustls"] }
# Seekable zstd segments for sealed logs (the reference C library, built by
# zstd-sys). Default features off: no legacy formats, no dictionary builder.
zstd = { version = "0.13.3", default-features = false }

# tiny_http 0.12.0 with one fix to its connection pool; see
# vendor/tiny_http/SEMON-PATCH.md.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

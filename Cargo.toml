[workspace]
resolver = "3"
members = [
    "crates/semon-claude",
    "crates/semon-codex",
    "crates/semon-relay",
    "crates/semon-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
hex = "0.4.3"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
thiserror = "2"
tiny_http = "=0.12.0"

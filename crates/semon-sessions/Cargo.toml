[package]
name = "semon-sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Read-only local Claude Code and Codex session tree."

[dependencies]
libc.workspace = true
rusqlite.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tiny_http.workspace = true
zstd.workspace = true

[features]
# Lets `SEMON_TEST_NOW` (epoch ms) pin the viewer's clock. Only CI's browser
# suite builds with it, to serve a fixture whose times must stand still.
test-clock = []
# Builds the UI check's embedding-server example; not used by the viewer CLI.
test-ui-account-server = []

[[example]]
name = "ui-account-server"
required-features = ["test-ui-account-server"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semon Sessions</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/viewer.css">
<script src="/viewer.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="sidebar-head">
      <div class="brandrow"><span class="mark" aria-hidden="true"></span><span class="brandname">Semon</span>
        <button class="ibtn close" id="drawer-close" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <button class="ibtn rail-toggle" id="rail-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true"></button>
    </div>
    <label class="side-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14zM20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search" autocomplete="off"></label>
    <div id="nav"></div>
    <div class="side-h">Recent</div>
    <div class="side-list" id="side-list">
      <div id="lanes" role="tree" aria-label="Recent sessions"></div>
    </div>
    <div class="side-foot" id="lanes-all"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main" id="main">
    <header class="topbar" id="topbar"></header>
    <div class="page" id="page"></div>
  </div>
</div>
</body>
</html>

[package]
name = "semon-push"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The mirror protocol: the client that sends the session logs' input files, redacted, and the machine's facts to a receiver, and a reference receiver."

[dependencies]
hex.workspace = true
reqwest.workspace = true
# Already built for reqwest (same version and features); used directly for
# `semon receive`'s TLS listener and its token randomness.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
semon-sessions = { path = "../semon-sessions" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tiny_http.workspace = true

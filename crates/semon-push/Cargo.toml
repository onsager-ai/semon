[package]
name = "semon-push"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The push protocol: the client that sends the session logs' input files, redacted, and the machine's facts to a receiver, and a reference receiver."

[dependencies]
tiny_http.workspace = true
getrandom.workspace = true
libc.workspace = true
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }
hex.workspace = true
httpdate = "1.0"
reqwest.workspace = true
semon-sessions = { path = "../semon-sessions" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
zstd.workspace = true

[dev-dependencies]

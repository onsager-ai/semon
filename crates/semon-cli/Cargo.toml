[package]
name = "semon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Session discovery, synchronization, viewing, query and control CLI."

[[bin]]
name = "semon"
path = "src/main.rs"

[dependencies]
semon-push = { path = "../semon-push" }
semon-sessions = { path = "../semon-sessions" }
serde_json.workspace = true

[dev-dependencies]
arrow = { version = "=58.4.1", default-features = false }
parquet = { version = "=58.4.1", default-features = false, features = ["arrow", "zstd"] }
rusqlite.workspace = true
semon-asi = { path = "../semon-asi" }

[package]
name = "semon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Session discovery, synchronization, viewing, query and control CLI."

[[bin]]
name = "semon"
path = "src/main.rs"

[dependencies]
semon-control = { path = "../semon-control" }
semon-push = { path = "../semon-push" }
semon-relay = { path = "../semon-relay" }
# Preserve encrypted viewing/deletion until the migration path is qualified (#386).
semon-sessions = { path = "../semon-sessions", features = ["encrypted-relay"] }
serde_json.workspace = true

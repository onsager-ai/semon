[package]
name = "semon-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Content-addressed SQLite storage for carrier-neutral traces."

[dependencies]
semon-control = { path = "../semon-control" }
semon-relay = { path = "../semon-relay" }
semon-push = { path = "../semon-push" }
# Keep existing CLI decryption access during Relay retirement. The CLI moves
# out of this crate before the historical trace store is removed (#381/#387).
semon-sessions = { path = "../semon-sessions", features = ["encrypted-relay"] }
hex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true

[package]
name = "semon-control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Two-way control, step 1: the pending-request model, its canonical payload hash and the answer journal."

[dependencies]
hex.workspace = true
# Already in Cargo.lock; only for the O_NOFOLLOW constant.
libc.workspace = true
serde_json.workspace = true
# RFC 8785 with UTF-16 key order and ECMAScript number formatting.
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
toml = "=0.5.11"

[target.'cfg(target_os = "linux")'.dependencies]
# Safe SO_PEERCRED binding; already pinned in the workspace lockfile.
rustix = { version = "=1.1.5", features = ["net", "time"] }

[package]
name = "semon-asi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Pinned: the Parquet writer's output is part of the store format.
# Default features off: no CSV/JSON/IPC readers; ZSTD is the only codec.
arrow = { version = "=59.3.2", default-features = false }
parquet = { version = "=59.3.2", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# DuckDB is the read engine (asi-store.md, Crate boundary). This slice only
# links it for the live-row smoke test and to measure CI time and size.
duckdb = { version = "=1.10506.1", features = ["bundled", "parquet", "json"] }
tempfile = "3.27.0"

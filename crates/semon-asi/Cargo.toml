[package]
name = "semon-asi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Pinned: the Parquet writer's output is part of the store format. The major version
# is the one duckdb 1.10506.1 depends on, so Arrow is compiled once.
# Default features off: no CSV/JSON/IPC readers; ZSTD is the only codec.
arrow = { version = "=58.4.1", default-features = false }
parquet = { version = "=58.4.1", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

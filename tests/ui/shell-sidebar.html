<body>
<!-- An embedding page of its own beside the viewer, drawn with shell::session_sidebar("Semon", NAV's rows) and marked
     data-viewer="sidebar" (a Rust test in shell.rs holds this markup to the API). tests/ui/checks/embedsidebar.mjs opens it
     from the viewer's origin. Its nav rows are the viewer's paths; its own content stays its own. -->
<div class="app" data-viewer="sidebar" data-viewer-nav="machines">
<aside class="sidebar" id="sidebar" aria-label="Navigation">
<div class="sidebar-head"><div class="brandrow"><span class="mark" aria-hidden="true"></span><span class="brandname">Semon</span><button class="ibtn close" id="drawer-close" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></div>
<label class="side-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14zM20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search" autocomplete="off"></label>
<nav id="nav" aria-label="Pages">
<a class="nav-item" href="/"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5M10 20v-5h4v5"></path></svg><span>Home</span></a>
<a class="nav-item" href="/sessions"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg><span>Sessions</span></a>
<a class="nav-item" href="/analytics"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h17M8 15l3-4 3 2 5-7"></path></svg><span>Analytics</span></a>
<a class="nav-item" href="/machines" aria-current="page"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v11H3zM8 20h8M12 16v4"></path></svg><span>Machines</span></a>
</nav>
<div class="side-h">Recent</div>
<div class="side-list" id="side-list"><div id="lanes" role="tree" aria-label="Recent sessions"></div></div>
<div class="account"><span class="account-login">sample.user@example.invalid</span><button class="btn sh-quiet" type="button">Sign out</button></div>
</aside>
<div class="scrim" id="scrim"></div>
<main class="main" id="main"><header class="topbar" id="topbar"><button class="ibtn lead" id="lead-btn" type="button" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button><div class="ttl"><span class="t">Devices</span></div></header>
<div class="page" id="page"><div class="ph"><h1>Devices</h1></div>
<p id="own-content">This page's own content, which the viewer's script leaves alone.</p>
</div></main>
</div>
</body>
</html>

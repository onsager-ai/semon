<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Semon Sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root {
  --ground: #ffffff; --side: #f7f7f5; --sunken: #f0f1ee; --bubble: #eeefeb;
  --ink: #191d1b; --ink-2: #3f4642; --muted: #6f7773; --faint: #9aa19d; --line: #e5e7e3;
  --accent: #4152c4; --claude: #c0643f; --codex: #2b8070; --you: #4152c4;
  --work: #1f78c1; --wait: #b9740b; --wait-soft: #faf0da; --err: #c23b3b; --done: #8b928e;
  --diff-add: #e3f3e8; --diff-del: #fbe8e6;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141817; --side: #181c1b; --sunken: #202523; --bubble: #242927;
    --ink: #e5e9e6; --ink-2: #c3c9c5; --muted: #8b938f; --faint: #646c68; --line: #272d2a;
    --accent: #8f9cf0; --claude: #de8a63; --codex: #4fb5a0; --you: #8f9cf0;
    --work: #58a9ec; --wait: #e2a23a; --wait-soft: #33280f; --err: #ef6b66; --done: #737b77;
    --diff-add: #173022; --diff-del: #381d1b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #141817; --side: #181c1b; --sunken: #202523; --bubble: #242927;
  --ink: #e5e9e6; --ink-2: #c3c9c5; --muted: #8b938f; --faint: #646c68; --line: #272d2a;
  --accent: #8f9cf0; --claude: #de8a63; --codex: #4fb5a0; --you: #8f9cf0;
  --work: #58a9ec; --wait: #e2a23a; --wait-soft: #33280f; --err: #ef6b66; --done: #737b77;
  --diff-add: #173022; --diff-del: #381d1b; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
svg { display: block; }
code, .mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
code { overflow-wrap: anywhere; }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.work { background: var(--work); animation: pulse 1.8s ease-out infinite; }
.dot.wait { background: var(--wait); }
.dot.idle { border: 1.5px solid var(--done); }
.dot.done { background: var(--done); opacity: .7; }
.dot.err { background: var(--err); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--work) 55%, transparent); } 100% { box-shadow: 0 0 0 6px transparent; } }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); border-top-color: var(--work); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .dot.work, .spin { animation: none; } .app, .sidebar, .scrim, .topbar, .tree-toggle svg { transition: none !important; } }
.h-claude { --h: var(--claude); } .h-codex { --h: var(--codex); } .h-you { --h: var(--you); }
.icon { width: 18px; height: 18px; flex: none; }

/* ---- Shell ----------------------------------------------------------------- */
.app { display: grid; grid-template-columns: 296px minmax(0, 1fr); height: 100%; transition: grid-template-columns .18s ease; }
.sidebar { background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; min-height: 0; padding-bottom: 12px; min-width: 0; }
.main { overflow-y: auto; min-width: 0; position: relative; }
.scrim { display: none; }
.sidebar-head { display: flex; align-items: center; gap: 2px; padding: 10px 12px 2px; }
.brandrow { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; font-weight: 600; font-size: 15px; }
.mark { width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, var(--claude) 0 50%, var(--codex) 50% 100%); flex: none; }
.brandrow .close { display: none; margin-left: auto; }
/* Search sits on the same grid as the nav rows below it: same side margin, padding, icon size, gap and height,
   so its icon and text line up with Home / Machines. */
.side-search { margin: 0 8px 6px; height: 36px; display: flex; align-items: center; gap: 10px; background: var(--sunken); border-radius: 9px; padding: 0 10px; color: var(--muted); overflow: hidden; }
.side-search input { border: 0; outline: none; background: transparent; width: 100%; min-width: 0; padding: 0; font-size: 14px; color: var(--ink); }
.side-search input::placeholder, .find input::placeholder { color: var(--faint); }
.side-search svg { width: 18px; height: 18px; flex: none; }
.nav-item { position: relative; width: calc(100% - 16px); min-width: 0; margin: 1px 8px; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 9px; text-align: left; font-weight: 500; color: var(--ink-2); }
@media (hover: hover) { .nav-item:hover { background: color-mix(in srgb, var(--sunken) 70%, transparent); } }
.nav-item[aria-current="page"] { background: var(--sunken); color: var(--ink); }
.nav-item .cnt { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--faint); font-weight: 400; }
.nav-item .cnt.hot { color: var(--wait); font-weight: 500; }
.side-h { display: flex; align-items: center; gap: 6px; margin: 16px 18px 2px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.groupby { display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 12px 2px; font-size: 12.5px; }
.groupby button { border: 0; background: none; padding: 4px 7px; border-radius: 7px; color: var(--muted); }
.groupby button[aria-pressed="true"] { background: var(--sunken); color: var(--ink); font-weight: 500; }
.ghead { padding: 10px 18px 2px; font-size: 11.5px; color: var(--faint); display: flex; gap: 6px; }
.treeitem { min-width: 0; outline: none; }
.treeitem:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 9px; }
.tree-row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 2px; align-items: center; min-width: 0; margin: 0 8px; }
.tree-toggle, .tree-spacer { width: 28px; height: 36px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); padding: 0; }
.tree-toggle { border-radius: 8px; }
.tree-toggle svg { width: 20px; height: 20px; transition: transform .18s ease; }
.treeitem[aria-expanded="true"] > .tree-row .tree-toggle svg { transform: rotate(90deg); }
.tree-group { margin-left: 14px; padding-left: 0; border-left: 1px solid var(--line); min-width: 0; }
.tree-group[data-depth="4"], .tree-group[data-depth="5"], .tree-group[data-depth="6"], .tree-group[data-depth="7"] { margin-left: 0; border-left-color: transparent; }
.treeitem[aria-expanded="false"] > .tree-group { display: none; }
.srow { width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; align-items: center; border: 0; background: none; padding: 5px 8px; border-radius: 9px; text-align: left; }
@media (hover: hover) { .srow:hover { background: color-mix(in srgb, var(--sunken) 70%, transparent); } }
.srow[aria-current="page"] { background: var(--sunken); }
.srow-main, .srow-meta { display: flex; align-items: center; gap: 7px; min-width: 0; }
.srow .nm { flex: 1 1 auto; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .ag { flex: none; font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
.srow-meta { padding-left: 1px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.srow-meta .host, .srow-meta .repo-short { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow-meta .host { flex: 0 1 15ch; }
.srow-meta .repo-short { flex: 0 1 auto; }
.srow-meta svg { width: 14px; height: 14px; flex: none; color: var(--faint); }
.tree-summary { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 1px 5px; border-radius: 8px; background: var(--sunken); color: var(--muted); font: 11px/1.4 var(--mono); }
.tree-summary .dot { width: 6px; height: 6px; }
.hmark { width: 16px; height: 16px; display: inline-grid; place-items: center; flex: none; color: var(--h); font-size: 14px; font-weight: 600; line-height: 1; }
.hmark.h-claude { font-size: 17px; }
.hmark.h-codex { font-size: 15px; }

.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 8px 20px; background: color-mix(in srgb, var(--ground) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .ttl { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; font-weight: 600; font-size: 16px; min-width: 0; }
.topbar .ttl .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ibtn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 9px; background: none; color: var(--ink-2); flex: none; }
@media (hover: hover) { .ibtn:hover { background: var(--sunken); } }
.ibtn[aria-expanded="true"] { background: var(--sunken); }
.ibtn svg { width: 20px; height: 20px; }
.lead { display: none; }
/* The page title lives only in the top bar. A parent crumb before it ("quill ›") is the way up a level. */
.topbar .crumb { flex: none; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; padding: 4px 0; color: var(--accent); font: inherit; font-weight: 500; }
@media (hover: hover) { .topbar .crumb:hover { text-decoration: underline; text-underline-offset: 3px; } }
.topbar .sep { color: var(--faint); font-weight: 400; flex: none; }

.page { max-width: 760px; margin: 0 auto; padding: 4px 28px 72px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.page.wide-mode { max-width: 1400px; }
.page > * { min-width: 0; }
/* Visually hidden: the same title is already in the top bar, but screen readers keep a page heading. */
.ph h1 { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ph { padding-top: 6px; }
/* A detail page's title and summary live in the bar; the page keeps only a heading for screen readers. */
.ph.sr { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); }
.ph .sub { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.ph .sub b { color: var(--ink); font-weight: 600; margin-right: 3px; }
.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 0; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sec-h .n { font-family: var(--mono); letter-spacing: 0; color: var(--faint); font-weight: 400; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); border-top: 1px solid var(--line); }
.list > * { min-width: 0; }
.empty { color: var(--muted); font-size: 13.5px; margin: 0; padding: 12px 0; }
.cw-toggle { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; color: var(--accent); font-size: 13.5px; }
.cw-toggle .chev { transition: transform .15s; }
.cw-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.childwork { display: grid; grid-template-columns: minmax(0, 1fr); margin-top: -6px; }
.cw-body { margin: 6px 0 4px 8px; padding-left: 14px; border-left: 2px solid var(--line); }
.cw-body > .nested .msg.assistant .body { font-size: 15px; }
/* Real content has long unbroken paths, ids and commands: every text that comes from a transcript or a handoff
   may break anywhere, and every grid track holding it may shrink below its content. */
.hop .body { grid-template-columns: minmax(0, 1fr); }
.hop .body > *, .hop .meta > *, .turn-h > *, .turn-end > * { min-width: 0; }
.hop .brief, .hop .result, .hop .sent, .hcard .brief, .hcard .result, .hcard .ln, .ib .q, .ib .ln, .hop .open, .chip-h, .msg .body { overflow-wrap: anywhere; }
.chip-h { max-width: 100%; text-align: left; }

/* A handoff's sentence: who did what to whom. Used on Home, in traces and in transcripts. */
.who { font-weight: 600; }
.verb { color: var(--muted); }
.chip-h { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.chip-h::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--h); }
.stat { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.stat.work { color: var(--work); } .stat.wait { color: var(--wait); } .stat.err { color: var(--err); } .stat.done, .stat.idle { color: var(--muted); }

/* ---- Inbox ---------------------------------------------------------------- */
.ib { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 3px 10px; align-items: start; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 0; text-align: left; width: 100%; }
.ib > svg { width: 18px; height: 18px; margin-top: 1px; color: var(--wait); }
.ib .ln { min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.ib .tm { font-family: var(--mono); font-size: 12px; color: var(--faint); padding-top: 1px; }
.ib .q { grid-column: 2 / 4; font-family: var(--serif); font-size: 16px; line-height: 1.45; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ib .ctx { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.ib { cursor: pointer; }
/* Where the work came from: the message of yours at the root of its trace, one line. */
.ib .org { grid-column: 2 / 4; min-width: 0; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ib .org .oq { color: var(--ink-2); }
.ib .ctx .tracebtn { margin: -8px -10px -8px auto; }
@media (hover: hover) { .ib:hover .q { color: var(--accent); } }
.ib.quiet > svg { color: var(--faint); }
.ib.quiet .q { color: var(--ink-2); font-size: 15px; -webkit-line-clamp: 2; }

/* ---- Now -------------------------------------------------------------------- */
.nrow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 11px 0; text-align: left; width: 100%; }
.nrow .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nrow .ag { font-size: 12px; color: var(--faint); }
.nrow .for, .nrow .act { grid-column: 2 / 4; min-width: 0; }
.nrow .for { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nrow .act { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.nrow .act code { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; overflow-wrap: normal; }
.nrow .act .el { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--faint); flex: none; padding-left: 8px; }
@media (hover: hover) { .nrow:hover .nm { color: var(--accent); } }
.mhead { display: flex; align-items: baseline; gap: 8px; padding: 16px 0 4px; font-size: 13px; font-weight: 600; }
.mhead svg { width: 16px; height: 16px; color: var(--faint); align-self: center; }
.mhead .n { font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--faint); }
.mhead .off { font-weight: 400; font-size: 12.5px; color: var(--err); }
.ph .sub .off { color: var(--err); }

/* ---- Trace: one turn and what it set off, on one rail ------------------------------- */
.flow { display: grid; grid-template-columns: minmax(0, 1fr); }
/* One continuous rail through every step. Every node is centred on it (x = 14px) and wears a ring of the
   page colour so the rail passes cleanly behind it. Depth is never shown by indenting, which breaks the rail;
   a child agent's step gets a smaller node instead. */
.hop { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 12px; padding: 0 0 20px; }
.hop::before { content: ""; position: absolute; left: 13px; width: 2px; top: 0; bottom: 0; background: var(--line); }
.hop:first-child::before { top: 14px; }
.hop:last-child::before { bottom: auto; height: 14px; }
.hop:only-child::before { display: none; }
.hop .node { position: relative; z-index: 1; justify-self: center; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); color: var(--ink-2); box-shadow: 0 0 0 4px var(--ground); }
.hop .node svg { width: 15px; height: 15px; }
.hop.child .node { width: 20px; height: 20px; margin-top: 4px; }
.hop.child .node svg { width: 12px; height: 12px; }
.hop.k-toyou .node { background: var(--wait-soft); color: var(--wait); }
.hop.s-err .node { color: var(--err); }
.hop.k-move .node { color: var(--accent); }
.hop .body { min-width: 0; padding-top: 3px; display: grid; gap: 4px; }
.hop .sent { font-size: 14px; overflow-wrap: anywhere; }
.hop .sent .tm { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-left: 6px; }
.hop .brief { font-family: var(--serif); font-size: 15.5px; line-height: 1.45; color: var(--ink-2); max-height: 5.8em; overflow: hidden; }
.hop .more { justify-self: start; min-height: 36px; margin: -8px 0; border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; }
.hop .result { font-size: 13.5px; color: var(--ink-2); }
.hop .result .rl { color: var(--muted); margin-right: 4px; }
.hop .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; font-size: 12.5px; color: var(--muted); }
.hop .meta .stat { white-space: normal; }
.hop .open { min-height: 36px; border: 0; background: none; padding: 0; color: var(--accent); font-size: 12.5px; text-align: left; }
.hop .meta .gone { color: var(--faint); }
.hop.k-root .node { color: var(--h); background: color-mix(in srgb, var(--h) 16%, var(--ground)); }
/* A handoff whose receiving turn is not in these logs: a hollow node, nothing below it. */
.hop.stub .node { background: var(--ground); border: 1.5px dashed var(--faint); }

/* ---- Session page ----------------------------------------------------------------- */
/* An opaque bar: content scrolls under it without showing through. */
.topbar { background: var(--ground); backdrop-filter: none; -webkit-backdrop-filter: none; }
.list .more { border: 0; background: none; padding: 10px 0; text-align: left; color: var(--accent); font-size: 13.5px; }
/* A turn: one stretch of a transcript, from what came in (your message, a relay, a brief) to how it ended. */
.turns { display: grid; grid-template-columns: minmax(0, 1fr); }
.turns > * { min-width: 0; }
.turns > .divider { margin-bottom: 4px; }
.turn { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 14px 0 16px; border-radius: 6px; transition: background-color .6s ease, box-shadow .6s ease; }
.turn > * { min-width: 0; }
/* The divider is drawn apart from the box, so the box's rounded corners (for the deep-link mark) don't bend it. */
.turn + .turn::before { content: ""; position: absolute; top: 0; left: 0; right: 0; border-top: 1px solid var(--line); }
/* A deep link marks its turn for a moment; the shadow pads the mark without moving anything. */
.turn.flash { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 10%, transparent); transition: none; }
.turn-h { display: flex; align-items: center; gap: 8px; min-height: 36px; margin: 0 0 -4px; font: inherit; font-size: 13.5px; font-weight: 400; color: var(--ink-2); }
.turn-h > svg { width: 16px; height: 16px; flex: none; color: var(--h); }
.turn-h .lbl { display: flex; align-items: center; min-width: 0; }
.turn-h .verb { flex: none; white-space: pre; }
.turn-h .from { min-height: 36px; min-width: 0; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) { .turn-h .from:hover { text-decoration: underline; text-underline-offset: 3px; } }
.turn-h .tm { margin-left: auto; padding-left: 8px; flex: none; font-family: var(--mono); font-size: 12px; color: var(--faint); }
.turn-end { display: flex; align-items: center; gap: 8px; min-height: 36px; margin-bottom: -6px; }
.turn-end .stat { white-space: normal; }
.tracebtn { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; border: 0; background: none; padding: 0 10px; margin-right: -10px; border-radius: 9px; color: var(--accent); font-size: 13.5px; }
@media (hover: hover) { .tracebtn:hover { background: var(--sunken); } }
.tracebtn svg { width: 16px; height: 16px; }

.md .mh { margin: 10px 0 4px; font-weight: 600; color: var(--ink); } .md .mh1 { font-size: 1.2em; } .md .mh2 { font-size: 1.1em; } .md > .mh:first-child { margin-top: 0; }
.md blockquote { margin: 0 0 7px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--ink-2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }

.md .codeblock pre { margin: 0; padding: 8px 12px; width: max-content; min-width: 100%; font: 12.5px/1.45 var(--mono); white-space: pre; color: var(--ink-2); }

.md table { border-collapse: collapse; min-width: 100%; font-family: var(--sans); font-size: 13.5px; line-height: 1.4; }

.brief.md code { font-size: .9em; }
/* What you answered, under a question that went to you. */
.answer ol { margin: 2px 0 0; padding-left: 20px; } .answer.none { color: var(--muted); }
.ib .ans { grid-column: 2 / 4; min-width: 0; font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Your message's time sits under it, right-aligned, as in a chat. */

.think { justify-self: start; display: inline-flex; align-items: center; gap: 4px; min-height: 28px; border: 0; background: none; padding: 0; color: var(--muted); font-size: 13.5px; }

.steps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; border-left: 2px solid var(--line); padding-left: 12px; margin-left: 2px; }
.steps > * { min-width: 0; }
.step > button, .step.live { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 3px 6px; margin-left: -6px; border-radius: 7px; text-align: left; color: var(--muted); font-size: 13.5px; min-width: 0; }
@media (hover: hover) { .step > button:hover { background: var(--sunken); } }
.step > button > svg:first-child { width: 16px; height: 16px; flex: none; }
.step .sv { flex: none; }
.step .sa { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; overflow-wrap: normal; }
.step .sd { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--faint); flex: none; padding-left: 8px; }
.step .chev { color: var(--faint); transition: transform .15s; }
.step > button[aria-expanded="true"] .chev { transform: rotate(90deg); }
.step.err .sv, .step.err .sd, .step.err > button > svg:first-child { color: var(--err); }
.tgroup { display: grid; grid-template-columns: minmax(0, 1fr); }
.tsum { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 3px 6px; margin-left: -6px; border-radius: 7px; text-align: left; color: var(--muted); font-size: 13.5px; min-width: 0; }
@media (hover: hover) { .tsum:hover { background: var(--sunken); } }
.tsum > svg:first-child { width: 16px; height: 16px; flex: none; }

.tsum[aria-expanded="true"] .chev { transform: rotate(90deg); }
.tgroup > .steps { margin-top: 2px; }
.step .out { margin: 4px 0 8px; border-radius: 10px; background: var(--sunken); overflow: hidden; }
.step .out pre { margin: 0; padding: 8px 12px; font: 12px/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
.step .out .io { padding: 7px 12px 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.step .out .io + pre { padding-top: 3px; }

.step .out pre.in + .io { border-top: 1px solid var(--line); margin-top: 2px; }

.step .out .cutnote { padding: 0 12px 8px; font-size: 12px; color: var(--faint); }

.step .out .clip { max-height: 15.6em; overflow: hidden; }
.step .out .clip.clipped { -webkit-mask-image: linear-gradient(#000 calc(100% - 32px), transparent); mask-image: linear-gradient(#000 calc(100% - 32px), transparent); }
.step .out .diff.clip { max-height: 16.5em; }
.step .out .viewall { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 40px; border: 0; border-top: 1px solid var(--line); background: none; padding: 8px 12px; color: var(--accent); font-size: 13.5px; }
.step .out .viewall svg { width: 15px; height: 15px; }
@media (hover: hover) { .step .out .viewall:hover { background: color-mix(in srgb, var(--sunken) 60%, var(--line)); } }
/* The whole call: a full-screen sheet on phones, a dialog on wider screens. Text wraps; nothing scrolls sideways. */
html.viewer-open, html.viewer-open body { overflow: hidden; }
dialog.viewer, dialog.session-details { padding: 0; border: 0; color: var(--ink); background: var(--ground); }

.viewer .vh { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 8px; padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--line); }

.viewer .vs { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.viewer .vcopy { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 4px 6px; margin-right: -6px; border-radius: 7px; font-size: 12.5px; letter-spacing: 0; text-transform: none; color: var(--accent); }
.viewer .vcopy svg { width: 14px; height: 14px; }
@media (hover: hover) { .viewer .vcopy:hover { background: var(--sunken); } }

.session-details .vclose { grid-row: 1; grid-column: 2; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; border-radius: 10px; color: var(--ink-2); }

.session-details .detail-row { display: grid; grid-template-columns: minmax(94px, .3fr) minmax(0, 1fr); gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); user-select: text; -webkit-user-select: text; }
.session-details .detail-label { color: var(--faint); font-size: 13px; }
.session-details .detail-value { min-width: 0; overflow-wrap: anywhere; color: var(--ink-2); font-size: 13.5px; user-select: text; -webkit-user-select: text; }
@media (max-width: 760px) {
  dialog.viewer { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; }

}
.diff { font: 12px/1.45 var(--mono); padding: 6px 0; }

  const kidsText = (all) => { const sub = all.filter((x) => x.kind === "Subagent").length, cdx = all.filter((x) => x.kind === "Codex run").length, other = all.length - sub - cdx;

  // ---- Sessions: every top-level session and its child runs ---------------------------------------------------------------

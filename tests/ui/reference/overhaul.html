<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Semon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ==== Visual system (docs/design/overhaul.md) ==================================================================
   Colour: ink for content, muted for chrome text, faint only for rules and icons (never text). One accent, for links
   and controls. State colours only where state is shown: work (a dot), wait and err (a dot and their words). Harness
   tints appear in Analytics charts only; everywhere else a harness is named in plain text. No coloured borders.
   Type: 12 caption, 13 secondary, 14 UI (15 on phones), 16 reading serif, 16/17 title, 22 figures.
   Space: 4 8 12 16 24 32. Radius: 6 10 14. Tap: 36 desktop, 44 phone. */
:root {
  --ground: #ffffff; --side: #f7f7f5; --sunken: #f1f2ef; --raised: #ffffff; --sk: #eceeea;
  --ink: #191d1b; --ink-2: #3d4440; --muted: #5d6561; --faint: #8a918d; --line: #e5e7e3; --line-2: #d3d7d2;
  --accent: #3b4dbf; --accent-soft: #eceefb;
  --work: #1d6db0; --wait: #8f5700; --wait-dot: #d08f1a; --wait-soft: #fbf1dc; --err: #b53232; --err-soft: #fbeaea; --done: #8a918d;
  --h-claude: #c0643f; --h-codex: #2b8070;
  --diff-add: #e3f3e8; --diff-del: #fbe8e6;
  --hover: color-mix(in srgb, var(--ink) 5%, transparent);
  --shadow: 0 12px 32px color-mix(in srgb, #000 14%, transparent);
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-cap: 12px; --fs-sm: 13px; --fs-ui: 14px; --fs-read: 16px; --fs-title: 16px; --fs-fig: 22px;
  --lh-ui: 20px; --lh-cap: 18px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r1: 6px; --r2: 10px; --r3: 14px;
  --tap: 36px; --row: 34px; --gutter: 32px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141817; --side: #181c1b; --sunken: #222725; --raised: #1b201e; --sk: #252b28;
    --ink: #e6e9e7; --ink-2: #c5cbc7; --muted: #9ba39f; --faint: #6f7773; --line: #2a302d; --line-2: #3d4541;
    --accent: #98a4f3; --accent-soft: #252a45;
    --work: #66b0ef; --wait: #e4a53f; --wait-dot: #e4a53f; --wait-soft: #33280f; --err: #f27c77; --err-soft: #3a1f1d; --done: #7f8783;
    --h-claude: #de8a63; --h-codex: #4fb5a0;
    --diff-add: #173022; --diff-del: #381d1b;
    --hover: color-mix(in srgb, var(--ink) 7%, transparent);
    --shadow: 0 14px 36px color-mix(in srgb, #000 45%, transparent);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #141817; --side: #181c1b; --sunken: #222725; --raised: #1b201e; --sk: #252b28;
  --ink: #e6e9e7; --ink-2: #c5cbc7; --muted: #9ba39f; --faint: #6f7773; --line: #2a302d; --line-2: #3d4541;
  --accent: #98a4f3; --accent-soft: #252a45;
  --work: #66b0ef; --wait: #e4a53f; --wait-dot: #e4a53f; --wait-soft: #33280f; --err: #f27c77; --err-soft: #3a1f1d; --done: #7f8783;
  --h-claude: #de8a63; --h-codex: #4fb5a0;
  --diff-add: #173022; --diff-del: #381d1b;
  --hover: color-mix(in srgb, var(--ink) 7%, transparent);
  --shadow: 0 14px 36px color-mix(in srgb, #000 45%, transparent);
  color-scheme: dark;
}
@media (max-width: 760px) {
  :root { --fs-ui: 15px; --lh-ui: 22px; --fs-title: 17px; --tap: 44px; --row: 44px; --gutter: 16px; }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: var(--fs-ui)/var(--lh-ui) var(--sans); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
dialog:focus-visible, .panel-b:focus-visible { outline: none; }
svg { display: block; }
code, .mono { font-family: var(--mono); font-size: max(.88em, var(--fs-cap)); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.icon { width: 18px; height: 18px; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---- State: one dot and one word, in one place ---------------------------------------------------------------- */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; background: var(--done); }
.dot.work { background: var(--work); }
.dot.wait { background: var(--wait-dot); }
.dot.err { background: var(--err); }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--done); }
.state { display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; color: var(--ink-2); }
.state.wait { color: var(--wait); } .state.err { color: var(--err); }
.spin { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--line-2); border-top-color: var(--work); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Controls: a control looks like one ---------------------------------------------------------------------- */
.ibtn { display: inline-grid; place-items: center; width: var(--tap); height: var(--tap); flex: none; border: 0; border-radius: var(--r2); background: none; color: var(--ink-2); padding: 0; }
.ibtn svg { width: 20px; height: 20px; }
@media (hover: hover) { .ibtn:hover { background: var(--hover); } }
.ibtn[aria-expanded="true"], .ibtn[aria-pressed="true"] { background: var(--sunken); }
.ibtn .pip { position: absolute; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); border: 1px solid var(--line-2); border-radius: var(--r2); background: var(--ground); padding: 0 14px; color: var(--ink); font-weight: 500; }
@media (hover: hover) { .btn:hover { background: var(--sunken); } }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.link { display: inline-flex; align-items: center; gap: 4px; min-height: var(--tap); border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-size: var(--fs-sm); text-align: left; }
@media (hover: hover) { .link:hover { text-decoration: underline; text-underline-offset: 3px; } }
.link svg { width: 16px; height: 16px; }
.who-link { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-align: left; }
@media (hover: hover) { .who-link:hover { text-decoration: underline; text-underline-offset: 3px; } }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--r2); background: var(--sunken); }
.seg button { min-height: calc(var(--tap) - 4px); min-width: 44px; border: 0; border-radius: 8px; background: none; padding: 0 12px; color: var(--muted); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ground); color: var(--ink); box-shadow: 0 1px 2px color-mix(in srgb, #000 12%, transparent); }
.err-text { color: var(--err) !important; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; border: 1px solid var(--line-2); border-radius: 16px; background: var(--ground); padding: 0 12px; color: var(--ink-2); font-size: var(--fs-sm); white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip .n { color: var(--muted); }
.chip[aria-pressed="true"] .n { color: inherit; }
.chip svg { width: 14px; height: 14px; }
.chev { width: 16px; height: 16px; flex: none; color: var(--faint); transition: transform .15s; }
[aria-expanded="true"] > .chev, [aria-expanded="true"] .chev.turns { transform: rotate(90deg); }
.search { display: flex; align-items: center; gap: 8px; min-width: 0; height: var(--tap); padding: 0 10px; border-radius: var(--r2); background: var(--sunken); color: var(--muted); overflow: hidden; }
.search svg { width: 18px; height: 18px; flex: none; }
.search input { flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; padding: 0; color: var(--ink); }
.search input::placeholder { color: var(--muted); }
/* A label: information, never a control. Full values live in its tooltip and in the session menu. */
.lab { display: inline-flex; align-items: center; gap: 5px; flex: none; min-width: 0; white-space: nowrap; }
.badge { display: inline-block; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--sunken); color: var(--muted); font: 500 12px/20px var(--sans); text-align: center; font-variant-numeric: tabular-nums; }
.badge.wait { background: var(--wait-soft); color: var(--wait); }
.badge.err { background: var(--err-soft); color: var(--err); }

/* ---- Shell ------------------------------------------------------------------------------------------------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }
.app.rail { grid-template-columns: 60px minmax(0, 1fr); }
.sidebar { background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-bottom: 16px; }
.main { overflow-y: auto; min-width: 0; position: relative; }
.scrim { display: none; }
.brandrow { display: flex; align-items: center; gap: 8px; flex: none; height: 56px; padding: 0 10px 0 18px; font-weight: 600; font-size: 15px; }
.brandrow .brandname { flex: 1 1 auto; }
.mark { width: 16px; height: 16px; background: var(--ink); -webkit-mask: url(/mark.svg) center / contain no-repeat; mask: url(/mark.svg) center / contain no-repeat; flex: none; }
.brandrow .close { display: none; }
#nav { display: grid; gap: 2px; padding: 0 8px; }
.nav-item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--row); border: 0; border-radius: 8px; background: none; padding: 0 10px; text-align: left; font-weight: 500; color: var(--ink-2); }
.nav-item .icon { color: var(--muted); }
.nav-item > span:not(.badge) { flex: 1 1 auto; }
@media (hover: hover) { .nav-item:hover { background: var(--hover); } }
.nav-item[aria-current="page"] { background: var(--sunken); color: var(--ink); }
.nav-item[aria-current="page"] .icon { color: var(--ink); }
.side-h { margin: 20px 18px 6px; font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: 600; color: var(--muted); }
#lanes { display: grid; padding: 0 8px; }
/* The sidebar tree. A row is one line: state, name, (children: a count that folds them), age. The open session is the
   only highlighted row; its parents are not. Children newest first, five, then "Show N more". */
.treeitem { min-width: 0; }
.tree-row { position: relative; display: flex; align-items: center; gap: 6px; min-height: var(--row); padding: 0 8px; border-radius: 8px; min-width: 0; }
.tree-row:has(.srow[aria-current="page"]) { background: var(--sunken); }
@media (hover: hover) { .tree-row:hover { background: var(--hover); } }
.srow { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; text-align: left; color: var(--ink-2); outline: none; }
.srow::after { content: ""; position: absolute; inset: 0; border-radius: 8px; }
.srow:focus-visible::after { outline: 2px solid var(--accent); outline-offset: -2px; }
.srow .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow[aria-current="page"] { color: var(--ink); font-weight: 500; }
.tree-row .ag { flex: none; min-width: 2.2em; text-align: right; font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; }
.tree-toggle { position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; gap: 1px; height: 22px; border: 0; border-radius: 11px; background: var(--sunken); padding: 0 4px 0 7px; color: var(--muted); font: 500 12px/22px var(--sans); font-variant-numeric: tabular-nums; }
.tree-toggle .chev { width: 14px; height: 14px; color: inherit; }
.tree-toggle.wait { background: var(--wait-soft); color: var(--wait); }
.tree-toggle::before { content: ""; position: absolute; inset: -7px -6px; }
.tree-group { display: grid; margin-left: 12px; padding-left: 6px; border-left: 1px solid var(--line); min-width: 0; }
.tree-group[data-depth="4"] { margin-left: 0; border-left-color: transparent; }
.treeitem[aria-expanded="false"] > .tree-group { display: none; }
#lanes .empty { padding: 8px 10px; }
.tree-more { justify-self: start; min-height: var(--row); border: 0; background: none; padding: 0 8px; color: var(--accent); font-size: var(--fs-sm); }

.topbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; column-gap: 4px; min-height: 56px; padding: 6px 12px 6px 24px; background: var(--ground); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .ttl { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.topbar .l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-weight: 600; font-size: var(--fs-title); line-height: 22px; }
.topbar .t { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb { flex: 0 1 auto; min-width: 0; max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 500; text-align: left; }
.crumb-sep { flex: none; color: var(--faint); font-weight: 400; }
/* After a crumb the title keeps most of the line; the crumb ellipsizes first but never below 30%. */
.topbar .l1 .crumb-sep ~ .t { max-width: 70%; }
@media (hover: hover) { .crumb:hover { text-decoration: underline; text-underline-offset: 3px; } }
.meta-line { display: flex; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; font-size: var(--fs-cap); line-height: var(--lh-cap); color: var(--muted); padding-left: 1px; }
.meta-line .lab + .lab::before { content: "·"; margin: 0 5px; color: var(--faint); }
.meta-line .lab.state .dot { width: 7px; height: 7px; }
.meta-line .lab.state { color: var(--ink-2); }
.meta-line .lab.state.wait { color: var(--wait); } .meta-line .lab.state.err { color: var(--err); }
.meta-line .lab[hidden] { display: none; }
/* A label that leads somewhere looks like the others. Its hit area is padded to the tap size inside the line, whose own box grows by the same amount (the margins cancel it), and only the buttons take clicks. */
.topbar .l1-state { display: none; }
.menu-item .dot { margin: 0 4px; }
.menu-item .menu-note { margin-left: auto; color: var(--accent); font-size: var(--fs-sm); }
@media (max-width: 760px) {
  /* A session's bar is one row on a phone: the menu button, a back chevron for the parent, the title behind its small state dot, then ⋯. The line of
     labels leaves the bar (failed steps and runs are in the ⋯ menu, the rest in its Details). The chevron is a 44 px target like the buttons beside it. */
  .topbar.session-bar .meta-line { display: none; }
  .topbar.session-bar .l1-state { display: inline-flex; flex: none; align-items: center; align-self: center; padding: 12px; margin: -12px -6px; pointer-events: auto; }
  .topbar.session-bar .l1 .crumb { position: relative; flex: none; align-self: center; width: 44px; min-width: 44px; max-width: 44px; overflow: hidden; color: transparent; text-decoration: none; }
  .topbar.session-bar .l1 .crumb::before { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; border-left: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: translate(-30%, -50%) rotate(45deg); }
  .topbar.session-bar .l1 .crumb-sep { display: none; }
  .topbar.session-bar .l1 .crumb ~ .t { flex: 0 1 auto; max-width: none; }
}
.meta-line { padding-top: 10px; padding-bottom: 10px; margin: -10px 0; pointer-events: none; }
.meta-line .lab, .lab-btn { pointer-events: auto; }
.lab-btn { border: 0; background: none; padding: 10px 0; margin: -10px 0; cursor: pointer; }
@media (hover: hover) { .lab-btn:hover { text-decoration: underline; text-underline-offset: 3px; } }
@media (max-width: 760px) { .meta-line { padding-top: 14px; padding-bottom: 14px; margin: -14px 0; } .lab-btn { padding: 14px 0; margin: -14px 0; } }
.topbar .lead { display: none; }
.topbar .find-row { flex: 1 1 auto; display: flex; align-items: center; gap: 4px; min-width: 0; }
.topbar .find-row .search { flex: 1 1 auto; }
.topbar .fcount { flex: none; min-width: 5.5em; padding: 0 4px; color: var(--muted); font-size: var(--fs-cap); text-align: right; }
.find-chips { flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 4px; }

.page { max-width: 760px; margin: 0 auto; padding: 8px var(--gutter) 88px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-content: start; }
.page.wide { max-width: 1200px; }
.page.analytics-page { max-width: 1040px; }
.page > * { min-width: 0; }
.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 -14px; font-size: var(--fs-sm); line-height: 20px; font-weight: 600; color: var(--ink-2); }
.sec-h .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); }
.list > * { min-width: 0; }
/* Rows that are links bleed their hover into the gutter, so their text lines up with the section heading. */
.list:has(> .nrow, > .ib, > .kids-wrap) { margin: 0 -8px; }
.empty { margin: 0; padding: 12px 0; color: var(--muted); font-size: var(--fs-sm); }
.empty-state { display: grid; justify-items: start; gap: 8px; padding: 32px 0 8px; }
.empty-state h2 { margin: 0; font-size: var(--fs-ui); font-weight: 600; }
.empty-state p { margin: 0; max-width: 46ch; color: var(--muted); font-size: var(--fs-sm); }
.notice { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 12px 14px; border-radius: var(--r2); background: var(--sunken); }
.notice > svg { width: 18px; height: 18px; margin-top: 1px; color: var(--muted); }
.notice.error { background: var(--err-soft); }
.notice.error > svg { color: var(--err); }
.notice b { display: block; font-weight: 600; }
.notice span { color: var(--ink-2); font-size: var(--fs-sm); }
.notice .btn { grid-row: 1 / 3; grid-column: 3; align-self: center; }
.divider { display: flex; align-items: center; gap: 10px; font-size: var(--fs-cap); color: var(--muted); }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); min-width: 16px; }

/* ---- Rows in lists: two lines, the name first, the whole row is the link ------------------------------------- */
.nrow { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; align-items: center; width: 100%; min-width: 0; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 11px 8px; margin: 0; text-align: left; border-radius: 0; }
@media (hover: hover) { .nrow:hover { background: var(--hover); } }
.nrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; line-height: var(--lh-ui); }
.nrow .ag { font-size: var(--fs-cap); line-height: var(--lh-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.nrow .for { grid-column: 2 / 4; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-sm); line-height: var(--lh-cap); color: var(--muted); }
.nrow .act { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: var(--fs-sm); line-height: var(--lh-cap); color: var(--ink-2); }
.nrow .act code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.nrow .act .el { margin-left: auto; flex: none; font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; }
.nrow.child { grid-template-columns: 8px minmax(0, 1fr) auto; padding-block: 0; min-height: var(--row); }
.nrow.child .nm { font-weight: 400; color: var(--ink-2); }
.nrow.child .kind, .run-row .kind { margin-left: 6px; color: var(--muted); font-weight: 400; }
.kids { display: grid; margin-left: 11px; padding-left: 13px; border-left: 1px solid var(--line); }
.kids .nrow { border-bottom: 0; }
.kids-wrap { display: grid; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.kids-wrap > .nrow { border-bottom-color: transparent; }

/* ---- Home ------------------------------------------------------------------------------------------------- */
.ib { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 4px; align-items: start; padding: 14px 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
@media (hover: hover) { .ib:hover { background: var(--hover); } }
.ib > svg { width: 18px; height: 18px; margin-top: 1px; color: var(--wait); }
.ib.quiet > svg { color: var(--faint); }
.ib .ln { min-width: 0; font-size: var(--fs-sm); line-height: 20px; color: var(--muted); }
.ib .ln .who { color: var(--ink); font-weight: 600; }
.ib .tm { font-size: var(--fs-cap); line-height: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ib .q { grid-column: 2 / 4; font: var(--fs-read)/1.45 var(--serif); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ib.quiet .q { color: var(--ink-2); font-size: 15px; -webkit-line-clamp: 2; }
.ib .ctx { grid-column: 2 / 4; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-cap); line-height: var(--lh-cap); color: var(--muted); }
.ib .ans { grid-column: 2 / 4; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-sm); color: var(--ink-2); }
.list .more { justify-self: start; }

/* ---- Session: messages ------------------------------------------------------------------------------------ */
.transcript { display: grid; grid-template-columns: minmax(0, 1fr); }
.turns { display: grid; grid-template-columns: minmax(0, 1fr); }
.turns > * { min-width: 0; }
.turn { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 18px 0; border-radius: 6px; transition: background-color .6s ease, box-shadow .6s ease; }
.turn > * { min-width: 0; }
.turn + .turn::before { content: ""; position: absolute; top: 0; left: 0; right: 0; border-top: 1px solid var(--line); }
.turn.flash { background: var(--accent-soft); box-shadow: 0 0 0 8px var(--accent-soft); transition: none; }
.tx { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.tx > * { min-width: 0; }
.turn-h { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: var(--fs-sm); line-height: 20px; color: var(--muted); margin-bottom: -6px; }
.turn-h .who-link { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turn-h .tm, .ev-head .tm { margin-left: auto; padding-left: 8px; flex: none; font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; }
.msg .body { overflow-wrap: anywhere; }
.msg.user, .bubble { justify-self: end; max-width: min(85%, 600px); background: var(--sunken); border-radius: 18px; padding: 9px 14px; }
.msg.user .body, .bubble .body { font-size: 15px; line-height: 1.45; }
.bubble.in { justify-self: start; border-radius: 18px; background: none; border: 1px solid var(--line); max-width: min(92%, 640px); }
.msg-tm { justify-self: end; margin-top: -10px; font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; }
.msg.assistant { max-width: 68ch; }
/* Wide mode is for reading with room: the prose caps lift, so replies and briefs use the whole column. */
.page.wide .msg.assistant { max-width: none; }
.page.wide .msg.user, .page.wide .bubble { max-width: 85%; }
.page.wide .bubble.in { max-width: 92%; }
.msg.assistant .body { font: var(--fs-read)/1.5 var(--serif); color: var(--ink); }
.body p { margin: 0 0 8px; } .body > :last-child { margin-bottom: 0; }
.body code, .cc-brief code, .ev-text code, .ib code { font-size: .86em; background: color-mix(in srgb, var(--ink) 6%, transparent); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.md p { margin: 0 0 8px; } .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; } .md li + li { margin-top: 2px; }
.md li > ul, .md li > ol { margin: 2px 0 0; } .md > :last-child, .md li > :last-child { margin-bottom: 0; }
.md .mh { margin: 12px 0 4px; font-weight: 600; color: var(--ink); } .md .mh1 { font-size: 1.2em; } .md .mh2 { font-size: 1.1em; } .md > .mh:first-child { margin-top: 0; }
.md blockquote { margin: 0 0 8px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--ink-2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.md a, .answer a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
/* Code and tables scroll inside their own box, with an edge fade that says so. The page never scrolls sideways. */
.md .codeblock, .md .tbl { position: relative; margin: 0 0 8px; max-width: 100%; overflow-x: auto; border-radius: 8px; }
.md .codeblock { background: var(--sunken); }
.md .codeblock pre { margin: 0; padding: 8px 12px; width: max-content; min-width: 100%; font: 12.5px/1.5 var(--mono); white-space: pre; color: var(--ink-2); }
.md .tbl { border: 1px solid var(--line); }
.md table { border-collapse: collapse; min-width: 100%; font-family: var(--sans); font-size: var(--fs-sm); line-height: 1.4; }
.md th, .md td { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); min-width: 5em; }
.md tr:last-child td { border-bottom: 0; }
.md th { font-weight: 600; background: var(--sunken); }
.answer ol { margin: 2px 0 0; padding-left: 20px; } .answer.none { color: var(--muted); }
.harness-note { font-size: var(--fs-cap); color: var(--muted); }
.thought { display: grid; gap: 3px; max-width: 68ch; padding-left: 12px; border-left: 1px solid var(--line-2); color: var(--muted); font-family: var(--sans); }
.thought.masked { padding-block: 0; }
.think-label { font-size: var(--fs-cap); font-weight: 600; letter-spacing: .04em; line-height: 1.4; color: var(--muted); }
.thought.masked .think-label { font-weight: 400; letter-spacing: 0; font-size: var(--fs-sm); }
.think-pending { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: var(--fs-sm); }
.think-text { min-width: 0; overflow-wrap: anywhere; color: var(--muted); font: calc(var(--fs-sm) + 1px)/1.55 var(--sans); }
.think-text .mh { color: var(--ink-2); }
.think-text code { font-size: .88em; background: var(--sunken); padding: 1px 5px; border-radius: 5px; }

/* ---- Session: steps. A run of calls folds into one line; a step opens in place, command first --------------- */
.tgroup { display: grid; grid-template-columns: minmax(0, 1fr); }
.tsum, .step > button, .step.live { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; min-height: var(--tap); border: 0; background: none; margin: -4px 0; padding: 4px 8px; margin-left: -8px; width: calc(100% + 16px); border-radius: 8px; text-align: left; color: var(--ink-2); font-size: var(--fs-sm); line-height: 20px; }
@media (hover: hover) { .tsum:hover, .step > button:hover { background: var(--hover); } }
.tsum > svg:first-child, .step > button > svg:first-child { width: 16px; height: 16px; flex: none; color: var(--muted); }
.tsum .tt { flex: 0 1 auto; min-width: 0; }
.tsum .tf { flex: none; color: var(--err); }
.tsum .chev, .step .chev { margin-left: auto; }
.steps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.tgroup > .steps { padding: 6px 0 2px 24px; }
.step .sv { flex: none; color: var(--ink-2); }
.step .sa { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-size: 12.5px; }
.step .sd { flex: none; margin-left: auto; padding-left: 8px; font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; }
.step .sd + .chev { margin-left: 0; }
.step.err .sd { color: var(--err); }
.step.live { color: var(--ink-2); }
.out { margin: 6px 0 10px; border-radius: var(--r2); background: var(--sunken); overflow: hidden; }
.out .io { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 0; font-size: var(--fs-cap); color: var(--muted); }
.out pre { margin: 0; padding: 4px 12px 10px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
.out pre.in { color: var(--ink); }
.out pre.in + .io { border-top: 1px solid var(--line); }
.out .noout { padding: 4px 12px 10px; font-size: var(--fs-sm); color: var(--muted); }
.out .io .link, .viewer-b .vs .link { min-height: 32px; margin: -6px 0; font-size: var(--fs-cap); }
.out .viewall { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: var(--tap); border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font-size: var(--fs-sm); }
.out .viewall svg { width: 15px; height: 15px; }
.diff { font: 12px/1.5 var(--mono); padding: 4px 0 8px; }
.diff div { padding: 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .add { background: var(--diff-add); } .diff .del { background: var(--diff-del); } .diff .ctx { color: var(--muted); }

/* ---- Session: other sessions. A child is a card that opens it; a relay or message is an event row --------- */
.child-card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; width: 100%; min-width: 0; border: 1px solid var(--line-2); border-radius: var(--r3); background: var(--ground); padding: 12px 14px; text-align: left; color: var(--ink); }
@media (hover: hover) { .child-card:hover { background: var(--hover); border-color: var(--faint); } }
.cc-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cc-name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.cc-head .state { margin-left: auto; font-size: var(--fs-cap); }
.cc-head .chev { margin-left: 2px; }
.cc-meta { font-size: var(--fs-cap); line-height: var(--lh-cap); color: var(--muted); }
.cc-brief { margin-top: 4px; font-size: var(--fs-sm); line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.cc-now { display: flex; align-items: center; gap: 7px; min-width: 0; margin-top: 4px; font-size: var(--fs-sm); color: var(--ink-2); }
.cc-now code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-result { margin-top: 4px; font-size: var(--fs-sm); line-height: 1.45; color: var(--ink-2); overflow-wrap: anywhere; }
.cc-result .rl, .ev-result .rl { color: var(--muted); }
.cc-result.err .rl { color: var(--err); }
.event { display: grid; grid-template-columns: 18px minmax(0, 1fr); column-gap: 10px; row-gap: 4px; min-width: 0; }
.event > * { grid-column: 2; min-width: 0; }
.ev-head { grid-column: 1 / 3; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 10px; align-items: baseline; font-size: var(--fs-sm); line-height: 20px; color: var(--muted); }
.ev-head > svg { width: 16px; height: 16px; align-self: center; color: var(--muted); }
.ev-head .ln { min-width: 0; overflow-wrap: anywhere; }
.ev-head .who { color: var(--ink); font-weight: 600; }
.event.waiting .ev-head > svg { color: var(--wait); }
.ev-text { font-size: var(--fs-ui); line-height: 1.5; color: var(--ink-2); overflow-wrap: anywhere; max-height: 4.5em; overflow: hidden; }
.ev-text.clipped { -webkit-mask-image: linear-gradient(#000 calc(100% - 1.5em), transparent); mask-image: linear-gradient(#000 calc(100% - 1.5em), transparent); }
.ev-text.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
.ev-more { justify-self: start; margin: -8px 0 -6px; }
.ev-result { font-size: var(--fs-sm); line-height: 1.45; color: var(--ink-2); overflow-wrap: anywhere; }
.event .state { font-size: var(--fs-sm); }
.turn-end { display: flex; align-items: center; gap: 12px; min-height: var(--tap); margin: -6px 0 -8px; font-size: var(--fs-sm); }
.turn-end .link { margin-left: auto; }

/* Jump to the latest: centred over the transcript column, sticky at its foot. */
.jump-wrap { overflow-anchor: none; margin-top: -24px; position: sticky; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; height: 0; display: flex; justify-content: center; pointer-events: none; }
@media (max-width: 760px) { .jump-wrap { margin-top: -16px; } }
.jump { pointer-events: auto; transform: translateY(-100%); display: inline-flex; align-items: center; gap: 6px; height: 40px; min-width: 40px; border: 1px solid var(--line-2); border-radius: 20px; background: var(--raised); padding: 0 12px; color: var(--ink-2); font-size: var(--fs-sm); font-weight: 500; box-shadow: 0 4px 14px color-mix(in srgb, #000 12%, transparent); }
.jump svg { width: 18px; height: 18px; }

/* ---- Panels: the phone's bottom sheet, the desktop's dialog or menu ----------------------------------------- */
html.panel-open, html.panel-open body { overflow: hidden; }
dialog.panel { padding: 0; border: 1px solid var(--line); color: var(--ink); background: var(--raised); box-shadow: var(--shadow); overflow: hidden; }
dialog.panel[open] { display: flex; flex-direction: column; }
dialog.panel::backdrop { background: color-mix(in srgb, #000 40%, transparent); }
.panel-h { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.panel-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600; }
.panel-sub { grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-cap); color: var(--muted); }
.panel-h .ibtn { grid-row: 1 / 3; grid-column: 2; }
.panel-b { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 20px; }
.panel-sec { padding: 14px 0 0; }
.panel-sec + .panel-sec { margin-top: 14px; border-top: 1px solid var(--line); }
.panel-sec > h3 { margin: 0 0 6px; font-size: var(--fs-cap); font-weight: 600; color: var(--muted); }
.menu-list { display: grid; margin: 0 -8px; }
.menu-item { display: flex; align-items: center; gap: 12px; min-height: var(--tap); border: 0; border-radius: 8px; background: none; padding: 0 8px; text-align: left; color: var(--ink); }
@media (hover: hover) { .menu-item:hover { background: var(--hover); } }
.menu-item .icon { color: var(--muted); }
.menu-item > span:not(.switch) { flex: 1 1 auto; min-width: 0; }
.menu-item .aside { flex: none; color: var(--muted); font-size: var(--fs-sm); }
.switch { flex: none; position: relative; width: 34px; height: 20px; border-radius: 10px; background: var(--line-2); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ground); box-shadow: 0 1px 2px color-mix(in srgb, #000 25%, transparent); }
[aria-checked="true"] > .switch { background: var(--accent); }
[aria-checked="true"] > .switch::after { left: 16px; }
.kv { display: grid; grid-template-columns: minmax(96px, auto) minmax(0, 1fr); column-gap: 0; margin: 0; font-size: var(--fs-sm); }
.kv dt { padding: 7px 16px 7px 0; color: var(--muted); border-bottom: 1px solid var(--line); }
.kv dd { margin: 0; padding: 7px 0; color: var(--ink); text-align: right; overflow-wrap: anywhere; border-bottom: 1px solid var(--line); user-select: text; -webkit-user-select: text; }
.kv dd.mono { font-size: 12px; }
.kv > :nth-last-child(-n+2) { border-bottom: 0; }
.cost-fig { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.cost-big { font-size: var(--fs-fig); font-weight: 600; font-variant-numeric: tabular-nums; }
.cost-cap { color: var(--ink-2); font-size: var(--fs-sm); }
.cost-note { margin: 4px 0 8px; color: var(--muted); font-size: var(--fs-cap); line-height: var(--lh-cap); }
.run-row { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 16px; align-items: center; gap: 2px 10px; width: 100%; min-height: var(--tap); border: 0; border-bottom: 1px solid var(--line); background: none; padding: 6px 0; text-align: left; }
@media (hover: hover) { .run-row:hover { background: var(--hover); } }
.run-row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-sm); color: var(--ink); }
.run-row .kind { color: var(--muted); }
.run-row .v { font-size: var(--fs-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.run-row.depth1 .nm { padding-left: 14px; }
.disclose { display: flex; align-items: center; gap: 6px; width: 100%; min-height: var(--tap); border: 0; background: none; padding: 0; color: var(--ink-2); font-size: var(--fs-sm); font-weight: 500; text-align: left; }
.disclose .chev { margin-left: auto; }
.tok-model { margin-top: 8px; font-size: var(--fs-cap); color: var(--muted); font-family: var(--mono); }
.tok-line { display: grid; grid-template-columns: minmax(0, 1fr) auto 5.5em; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; }
.tok-line span:not(:first-child) { text-align: right; color: var(--ink-2); }
.no-price { color: var(--muted); font-size: var(--fs-cap); }
.viewer-b pre { margin: 0; padding: 10px 12px; border-radius: var(--r2); background: var(--sunken); font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
.viewer-b pre.in { color: var(--ink); }
.viewer-b .vs { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; font-size: var(--fs-cap); color: var(--muted); }
.viewer-b .diff { border-radius: var(--r2); background: var(--sunken); }
.viewer-b .vnote { margin: 8px 0 0; font-size: var(--fs-cap); color: var(--muted); }
.panel .field { display: grid; gap: 4px; min-width: 0; font-size: var(--fs-cap); color: var(--muted); }
.panel .field select { width: 100%; min-width: 0; height: var(--tap); border: 1px solid var(--line-2); border-radius: 8px; background: var(--ground); color: var(--ink); padding: 0 8px; font-size: var(--fs-sm); }
.facet-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel-foot { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
@media (max-width: 760px) {
  dialog.panel { position: fixed; inset: auto 0 0; width: 100%; max-width: none; max-height: 88vh; max-height: 88dvh; margin: 0; border-radius: 16px 16px 0 0; border-bottom: 0; }
  dialog.panel.full { top: 0; height: 100%; max-height: none; border-radius: 0; }
  .panel-h { padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  dialog.panel:not(.full) .panel-h::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line-2); }
  dialog.panel:not(.full) .panel-h { position: relative; padding-top: 16px; }
  .panel-b { padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .panel-foot { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 761px) {
  dialog.panel { width: min(640px, calc(100vw - 48px)); max-height: 84vh; margin: auto; border-radius: var(--r3); }
  dialog.panel.anchored { position: fixed; inset: 60px 16px auto auto; width: 400px; max-height: calc(100vh - 80px); margin: 0; }
  dialog.panel.anchored::backdrop { background: transparent; }
  dialog.panel.full { width: min(760px, calc(100vw - 48px)); }
}

/* ---- Trace: a timeline of the agents, then the handoffs ---------------------------------------------------- */
.tl { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.tl h2, .flow-h { margin: 0; font-size: var(--fs-ui); font-weight: 600; }
.tl-sum { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 2px 0 10px; color: var(--muted); font-size: var(--fs-sm); }
.tl-axis, .agent-row { display: grid; grid-template-columns: 220px 64px 64px minmax(0, 1fr); align-items: center; min-width: 0; }
.tl-axis { height: 22px; }
.tl-ticks { grid-column: 4; position: relative; height: 22px; }
.tl-ticks span { position: absolute; bottom: 2px; font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; transform: translateX(-50%); }
.tl-ticks span.start { transform: none; }
.tl-ticks span.end { transform: translateX(-100%); }
.tl-legend { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: var(--fs-cap); color: var(--muted); }
.tl-legend i { width: 14px; height: 6px; border-radius: 3px; background: var(--ink); }
.tl-chart { position: relative; display: grid; min-width: 0; border-top: 1px solid var(--line); }
.agent-row { position: relative; width: 100%; min-height: 44px; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 0; text-align: left; color: var(--ink); }
@media (hover: hover) { .agent-row:hover { background: var(--hover); } }
.agent-label { display: grid; min-width: 0; padding: 4px 8px 4px 0; }
.agent-name { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: var(--fs-sm); font-weight: 500; line-height: 18px; }
.agent-name > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-name .dot { width: 7px; height: 7px; }
.agent-meta { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 14px; font-size: var(--fs-cap); line-height: 16px; color: var(--muted); }
.agent-dur, .agent-cost { font-size: var(--fs-cap); color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; padding-right: 10px; white-space: nowrap; }
.agent-track { position: relative; align-self: stretch; min-width: 0; }
.agent-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.seg-busy, .seg-idle { position: absolute; top: 50%; min-width: 2px; transform: translateY(-50%); border-radius: 3px; background: var(--faint); }
.seg-busy { height: 8px; }
.seg-idle { height: 2px; opacity: .8; }
.agent-row.crit .seg-busy, .agent-row.crit .seg-idle { background: var(--ink); opacity: 1; }
.tl-edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

  // ---- Sessions: every top-level session, its runs beneath it ----------------------------------------------------------

  // ---- Loading: skeletons that hold the final layout's geometry --------------------------------------------------------
  const skLine = (w) => { const i = el("i", "sk"); i.style.width = w; return i; };
  // In a flex row a bare placeholder has no line box; wrapped in a span it takes the same line height as the text.
  const skText = (w) => { const s = el("div"); s.style.flex = "1 1 auto"; s.style.minWidth = "0"; s.append(skLine(w)); return s; };
  const W = ["62%", "48%", "71%", "55%", "66%", "40%", "58%", "69%"];
  function skeletonLanes() {
    const box = el("div", "loading"); box.setAttribute("aria-busy", "true"); box.setAttribute("aria-label", "Loading sessions");
    for (let i = 0; i < 7; i++) { const it = el("div", "treeitem"), row = el("div", "tree-row"), s = el("span", "srow"); const nm = el("span", "nm"); nm.append(skLine(W[i])); s.append(el("span", "dot sk-dot"), nm); row.append(s, el("span", "ag")); row.lastChild.append(skLine("1.6em")); it.append(row); box.append(it); }

  }
  const skRow = (i) => { const r = el("div", "nrow"); const nm = el("span", "nm"), ag = el("span", "ag"), f = el("span", "for"); nm.append(skLine(W[i % 8].replace("%", "") * .6 + "%")); ag.append(skLine("1.8em")); f.append(skLine(W[(i + 3) % 8])); r.append(el("span", "dot sk-dot"), nm, ag, f); return r; };
  function renderLoading(page, r) {
    const box = el("div", "loading"); box.setAttribute("aria-busy", "true"); box.style.display = "grid"; box.style.gap = "24px"; box.style.minWidth = "0";
    if (r.v === "sessions") {

      const tools = el("div", "list-tools"), fr = el("label", "search"), fi = el("input"); fi.type = "search"; fi.placeholder = "Search sessions"; fi.disabled = true; fr.append(icon(I.search), fi); const fb = btn("ibtn filter-btn", null, "Filter and group"); fb.append(icon(I.filter)); fb.disabled = true; tools.append(fr, fb); page.append(tools);
      const list = el("div", "list"); for (let i = 0; i < 9; i++) list.append(skRow(i)); box.append(list); box.setAttribute("aria-label", "Loading sessions");
    } else if (r.v === "session") {
      const s = SESS[r.id]; renderTopbar(s.name, null, { session: s, line2: sessionLine(s) });

      box.append(transcriptSkeleton());
    } else if (r.v === "analytics") {
      page.classList.add("analytics-page"); renderTopbar("Analytics"); analyticsTools(page); box.setAttribute("aria-label", "Loading analytics");
      const cap = el("p", "an-cap"); cap.append(skLine("48%")); box.append(cap);
      const m = el("div", "metrics"); for (let i = 0; i < 8; i++) { const x = el("div", "metric"), a = el("div", "label"), b = el("div", "value"), c = el("div", "note"); a.append(skLine("58%")); b.append(skLine("44%")); c.append(skLine("36%")); x.append(a, b, c); m.append(x); } box.append(m);
      for (const t of ["Agents at work", "Cost over time"]) { const p = el("section", "an-panel"), h = el("h2"), sb = el("div", "sub"), ch = el("div", "an-chart sk-block"), lg = el("div", "legend"); h.append(skLine("34%")); sb.append(skLine("52%")); lg.append(skText("30%")); p.append(h, sb, ch, lg); p.setAttribute("aria-label", t); box.append(p); }
    } else if (r.v === "trace") {
      const s = SESS[r.sid]; renderTopbar("Trace", { label: s.name, go: () => goSession(r.sid) }); box.setAttribute("aria-label", "Loading trace");
      const tl = el("section", "tl"), h = el("h2"), sum = el("div", "tl-sum"), lg = el("div", "tl-legend"), ax = el("div", "tl-axis"), ch = el("div", "tl-chart"); h.append(skLine("22%")); sum.append(skText("56%")); lg.append(skText("38%")); ax.append(el("span", "pad"), el("span", "pad"), el("span", "pad"), el("span", "tl-ticks"));
      for (let i = 0; i < 5; i++) { const row = el("div", "agent-row"), lb = el("span", "agent-label"), nm = el("span", "agent-name"), mt = el("span", "agent-meta"), d = el("span", "agent-dur"), c = el("span", "agent-cost"), tr = el("span", "agent-track"); nm.style.paddingLeft = (i ? 14 : 0) + "px"; nm.append(el("span", "dot sk-dot"), skText(W[i])); mt.append(skLine("50%")); d.append(skLine("2.4em")); c.append(skLine("2.4em")); const bar = el("i", "sk"); bar.style.position = "absolute"; bar.style.top = "50%"; bar.style.height = "8px"; bar.style.marginTop = "-4px"; bar.style.left = [0, 4, 14, 14, 52][i] + "%"; bar.style.width = [100, 12, 60, 34, 30][i] + "%"; tr.append(bar); lb.append(nm, mt); row.append(lb, d, c, tr); ch.append(row); }
      tl.append(h, sum, lg, ax, ch); box.append(tl, flowSkeleton());
    }
    page.append(box);
  }
  function transcriptSkeleton() {
    const turns = el("div", "turns");
    const t1 = el("section", "turn"), tx1 = el("div", "tx"); const u = el("div", "msg user"), ub = el("div", "body"); ub.append(skLine("16em")); ub.style.width = "16em"; ub.style.maxWidth = "100%"; u.append(ub);
    const a = el("div", "msg assistant"), ab = el("div", "body"); for (const w of ["96%", "88%", "54%"]) { const p = el("p"); p.append(skLine(w)); ab.append(p); } a.append(ab);
    const g = el("div", "tsum"); g.style.cursor = "default"; const gi = el("span", "sk"); gi.style.width = "16px"; gi.style.flex = "none"; g.append(gi, skText("46%"));
    const a2 = el("div", "msg assistant"), ab2 = el("div", "body"); for (const w of ["92%", "63%"]) { const p = el("p"); p.append(skLine(w)); ab2.append(p); } a2.append(ab2);
    tx1.append(u, a, g, a2); t1.append(tx1); turns.append(t1); return turns;
  }
  function olderSkeleton() {
    const o = el("div", "older loading"); o.setAttribute("aria-busy", "true"); o.setAttribute("aria-label", "Loading earlier entries");
    o.append(el("div", "older-cap", "Loading earlier entries"));
    for (const ws of [["90%", "72%"], ["84%", "58%", "40%"]]) { const a = el("div", "msg assistant"), b = el("div", "body"); for (const w of ws) { const p = el("p"); p.append(skLine(w)); b.append(p); } a.append(b); o.append(a); const g = el("div", "tsum"); g.append(skText("42%")); o.append(g); }

  function flowSkeleton() {
    const f = el("div", "flow"); for (let i = 0; i < 3; i++) { const h = el("div", "hop" + (i ? " child" : "")), n = el("div", "node"), b = el("div", "body"), s = el("div", "sent"), t = el("div", "ev-text"); n.classList.add("sk-dot"); s.append(skLine("48%")); t.append(skLine("92%"), el("br"), skLine("64%")); b.append(s, t); h.append(n, b); f.append(h); } return f;
  }
  // Skeleton geometry check: the skeleton's rows must sit where the loaded rows will. Rendered side by side offscreen,
  // compared row by row; a mismatch over 1 px is reported as a console error, which the screenshot run records.
  function checkSkeleton(v) {
    // Rows are compared by height, and by position while the loaded layout has the same rows in the same order: a
    // parent's runs land beneath it, below the fold of the first rows.
    const pairs = { sessions: [[".list > .nrow, .kids-wrap > .nrow:not(.child)", 1]], analytics: [[".metric", 8], [".an-panel", 2]], trace: [[".agent-row", 5]] }[v] ?? [];
    const live = $("#page"), probe = el("div", "page " + live.className.replace("page", "").trim()); probe.style.cssText = "position:absolute;left:0;top:0;width:" + live.getBoundingClientRect().width + "px;visibility:hidden;pointer-events:none;"; live.parentElement.append(probe);
    const saved = loadingView; loadingView = null;
    if (v === "sessions") renderSessions(probe); else if (v === "analytics") renderAnalytics(probe); else if (v === "trace") renderTrace(probe, route.turn);
    loadingView = saved;
    const report = [];
    let compared = 0;
    for (const [sel, tops] of pairs) {
      const a = [...live.querySelectorAll(sel)], b = [...probe.querySelectorAll(sel)], n = Math.min(a.length, b.length);
      if (!n) report.push(sel + ": nothing to compare");
      for (let i = 0; i < n; i++) { compared++; const ra = a[i].getBoundingClientRect(), rb = b[i].getBoundingClientRect(), la = live.getBoundingClientRect(), lb = probe.getBoundingClientRect(); const dy = i < tops ? Math.abs((ra.top - la.top) - (rb.top - lb.top)) : 0, dh = Math.abs(ra.height - rb.height); if (dy > 1 || dh > 1) report.push(sel + "[" + i + "] top " + Math.round(ra.top - la.top) + " vs " + Math.round(rb.top - lb.top) + ", height " + Math.round(ra.height) + " vs " + Math.round(rb.height)); }
    }
    probe.remove();
    if (report.length) console.error("skeleton geometry differs from the loaded layout: " + report.slice(0, 6).join("; "));
    else console.info("skeleton geometry matches the loaded layout for " + v + " (" + compared + " rows)");
    document.documentElement.dataset.skeleton = report.length ? "differs" : "matches";
    return report;
  }

  // ---- Drawer (phone) -------------------------------------------------------------------------------------------------
  const sidebar = $("#sidebar");
  function openDrawer() { if (!phone.matches) return; document.body.classList.add("drawer-open"); $("#lead-btn")?.setAttribute("aria-expanded", "true"); }
  function closeDrawer(quiet) { if (!document.body.classList.contains("drawer-open")) return; document.body.classList.remove("drawer-open"); const b = $("#lead-btn"); b?.setAttribute("aria-expanded", "false"); if (!quiet) b?.focus(); }
  $("#drawer-close").addEventListener("click", () => closeDrawer());
  $("#scrim").addEventListener("click", () => closeDrawer());
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); if (e.key === "/" && !/INPUT|SELECT/.test(document.activeElement?.tagName ?? "")) { e.preventDefault(); go({ v: "sessions" }); $("#sq")?.focus(); } });
  let sx = null;
  sidebar.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  sidebar.addEventListener("touchmove", (e) => { if (sx !== null && e.touches[0].clientX - sx < -50) { sx = null; closeDrawer(); } }, { passive: true });
  phone.addEventListener("change", () => { closeDrawer(true); const top = currentScroll(); render(); restoreScroll(top); });

  // The review harness drives the mockup through its own router; nothing else uses this.
  window.mock = {
    go, goSession, goTrace, openDrawer, setRailMode, setWideMode,
    menu: () => openSessionMenu(SESS[route.id], $("#more-btn")),
    find: (opts = {}) => { findOpen = true; Object.assign(show, opts.show ?? {}); find = opts.text ?? ""; render(); },
    loading: (r) => { loadingView = r.v; go(r); if (r.v !== "session") requestAnimationFrame(() => requestAnimationFrame(() => checkSkeleton(r.v))); },
    turnOf: (hid) => STARTS.get(hid)?.id ?? HOLDS.get(hid)?.id,
    scrollTop: () => { if (phone.matches) window.scrollTo(0, 0); else $("#main").scrollTop = 0; },
    reveal: (sel) => { const n = document.querySelector(sel); if (n) n.scrollIntoView({ block: "center" }); return !!n; },
  };
  try { history.scrollRestoration = "manual"; history.replaceState({ ...route, scrollTop: 0 }, ""); } catch {}
  render();
})();

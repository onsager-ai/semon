name: ASI Jev standalone experiment

on:
  push:
    branches: [experiment/asi-jev, experiment/asi-jev-real]
    paths:
      - experiments/asi-jev/**
      - .github/workflows/asi-jev.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify experiment and reproduce deterministic baseline
        run: |
          if test -n "$(git ls-files experiments/asi-jev/private)"; then
            echo 'Private evaluation artifacts must never be tracked.'
            exit 1
          fi
          python3 -m unittest discover -s experiments/asi-jev -p 'test_*.py' -v
          python3 experiments/asi-jev/load_probe.py --help
          python3 experiments/asi-jev/projection_probe.py --help
          python3 experiments/asi-jev/real_matrix.py --help
          python3 experiments/asi-jev/benchmark.py --strategy rules --context prefix --out "$RUNNER_TEMP/asi-jev-reproduced" --run-id ci
          python3 experiments/asi-jev/benchmark.py --strategy rules --context offline --out "$RUNNER_TEMP/asi-jev-reproduced" --run-id ci
          python3 experiments/asi-jev/analyze.py
      - name: Retain experiment outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asi-jev-offline
          path: experiments/asi-jev/results
          if-no-files-found: warn
      - name: Retain fresh deterministic replay separately from measured trials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asi-jev-reproduced-rules
          path: ${{ runner.temp }}/asi-jev-reproduced
          if-no-files-found: warn

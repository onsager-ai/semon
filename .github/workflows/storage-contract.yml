name: Native storage contract
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - task/479-pg-facts-20261026
      - task/479-pg-catalog-20261026
      - task/477-current-transfer-20261027
permissions:
  contents: read
concurrency:
  group: storage-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting independently of compilation
        id: rustfmt
        run: cargo fmt --all --check
      - name: Prepare formatting patch for thermal-restricted review
        if: failure() && steps.rustfmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/storage-rustfmt.patch"
      - name: Retain exact formatting patch
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: storage-rustfmt
          path: ${{ runner.temp }}/storage-rustfmt.patch
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Inventory native SQLite coupling
        run: python3 scripts/check-native-storage-boundary.py
  conformance:
    runs-on: ubuntu-latest
    env:
      SEMON_PRICING_REFRESH: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-storage-${{ hashFiles('Cargo.lock') }}
      - name: Production host API callers compile
        id: production
        run: cargo check --locked --workspace --all-targets
      - name: Authenticated published proof rollback and reader lifetime
        id: published_proofs
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for test in oversized_catalog_publication_refuses_without_changing_published_proofs published_proofs_follow_catalog_references_and_survive_gc_until_last_reader_drop; do
            case_result=0
            cargo test --locked -p semon-sessions --lib "events::store::chunk_proofs::tests::$test" -- --exact --nocapture > "$RUNNER_TEMP/published-proof-case.log" 2>&1 || case_result=$?
            if ! grep -Eq 'running [1-9][0-9]* tests?' "$RUNNER_TEMP/published-proof-case.log"; then case_result=1; fi
            cat "$RUNNER_TEMP/published-proof-case.log" >> "$RUNNER_TEMP/published-proof-tests.log"
            echo "CASE name=$test status=$case_result" >> "$RUNNER_TEMP/published-proof-tests.log"
            if [ "$case_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/published-proof-tests.log"
          exit "$result"
      - name: Retain authenticated published proof result
        if: ${{ !cancelled() && steps.published_proofs.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-proof-tests
          path: ${{ runner.temp }}/published-proof-tests.log
      - name: Authenticated Catalog repricing transactions
        id: reprice_authority
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for group in direct_catalog_reprice configured_semantic_reprice_preserves_stage_only_authority current_transfer_catalog_reprice_preserves_imported_original_authority events::store::reprice::tests::; do
            group_result=0
            cargo test --locked -p semon-sessions --lib "$group" -- --nocapture > "$RUNNER_TEMP/reprice-authority-case.log" 2>&1 || group_result=$?
            if ! grep -Eq 'running [1-9][0-9]* tests?' "$RUNNER_TEMP/reprice-authority-case.log"; then group_result=1; fi
            cat "$RUNNER_TEMP/reprice-authority-case.log" >> "$RUNNER_TEMP/reprice-authority.log"
            echo "GROUP name=$group status=$group_result" >> "$RUNNER_TEMP/reprice-authority.log"
            if [ "$group_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/reprice-authority.log"
          exit "$result"
      - name: Retain repricing authority result
        if: ${{ !cancelled() && steps.reprice_authority.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reprice-authority
          path: ${{ runner.temp }}/reprice-authority.log
      - name: Current and retained observation contracts
        id: retained_contracts
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for group in configured_semantic_domain52_identity_pid_and_parent_transition_preserves_custody configured_semantic_domain61_late_child_restarts_complete_native_cohort configured_semantic_selected65_private_witness_is_bound_independently_of_rows configured_semantic_real_model_claude_replacement_rollback_stale_and_history archived_event_index_survives_absence_without_current_membership retained_projection_falls_back_to_history_only_when_main_omits_path transcript_snapshot_keeps_original_recipes_during_an_active_append retained_history_list_keeps_indexed_fields_and_positions_across_append; do
            group_result=0
            cargo test --locked -p semon-sessions --lib "$group" -- --nocapture > "$RUNNER_TEMP/retained-contract-case.log" 2>&1 || group_result=$?
            if ! grep -Eq 'running [1-9][0-9]* tests?' "$RUNNER_TEMP/retained-contract-case.log"; then group_result=1; fi
            cat "$RUNNER_TEMP/retained-contract-case.log" >> "$RUNNER_TEMP/retained-contract-tests.log"
            echo "GROUP name=$group status=$group_result" >> "$RUNNER_TEMP/retained-contract-tests.log"
            if [ "$group_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/retained-contract-tests.log"
          exit "$result"
      - name: Retain current and retained contract results
        if: ${{ !cancelled() && steps.retained_contracts.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-contract-tests
          path: ${{ runner.temp }}/retained-contract-tests.log
      - name: Retained row authority diagnostic (not qualification)
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        env:
          SEMON_BUILD_TIMING: "1"
        run: |
          cargo test --locked -p semon-sessions --lib configured_semantic_real_model_claude_replacement_rollback_stale_and_history -- --nocapture > "$RUNNER_TEMP/retained-authority.log" 2>&1 || true
          python3 - <<'PYSAFE'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          prefixes = (
              'semon sessions native: observation_direct_grant_',
              'semon sessions native: observation_stage_refused ',
              'test result:',
          )
          with (root / 'retained-authority.log').open() as source:
              lines = [line.rstrip()[:1024] for line in source if line.startswith(prefixes)]
          (root / 'retained-authority-diagnostic.txt').write_text('\n'.join(lines[:30]))
          PYSAFE
      - name: Retain bounded row authority diagnostic
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-authority-diagnostic
          path: ${{ runner.temp }}/retained-authority-diagnostic.txt
      - name: Selected recovery range authority reconciliation
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: cargo test --locked -p semon-sessions --lib query::tests::recovery_tests::recovery_native_long_session_pages_and_tool_expansion_measurement -- --exact --nocapture
      - name: Selected recovery owner proof and rollback contracts
        id: recovery_owner
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: |
          result=0
          for test in recovery_history_helper_contract_updates_only_authorized_owner_for_reused_key recovery_ordinary_direct_capture_transfers_to_producer_retired_history recovery_stage_only_preimage_authenticates_before_inserting_current_grant recovery_query_row_and_grant_roll_back_when_grant_update_fails recovery_tampered_preimage_refuses_before_producer_reads_or_writes recovery_selected_repair_cancellation_rolls_back_publication recovery_index_ahead_repriced_snapshot_uses_bound_global_runtime recovery_direct_capture_does_not_mask_a_damaged_semantic_owner recovery_immutable_corruption_blocks_selected_bytes_and_preimage_publication recovery_ordinary_index_advance_supersedes_the_old_semantic_source; do
            case_result=0
            cargo test --locked -p semon-sessions --lib "query::tests::recovery_tests::$test" -- --exact --nocapture > "$RUNNER_TEMP/recovery-owner-case.log" 2>&1 || case_result=$?
            if ! grep -Eq 'running [1-9][0-9]* tests?' "$RUNNER_TEMP/recovery-owner-case.log"; then case_result=1; fi
            cat "$RUNNER_TEMP/recovery-owner-case.log" >> "$RUNNER_TEMP/recovery-owner-tests.log"
            echo "CASE name=$test status=$case_result" >> "$RUNNER_TEMP/recovery-owner-tests.log"
            if [ "$case_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/recovery-owner-tests.log"
          exit "$result"
      - name: Retain selected recovery owner results
        if: ${{ !cancelled() && steps.recovery_owner.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-owner-tests
          path: ${{ runner.temp }}/recovery-owner-tests.log
      - name: Current SQLite transfer inbox restart and atomic checkpoint
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: cargo test --locked -p semon-sessions --lib current_transfer225 -- --nocapture
      - name: Current owner recovery custody search and navigation
        id: current_owner
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: |
          result=0
          for group in configured::tests::current_recovery:: current_history_custody:: catalog_namespace::current_navigation_tests:: sqlite::navigation::tests:: source_journal::tests:: catalog_search::sqlite_tests:: native_usage_ events::store::summary_tests:: source_chunks::tests:: causal_trace::; do
            group_result=0
            cargo test --locked -p semon-sessions --lib "$group" -- --nocapture > "$RUNNER_TEMP/current-owner-group.log" 2>&1 || group_result=$?
            if ! grep -Eq 'running [1-9][0-9]* tests?' "$RUNNER_TEMP/current-owner-group.log"; then
              group_result=1
              echo "NO_MATCH group=$group" >> "$RUNNER_TEMP/current-owner-tests.log"
            fi
            cat "$RUNNER_TEMP/current-owner-group.log" >> "$RUNNER_TEMP/current-owner-tests.log"
            echo "GROUP group=$group status=$group_result" >> "$RUNNER_TEMP/current-owner-tests.log"
            if [ "$group_result" -ne 0 ]; then result=1; fi
          done
          tail -150 "$RUNNER_TEMP/current-owner-tests.log"
          exit "$result"
      - name: Retain current owner test results
        if: ${{ !cancelled() && steps.current_owner.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-owner-tests
          path: ${{ runner.temp }}/current-owner-tests.log
      - name: Capture bounded native-tree append diagnostic
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: |
          cargo test --locked -p semon-sessions --lib configured_semantic_domain94_receipt_order_ties_append_and_restart_oracle -- --nocapture > "$RUNNER_TEMP/native-tree-test.log" 2>&1 || true
          cargo test --locked -p semon-sessions --lib default_local_viewer_advertises_a_nonempty_stable_catalog_source -- --nocapture >> "$RUNNER_TEMP/native-tree-test.log" 2>&1 || true
          cargo test --locked -p semon-sessions --lib catalog::tests::native_codex_archive_unarchive_reuses_the_indexed_generation -- --exact --nocapture > "$RUNNER_TEMP/native-archive-test.log" 2>&1 || true
          cat "$RUNNER_TEMP/native-archive-test.log" >> "$RUNNER_TEMP/native-tree-test.log"
          python3 - <<'PYSAFE'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          lines = []
          native_sqlite_read_errors = []
          native_archive_diagnostics = []
          archive_prefixes = (
              'native_archive_read_error ', 'native_sqlite_read_error ',
              'storage_sqlite_failure ', 'native catalog phase='
          )
          for line in (root / 'native-archive-test.log').open():
              line = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', line)[:490].rstrip()
              if line.startswith(archive_prefixes):
                  native_archive_diagnostics.append(
                      line
                      if line.startswith('native_archive_read_error ')
                      else 'native archive ' + line
                  )
          for line in (root / 'native-tree-test.log').open():
              line = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', line)[:490].rstrip()
              if line.startswith('native_sqlite_read_error '):
                  native_sqlite_read_errors.append(line)
              elif line.startswith(('native tree statement=', 'native tree metadata_scope=', 'native tree digest_argument=', 'native SQL stage=', 'native catalog phase=', 'configured SQL value=', 'source recovery step=', 'source recovery refusal=', 'source-journal phase=', 'native diagnostic route=', 'storage_sqlite_failure ', 'test result:')):
                  lines.append(line)
              elif match := re.search(r'panicked at (crates/[A-Za-z0-9_./-]+:\d+:\d+):', line):
                  lines.append('native diagnostic panic=' + match.group(1))
          retained = (native_archive_diagnostics + native_sqlite_read_errors + lines)[:30]
          (root / 'native-tree-diagnostic.txt').write_text('\n'.join(retained))
          PYSAFE
      - name: Retain bounded native-tree diagnostic
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-tree-diagnostic
          path: ${{ runner.temp }}/native-tree-diagnostic.txt
      - name: Default admitted current Source restart and isolation
        run: |
          cargo test --locked -p semon-sessions --lib default_current_source_admission_preserves_restart_replay_and_isolation -- --nocapture
          cargo test --locked -p semon-sessions --lib current_source_recovery_replays_terminal_done_and_keeps_other_sources -- --nocapture
      - name: Canonical namespace factory structure and drift refusal
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: cargo test --locked -p semon-sessions --lib native_usage_authored_assembly_preserves_factories_and_complete_dependencies -- --nocapture
      - name: Native Claude name and owned member replay qualification
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: cargo test --locked -p semon-sessions --lib configured_semantic_domain94 -- --nocapture
      - name: Native frontier physical-work qualification
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: cargo test --locked -p semon-sessions --lib configured_semantic_domain84_native_frontier_vm_work_is_indexed -- --nocapture
      - name: Current native store admission and nonmutation
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: |
          cargo test --locked -p semon-sessions --lib events::store::tests::unsupported_ -- --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tests::current_reopen_keeps_wal_reader_and_concurrent_publication -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tests::storage_initialization_holds_its_lock_through_the_first_wal_switch -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tests::storage_open_rechecks_a_concurrent_version_change_before_writes -- --exact --nocapture
      - name: Direct Catalog grant retention and snapshot qualification
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: cargo test --locked -p semon-sessions --lib events::store::tests::direct_catalog_ -- --nocapture
      - name: SQLite adapter and reusable metadata conformance
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: |
          cargo test --locked -p semon-sessions --lib storage::catalog::catalog135_source_prefix_identity_keeps_nullable_and_unsigned_semantics -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib catalog_search::tests:: -- --nocapture
          cargo test --locked -p semon-sessions --lib reported_rows -- --nocapture
          cargo test --locked -p semon-sessions --lib reported_runs -- --nocapture
          cargo test --locked -p semon-sessions --lib recovery_scalar119_sqlite_current_record_refusal_preserves_bytes -- --nocapture
          cargo test --locked -p semon-sessions --lib configured_reported_runs_corruption_and_ownership_refuse_before_effect -- --nocapture
          cargo test --locked -p semon-sessions --lib storage:: -- --nocapture
          cargo test --locked -p semon-sessions --lib storage::sqlite::source_journal::tests::discovery_batch_ -- --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tests::recovery_ -- --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tree_state::namespace_tests:: -- --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests:: -- --nocapture
          SEMON_TEST_NOW=1795000000000 cargo test --locked -p semon-sessions --features test-clock --lib events::store::configured::tests::selected57::selected60::configured_semantic_selected71_active_call_uses_ordinary_clock_and_refuses_before_raw -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tests::cold_discovery_committed_witness_skips_repeated_work_and_recovers_changes_and_rollback_aba -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tests::cold_discovery_cached_witness_preserves_contract_and_namespace_refusals -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_two_source_publication_ack_finish_and_head -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_competing_publisher_and_begin_zero_writes -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_publication_faults_rollback_ack_proof_and_hints -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_publication_replay_is_idempotent -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_replacement_retains_history_and_fences_stale_publisher -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_scoped_search_effects_replace_and_rollback -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_real_model_two_source_query_metadata_and_transcript -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_t1_same_runtime_takeover_retains_progress_and_fences_epoch -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_t2_different_runtime_takeover_scopes_reset -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_t3_active_old_epoch_cannot_take_back_successor -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_t4_quiescent_post_finish_takeover_fences_new_handle -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_t5_same_runtime_takeover_rolls_back_whole_database -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_t6_listing_readiness_does_not_qualify_other_readers -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_model_refuses_noncurrent_schema_and_changed_raw_zero_writes -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_real_model_claude_replacement_rollback_stale_and_history -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tests::current_history_custody:: -- --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_two_sources_same_db_ingest_and_stage_isolated -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_two_sources_same_db_rollback_and_reopen_isolated -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_two_sources_cross_namespace_capability_refused_zero_writes -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_public_factory_still_refuses_second_source -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_runtime_capability_is_crate_private_and_public_factory_stays_closed -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_batch_reduces_events_native_keys_frontier_scoped -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_reset_and_reduction_rollback_zero_partial_writes -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_ingest_begin_batch_record_uses_real_claim_and_generation -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_namespace_factories_keep_rollback_and_restart_isolated -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_stale_record_and_admission_refuse_without_writes -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tests::copied_usage_layout_is_warmed_by_actual_producer_and_selected_factories -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib native_timing::tests::cleanup_prepare_failure_preserves_error_without_zero_vm_work_or_record -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib native_timing::tests::cold_discovery_progress_separates_active_pages_from_continuation_gaps -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_support_ingest_isolates_witnesses_restart_and_rollback -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_support_mixed_family_refuses_before_ingest -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_stage_authored_keys_preserve_collisions_and_refuse_unported_consumers -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_support_cache_rejects_transient_and_corrupt_layouts -- --exact --nocapture

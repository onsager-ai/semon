# Diagnostic branch only: exact product plus this workflow; never merge to product.
name: Native storage contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting independently of compilation
        id: rustfmt
        run: cargo fmt --all --check
      - name: Prepare formatting patch for thermal-restricted review
        if: failure() && steps.rustfmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/storage-rustfmt.patch"
      - name: Retain exact formatting patch
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: storage-rustfmt
          path: ${{ runner.temp }}/storage-rustfmt.patch
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Inventory native SQLite coupling
        run: python3 scripts/check-native-storage-boundary.py
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEMON_PRICING_REFRESH: "off"
      SEMON_PG_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_f1 password=ephemeral-f1 dbname=postgres connect_timeout=2"
      SEMON_PG_ADMIN_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=ephemeral-ci-admin dbname=postgres connect_timeout=2"
      SEMON_PG_SOURCE_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_source password=ephemeral-source dbname=postgres connect_timeout=2"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-storage-${{ hashFiles('Cargo.lock') }}
      - name: Record exact tested product and diagnostic revisions
        run: |
          git rev-parse HEAD HEAD^ | tee "$RUNNER_TEMP/477-integration-revisions.txt"
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/storage-contract.yml'
      - name: Create ephemeral restricted application roles
        env:
          PGPASSWORD: ephemeral-ci-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE semon_f1 LOGIN PASSWORD 'ephemeral-f1' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT, CREATE ON DATABASE postgres TO semon_f1;
          CREATE ROLE semon_source LOGIN PASSWORD 'ephemeral-source' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE postgres TO semon_source;
          SQL
      - name: Production host API callers compile
        id: production
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/477-integration-production.log"
      - name: Compile focused PostgreSQL-feature tests once
        id: compile
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls --no-run 2>&1 | tee "$RUNNER_TEMP/477-integration-compile.log"
      - name: Baseline 34 and Lane A B E exact focused cases
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          case_number=0
          for test in \
            events::store::tests::direct_catalog_history_grants_preserve_only_existing_producer_metadata \
            catalog::tests::codex_child_pages_use_complete_parent_calls_across_sibling_pages \
            catalog::tests::codex_child_page_keeps_a_done_parent_context_only \
            catalog::tests::codex_relation_closure_excludes_unrelated_pending_claude_source \
            catalog::tests::codex_relation_corrupt_context_after_prefix_is_fatal \
            catalog::tests::claude_owner_closure_accepts_64_and_refuses_65_during_identity \
            model::tests::resumable_rich_codex_family_survives_owner_loss_and_late_native_append \
            model::tests::catalog_runtime_staged_parent_turn_survives_bidirectional_message_pages \
            model::tests::catalog_runtime_staged_publication_replays_large_incident_relationships \
            model::tests::staged_agent_messages_match_the_shared_builder_without_duplicate_relations \
            model::tests::staged_claude_ambiguity_and_received_copy_policy_match_shared_builder \
            model::tests::staged_identity_reprepares_copy_resume_split_across_source_pages \
            model::tests::causal_peer_names_do_not_invent_branch_turns_or_reuse_stale_evidence \
            model::tests::causal_peer_name_does_not_follow_a_reused_cross_harness_key \
            model::tests::partial_lineage_source_disappearance_preserves_natural_history_context \
            model::tests::staged_current_native_key_ignores_deselected_or_rewritten_cached_codex_header \
            model::tests::partial_lineage_unsupported_recipes_remain_visible_and_block_eviction \
            model::tests::incomplete_original_history_with_current_lifecycle_stays_unavailable \
            catalog::tests::semantic_overview_retention_reads_only_the_admitted_namespace_for_a_shared_key \
            catalog::tests::semantic_summary_overflow_rolls_back_prior_row_and_defers_whole_next_group \
            catalog::tests::semantic_summary_overflow_refuses_a_singleton_publication_group \
            catalog::tests::semantic_stage_publishes_summary_and_trace_without_query_recipes \
            catalog::tests::semantic_stage_summary_overflow_preflights_before_trace_publication \
            catalog::tests::semantic_stage_retained_input_overflow_is_aggregated_without_current_overviews \
            events::store::configured::tests::domain52::presentation_capture_overflow::aggregate_overflow_rolls_back_then_halves_and_rebinds_admission \
            events::store::configured::tests::domain52::presentation_capture_overflow::stale_wider_oversized_retry_preserves_narrower_hint_and_prior_receipt \
            events::store::configured::tests::domain52::presentation_capture_overflow::later_oversized_record_keeps_prior_group_receipt_and_continues_same_epoch \
            events::store::configured::tests::domain52::presentation_capture_overflow::recorded_same_selection_blocks_permuted_oversized_request \
            events::store::configured::tests::domain52::presentation_capture_overflow::oversized_identity_or_claim_mismatch_does_not_write_a_hint \
            events::store::configured::tests::domain52::presentation_capture_overflow::one_oversized_record_refuses_without_a_publication_receipt_but_keeps_typed_refusal \
            events::store::configured::tests::domain52::presentation_capture_overflow::overflow_rejects_a_missing_exact_model_receipt \
            events::store::configured::tests::domain52::presentation_capture_overflow::one_oversized_physical_group_keeps_its_receipt_and_stays_pending \
            native_evidence::catalog_owner_tests::deferred_publication_record_keeps_native_producer_pending_in_same_epoch \
            storage::sqlite::source_journal::tests::configured_catalog_pending_selector_respects_large_exclusion_union \
            catalog::tests::semantic_stage_retains_multisource_history_refs_across_recomposition \
            storage::proof_codec::tests::presentation_manifest_requires_a_valid_catalog_generation \
            catalog::tests::ordinary_empty_catalog_moves_current_receipt_to_history \
            events::store::tests::ordinary_receipt_rejects_missing_or_duplicate_projections_without_mutation \
            catalog::tests::semantic_stage_history_ref_budget_overflow_rolls_back_and_defers \
            events::store::tests::ordinary_receipt_exact_replay_and_partial_or_mismatched_rows_are_atomic \
            storage::postgres::source_journal::tests::pg_catalog_pending_selector_prioritizes_selected_and_excludes_before_fifo_limit \
            storage::postgres::source_journal::tests::pg_catalog_pending_selector_accepts_maximum_queue_exclusions_without_writes \
            source_change::append_plan_requires_a_well_formed_custody_generation; do
            case_number=$((case_number+1))
            case_log="$RUNNER_TEMP/477-integration-case-$case_number.log"
            case_result=0
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls "$test" -- --exact --nocapture --test-threads=1 > "$case_log" 2>&1 || case_result=$?
            if ! grep -Fq 'running 1 test' "$case_log"; then case_result=1; fi
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$case_log"; then case_result=1; fi
            echo "CASE number=$case_number name=$test expected=1 status=$case_result" | tee -a "$RUNNER_TEMP/477-integration-summary.txt"
            if [ "$case_result" -ne 0 ]; then tail -n 65 "$case_log"; result=1; fi
          done
          exit "$result"
      - name: Native search History continuation and selector groups
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          group_number=0
          for specification in \
            native_evidence::catalog_owner_tests::cold_catalog_search_:24 \
            storage::catalog::history_composition_tests:::3 \
            storage::sqlite::history::verified_history_tests:::5 \
            storage::catalog::source_continuation_tests:::4 \
            model::relation_stage::selector_metadata_tests:::2; do
            group_number=$((group_number+1))
            group="${specification%:*}"
            expected="${specification##*:}"
            group_log="$RUNNER_TEMP/477-integration-group-$group_number.log"
            group_result=0
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls "$group" -- --nocapture --test-threads=1 > "$group_log" 2>&1 || group_result=$?
            if ! grep -Fq "running $expected tests" "$group_log"; then group_result=1; fi
            if ! grep -Fq "test result: ok. $expected passed; 0 failed;" "$group_log"; then group_result=1; fi
            echo "GROUP number=$group_number name=$group expected=$expected status=$group_result" | tee -a "$RUNNER_TEMP/477-integration-summary.txt"
            tail -n 50 "$group_log"
            if [ "$group_result" -ne 0 ]; then result=1; fi
          done
          exit "$result"
      - name: Shared context integrity and released Lane D exact gates
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          case_number=0
          for test in \
            events::store::tests::ordinary_capture_budget_falls_back_and_replay_is_receiptless \
            model::tests::pg_catalog_page_crosses_batch_boundary_with_tied_timestamps \
            model::tests::pg_semantic_stage_empty_probe_resumes_without_mutation \
            storage::postgres::semantic_stage::publication_refusal_tests::aggregate_and_count_only_refusals_remain_busy \
            model::tests::pg_post_ingest_staged_publication_diagnoses_large_bidirectional_message_pages \
            storage::postgres::source_journal::tests::pg_codex_header_search_projection_tracks_metadata_commit_and_delete; do
            case_number=$((case_number+1))
            case_log="$RUNNER_TEMP/477-integration-added-$case_number.log"
            case_result=0
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls "$test" -- --exact --nocapture --test-threads=1 > "$case_log" 2>&1 || case_result=$?
            if ! grep -Fq 'running 1 test' "$case_log"; then case_result=1; fi
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$case_log"; then case_result=1; fi
            echo "ADDED number=$case_number name=$test expected=1 status=$case_result" | tee -a "$RUNNER_TEMP/477-integration-summary.txt"
            tail -n 40 "$case_log"
            if [ "$case_result" -ne 0 ]; then result=1; fi
          done
          exit "$result"
      - name: Released Lane D PostgreSQL search groups
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          group_number=0
          for specification in \
            storage::postgres::catalog_effects::tests::pg_catalog124_:5 \
            storage::postgres::source_journal::tests::pg_catalog_search_:2; do
            group_number=$((group_number+1))
            group="${specification%:*}"
            expected="${specification##*:}"
            group_log="$RUNNER_TEMP/477-integration-d-group-$group_number.log"
            group_result=0
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls "$group" -- --nocapture --test-threads=1 > "$group_log" 2>&1 || group_result=$?
            if ! grep -Fq "running $expected tests" "$group_log"; then group_result=1; fi
            if ! grep -Fq "test result: ok. $expected passed; 0 failed;" "$group_log"; then group_result=1; fi
            echo "D_GROUP number=$group_number name=$group expected=$expected status=$group_result" | tee -a "$RUNNER_TEMP/477-integration-summary.txt"
            tail -n 40 "$group_log"
            if [ "$group_result" -ne 0 ]; then result=1; fi
          done
          exit "$result"
      - name: Strict PostgreSQL feature Clippy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p semon-sessions --all-targets --features postgres-test-tls -- --no-deps -D warnings 2>&1 | tee "$RUNNER_TEMP/477-integration-clippy.log"
      - name: Verify tested sources and lockfile remain exact
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Retain full integration evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 477-integration-diagnostic
          path: ${{ runner.temp }}/477-integration-*

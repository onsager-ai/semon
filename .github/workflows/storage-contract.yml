# Diagnostic branch only: exact product plus this workflow; never merge to product.
name: Native storage contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting independently of compilation
        id: rustfmt
        run: cargo fmt --all --check
      - name: Prepare formatting patch for thermal-restricted review
        if: failure() && steps.rustfmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/storage-rustfmt.patch"
      - name: Retain exact formatting patch
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: storage-rustfmt
          path: ${{ runner.temp }}/storage-rustfmt.patch
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Inventory native SQLite coupling
        run: python3 scripts/check-native-storage-boundary.py
  float-roundtrip-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Demonstrate exact decimal parsing requirement independently
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/float-control/src"
          cd "$RUNNER_TEMP/float-control"
          cat > Cargo.toml <<'EOF'
          [package]
          name = "float-control"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          serde_json = "=1.0.150"
          [features]
          exact = ["serde_json/float_roundtrip"]
          EOF
          cat > src/main.rs <<'EOF'
          fn main() {
              let mut drift = 0;
              for base in [0.0001_f64, 0.01, 0.1, 1.0] {
                  for offset in 0..64 {
                      let original = f64::from_bits(base.to_bits() + offset);
                      let text = serde_json::to_string(&original).unwrap();
                      let decoded: f64 = serde_json::from_str(&text).unwrap();
                      drift += usize::from(original.to_bits() != decoded.to_bits());
                  }
              }
              println!("exact={} drifted_native_costs={drift}/256", cfg!(feature="exact"));
              assert_eq!(drift == 0, cfg!(feature="exact"));
          }
          EOF
          cargo run --quiet
          cargo run --quiet --features exact
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEMON_PRICING_REFRESH: "off"
      SEMON_PG_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_f1 password=ephemeral-f1 dbname=postgres connect_timeout=2"
      SEMON_PG_ADMIN_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=ephemeral-ci-admin dbname=postgres connect_timeout=2"
      SEMON_PG_SOURCE_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_source password=ephemeral-source dbname=postgres connect_timeout=2"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-storage-${{ hashFiles('Cargo.lock') }}
      - name: Record exact tested product and diagnostic revisions
        run: |
          git rev-parse HEAD HEAD^ | tee "$RUNNER_TEMP/477-integration-revisions.txt"
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/storage-contract.yml'
      - name: Create ephemeral restricted application roles
        env:
          PGPASSWORD: ephemeral-ci-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE semon_f1 LOGIN PASSWORD 'ephemeral-f1' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT, CREATE ON DATABASE postgres TO semon_f1;
          CREATE ROLE semon_source LOGIN PASSWORD 'ephemeral-source' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE postgres TO semon_source;
          SQL
      - name: Production host API callers compile
        id: production
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/477-integration-production.log"
      - name: Compile focused PostgreSQL-feature tests once
        id: compile
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls --no-run 2>&1 | tee "$RUNNER_TEMP/477-integration-compile.log"
      - name: Reproduce unchanged ordinary model and inspect retained fixture
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          SEMON_BUILD_TIMING=1 cargo test --locked -p semon-sessions --lib --features postgres-test-tls storage::postgres::catalog_effects::tests::businessflow::pg_vertical140_ordinary_model_after_ingest_and_restart_without_sqlite -- --exact --nocapture --test-threads=1 > "$RUNNER_TEMP/477-model-forensic.log" 2>&1 || true
          python3 - <<'PY' | tee "$RUNNER_TEMP/477-model-digests.log"
          import glob, hashlib, json, os, sqlite3
          def sha(value): return hashlib.sha256(value.encode()).hexdigest()
          def diffs(a,b,path=''):
              if isinstance(a,dict) and isinstance(b,dict):
                  return [p for k in set(a)|set(b) for p in diffs(a.get(k),b.get(k),path+'/'+k)]
              if isinstance(a,list) and isinstance(b,list) and len(a)==len(b):
                  return [p for k,(x,y) in enumerate(zip(a,b)) for p in diffs(x,y,path+'/'+str(k))]
              return [] if a==b else [path]
          saved=[]
          for root in glob.glob('/tmp/pg124-*'):
              for base,dirs,files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in ['claude','codex','copilot','proc']]
                  for name in files:
                      path=os.path.join(base,name)
                      with open(path,'rb') as f: header=f.read(16)
                      if header != b'SQLite format 3\x00': continue
                      db=sqlite3.connect('file:'+path+'?mode=ro',uri=True)
                      tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                      if 'storage_catalog_native_observation_grants' not in tables: continue
                      print('DATABASE',path)
                      for ns,key,kind,grant in db.execute("SELECT namespace,session_key,owner_kind,metadata_digest FROM storage_catalog_native_observation_grants WHERE session_key IN ('related154','related191','one') ORDER BY session_key,owner_kind LIMIT 12"):
                          current=db.execute('SELECT metadata FROM session_catalog WHERE namespace=? AND session_key=?',(ns,key)).fetchone()
                          history=db.execute('SELECT metadata FROM session_history_catalog WHERE namespace=? AND session_key=?',(ns,key)).fetchone()
                          print('GRANT',key,kind,grant)
                          for label,stored in [('current',current),('history',history)]:
                              if not stored: continue
                              text=stored[0]; row=json.loads(text); normalized=dict(row,lifecycle='current')
                              if 'oracle-withdraw201' in path and kind=='catalog' and label=='current': saved.append({'metadata':text,'grant':grant})
                              stage=db.execute('SELECT value FROM meta WHERE namespace=? AND key=?',(ns,'catalog_native_observation:'+sha(json.dumps(normalized,separators=(',',':'),ensure_ascii=False)))).fetchone()
                              print('STAGE_GRANT',key,label,stage)
                              print('ROW',label,'raw_hash',sha(text),'lifecycle',row['lifecycle'],'normalized_hash',sha(json.dumps(normalized,separators=(',',':'),ensure_ascii=False)))
                              for rid,reference,metadata in db.execute("SELECT g.id,f.kind,g.metadata FROM storage_proof_refs f JOIN storage_proof_generations g ON g.namespace=f.namespace AND g.id=f.id AND g.session_key=f.session_key WHERE f.namespace=? AND f.session_key=? ORDER BY f.kind,g.id LIMIT 8",(ns,key)):
                                  original=json.loads(metadata)
                                  changed=diffs(normalized,original)
                                  print('PROOF',reference,rid,'raw_hash',sha(metadata),'grant_matches',sha(metadata)==grant,'changed_paths',changed[:20])
                                  if not changed and metadata!=json.dumps(normalized,separators=(',',':'),ensure_ascii=False):
                                      print('KEY_ORDERS','stored_query',list(row.get('query',{})),'proof_query',list(original.get('query',{})))
                          proof_rows=db.execute("SELECT metadata FROM storage_proof_generations WHERE namespace=? AND session_key=? ORDER BY id LIMIT 64",(ns,key)).fetchall()
                          print('GRANT_PROOF_MATCHES',sum(sha(p[0])==grant for p in proof_rows),'proof_count',len(proof_rows))
                      db.close()
          with open(os.environ['RUNNER_TEMP']+'/477-model-rows.json','w') as f: json.dump(saved,f)
          PY
          mkdir -p "$RUNNER_TEMP/row-probe/src"
          python3 - <<'PY'
          import os,re
          summary=open('crates/semon-sessions/src/model/summary.rs').read()
          pricing=open('crates/semon-sessions/src/pricing.rs').read()
          def struct(text,name):
              start=text.index('pub(crate) struct '+name+' {')
              end=text.index('\n}',start)+2
              return '#[derive(serde::Serialize,serde::Deserialize)]\n'+text[start:end]+'\n'
          row=struct(summary,'CatalogRow').replace('crate::pricing::Cost','Cost')
          row=re.sub(r'pub\(crate\) (overview|trace|query_recipe):[^\n]+',r'pub(crate) \1: Option<Value>,',row)
          cost=struct(pricing,'Cost')
          model=struct(pricing,'ModelCost').replace('    #[serde(deserialize_with = "cost_kinds")]\n','').replace("BTreeMap<&'static str, f64>",'BTreeMap<String, f64>')
          source=struct(summary,'CatalogSource')
          prefix='use serde_json::Value; use std::collections::BTreeMap; use std::path::PathBuf; use sha2::{Digest,Sha256}; type CatalogLifecycle=String;\n'
          code=prefix+row+source+cost+model+struct(pricing,'CostTokens')
          code+='''
          fn diff(a:&Value,b:&Value,path:&str) {
              if let (Some(a),Some(b))=(a.as_object(),b.as_object()) {
                  for (key,value) in a { diff(value,&b[key],&format!("{path}/{key}")); }
              } else if let (Some(a),Some(b))=(a.as_array(),b.as_array()) {
                  for (i,(a,b)) in a.iter().zip(b).enumerate() { diff(a,b,&format!("{path}/{i}")); }
              } else if a!=b { println!("DIFF {path} input={a} typed={b}"); }
          }
          fn main() {
              let input=std::fs::read_to_string(std::env::args().nth(1).unwrap()).unwrap();
              let cases:Vec<Value>=serde_json::from_str(&input).unwrap();
              for case in cases {
                  let text=case["metadata"].as_str().unwrap();
                  let mut row:CatalogRow=serde_json::from_str(text).unwrap();
                  row.lifecycle="current".into();
                  let typed=serde_json::to_string(&row).unwrap();
                  let mut value:Value=serde_json::from_str(text).unwrap();
                  value["lifecycle"]="current".into();
                  let raw=value.to_string();
                  println!("TYPED hash={:x} grant={} input_hash={:x}",Sha256::digest(typed.as_bytes()),case["grant"],Sha256::digest(raw.as_bytes()));
                  diff(&value,&serde_json::to_value(&row).unwrap(),"");
                  if let Some(i)=typed.bytes().zip(raw.bytes()).position(|(a,b)|a!=b) {
                      let start=i.saturating_sub(40);
                      println!("BYTE_DIFF offset={i} typed={:?} input={:?}",typed.get(start..(i+80).min(typed.len())),raw.get(start..(i+80).min(raw.len())));
                  }
              }
          }
          '''
          root=os.environ['RUNNER_TEMP']+'/row-probe'
          open(root+'/src/main.rs','w').write(code)
          open(root+'/Cargo.toml','w').write('[package]\nname="row-probe"\nversion="0.0.0"\nedition="2024"\n[dependencies]\nserde={version="1",features=["derive"]}\nserde_json={version="=1.0.150",features=["preserve_order","float_roundtrip"]}\nsha2="0.10.9"\n')
          PY
          cargo run --quiet --manifest-path "$RUNNER_TEMP/row-probe/Cargo.toml" -- "$RUNNER_TEMP/477-model-rows.json" | tee "$RUNNER_TEMP/477-model-typed.log"
      - name: Retain unchanged-product model forensic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 477-model-forensic
          path: ${{ runner.temp }}/477-model-*

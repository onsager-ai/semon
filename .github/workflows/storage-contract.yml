# Diagnostic branch only; never integrate this replacement workflow.
name: Native storage contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMON_PRICING_REFRESH: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-storage-${{ hashFiles('Cargo.lock') }}
      - name: Resolve optional driver lock in CI
        run: cargo metadata --format-version 1 > "$RUNNER_TEMP/477-history-metadata.json"
      - name: Compile focused tests once
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls --no-run 2>&1 | tee "$RUNNER_TEMP/477-history-compile.log"
      - name: Three shared planner and three SQLite receipt tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          group_number=0
          for group in storage::catalog::history_composition_tests:: storage::sqlite::history::verified_history_tests::; do
            group_number=$((group_number+1))
            output="$RUNNER_TEMP/477-history-group-$group_number.log"
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls "$group" -- --nocapture --test-threads=1 > "$output" 2>&1 || result=1
            if ! grep -Fq 'test result: ok. 3 passed; 0 failed;' "$output"; then result=1; fi
            tail -n 50 "$output"
          done
          exit "$result"
      - name: Real disappearance and deferred custody regressions
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          case_number=0
          for test in model::tests::partial_lineage_source_disappearance_preserves_natural_history_context model::tests::partial_lineage_unsupported_recipes_remain_visible_and_block_eviction catalog::tests::semantic_summary_overflow_refuses_a_singleton_publication_group; do
            case_number=$((case_number+1))
            output="$RUNNER_TEMP/477-history-case-$case_number.log"
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls "$test" -- --exact --nocapture --test-threads=1 > "$output" 2>&1 || result=1
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$output"; then result=1; fi
            tail -n 55 "$output"
          done
          exit "$result"
      - name: Formatting
        id: formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee "$RUNNER_TEMP/477-history-format.log"
      - name: Prepare formatting patch
        if: ${{ !cancelled() && steps.formatting.outcome == 'failure' }}
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/477-history-format.patch"
      - name: Storage boundary
        if: ${{ !cancelled() }}
        run: python3 scripts/check-native-storage-boundary.py
      - name: Strict focused Clippy
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p semon-sessions --all-targets --features postgres-test-tls -- --no-deps -D warnings 2>&1 | tee "$RUNNER_TEMP/477-history-clippy.log"
      - name: Retain exact diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 477-history-diagnostic
          path: ${{ runner.temp }}/477-history-*

# Diagnostic-only measurement. This branch must never merge into product.
name: Native storage contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SEMON_PRICING_REFRESH: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-storage-${{ hashFiles('Cargo.lock') }}
      - name: Record measurement revision and changes
        run: |
          git rev-parse HEAD HEAD^ | tee "$RUNNER_TEMP/477-measure-revisions.txt"
          git diff --stat HEAD^ HEAD | tee "$RUNNER_TEMP/477-measure-changes.txt"
      - name: Measure unchanged case 2 at its original refusal
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls catalog::tests::codex_child_pages_use_complete_parent_calls_across_sibling_pages -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-measure-case-2.log"
      - name: Preserve measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 477-context-measurement
          path: ${{ runner.temp }}/477-measure-*

# Diagnostic branch only; never integrate this replacement workflow.
name: Native storage contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMON_PRICING_REFRESH: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-storage-${{ hashFiles('Cargo.lock') }}
      - name: Compile focused tests once
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --no-run 2>&1 | tee "$RUNNER_TEMP/477-refusal-compile.log"
      - name: Genuine 360-round refusal and existing 80-round success
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for test in catalog_runtime_staged_publication_replays_large_incident_relationships catalog_runtime_staged_parent_turn_survives_bidirectional_message_pages; do
            output="$RUNNER_TEMP/477-refusal-$test.log"
            cargo test --locked -p semon-sessions --lib "model::tests::$test" -- --exact --nocapture --test-threads=1 > "$output" 2>&1 || result=1
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$output"; then result=1; fi
            tail -n 45 "$output"
          done
          exit "$result"
      - name: Existing aggregate and singleton overflow invariants
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::domain52::presentation_capture_overflow:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-refusal-overflow.log"
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/477-refusal-overflow.log"
      - name: Formatting
        id: formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee "$RUNNER_TEMP/477-refusal-format.log"
      - name: Prepare formatting patch
        if: ${{ !cancelled() && steps.formatting.outcome == 'failure' }}
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/477-refusal-format.patch"
      - name: Storage boundary
        if: ${{ !cancelled() }}
        run: python3 scripts/check-native-storage-boundary.py
      - name: Strict focused Clippy
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p semon-sessions --all-targets -- --no-deps -D warnings 2>&1 | tee "$RUNNER_TEMP/477-refusal-clippy.log"
      - name: Retain exact diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 477-refusal-diagnostic
          path: ${{ runner.temp }}/477-refusal-*

name: Native storage contract
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - task/479-pg-facts-20261026
      - task/479-pg-catalog-20261026
      - task/477-current-transfer-20261027
permissions:
  contents: read
concurrency:
  group: storage-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting independently of compilation
        id: rustfmt
        run: cargo fmt --all --check
      - name: Prepare formatting patch for thermal-restricted review
        if: failure() && steps.rustfmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/storage-rustfmt.patch"
      - name: Retain exact formatting patch
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: storage-rustfmt
          path: ${{ runner.temp }}/storage-rustfmt.patch
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Inventory native SQLite coupling
        run: python3 scripts/check-native-storage-boundary.py
  conformance:
    runs-on: ubuntu-latest
    env:
      SEMON_PRICING_REFRESH: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-storage-${{ hashFiles('Cargo.lock') }}
      - name: Production host API callers compile
        id: production
        run: cargo check --locked --workspace --all-targets
      - name: Selected Query recipe foundation and token loader
        id: query_recipe_loader
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for group in query_projection::selected_recipe_tests:: storage::query::tests::prepared_recipe_charges_compact_metadata_and_payload_without_changing_active_row storage::query::tests::observed_growing_busy_catalog_prepares_exact_selected_recipe_within_budget storage::sqlite::tests::query_recipe_cells_keep_combined_bound_rollback_and_immutable_original events::store::tests::direct_catalog_query_recipe_loader_keeps_actual_owner_and_grant events::store::configured::tests::configured_semantic_query_recipe_loader_rechecks_immutable_residence_and_authority; do
            group_result=0
            cargo test --locked -p semon-sessions --lib "$group" -- --nocapture > "$RUNNER_TEMP/query-recipe-loader-case.log" 2>&1 || group_result=$?
            case "$group" in
              query_projection::selected_recipe_tests::) expected=5 ;;
              *) expected=1 ;;
            esac
            if ! grep -Fq "test result: ok. $expected passed; 0 failed;" "$RUNNER_TEMP/query-recipe-loader-case.log"; then group_result=1; fi
            cat "$RUNNER_TEMP/query-recipe-loader-case.log" >> "$RUNNER_TEMP/query-recipe-loader-tests.log"
            echo "GROUP name=$group status=$group_result" >> "$RUNNER_TEMP/query-recipe-loader-tests.log"
            if [ "$group_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/query-recipe-loader-tests.log"
          exit "$result"
      - name: Retain selected Query recipe loader results
        if: ${{ !cancelled() && steps.query_recipe_loader.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: query-recipe-loader-tests
          path: ${{ runner.temp }}/query-recipe-loader-tests.log
      - name: Authenticated semantic publication reuse and refusal
        id: semantic_publication_reuse
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: |
          result=0
          for test in events::store::configured::tests::configured_semantic_publication_replay_is_idempotent events::store::configured::tests::configured_semantic_noop_refuses_dangling_proof_source_and_grant events::store::configured::tests::configured_semantic_changed_observation_issues_receipt_for_identical_rows query::tests::recovery_tests::recovery_stage_upgrades_direct_authority_then_reuses_immutable_publication query::tests::recovery_tests::recovery_ordinary_index_advance_supersedes_the_old_semantic_source; do
            case_result=0
            cargo test --locked -p semon-sessions --lib "$test" -- --exact --nocapture > "$RUNNER_TEMP/semantic-publication-reuse-case.log" 2>&1 || case_result=$?
            if ! grep -Fq 'running 1 test' "$RUNNER_TEMP/semantic-publication-reuse-case.log"; then case_result=1; fi
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/semantic-publication-reuse-case.log"; then case_result=1; fi
            cat "$RUNNER_TEMP/semantic-publication-reuse-case.log" >> "$RUNNER_TEMP/semantic-publication-reuse-tests.log"
            echo "CASE name=$test expected=1 status=$case_result" >> "$RUNNER_TEMP/semantic-publication-reuse-tests.log"
            if [ "$case_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/semantic-publication-reuse-tests.log"
          exit "$result"
      - name: Retain authenticated semantic publication reuse results
        if: ${{ !cancelled() && steps.semantic_publication_reuse.outcome != 'skipped' && steps.production.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-publication-reuse-tests
          path: ${{ runner.temp }}/semantic-publication-reuse-tests.log
      - name: Configured semantic rejection and withdrawal contracts
        id: semantic_rejection
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          cargo test --locked -p semon-sessions --lib semantic_rejection_ -- --nocapture > "$RUNNER_TEMP/semantic-rejection-tests.log" 2>&1 || result=$?
          if ! grep -Fq 'test result: ok. 4 passed; 0 failed;' "$RUNNER_TEMP/semantic-rejection-tests.log"; then result=1; fi
          cat "$RUNNER_TEMP/semantic-rejection-tests.log"
          exit "$result"
      - name: Retain configured semantic rejection results
        if: ${{ !cancelled() && steps.semantic_rejection.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-rejection-tests
          path: ${{ runner.temp }}/semantic-rejection-tests.log
      - name: Namespace key reservation and physical fixture contracts
        id: namespace_fixtures
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for test in \
            events::store::configured::tests::configured_semantic_reset_and_reduction_rollback_zero_partial_writes \
            events::store::semantic_stage::tests::codex_physical_owner_closure_is_complete_exact_and_bounded \
            events::store::semantic_stage::tests::codex_physical_owner_closure_uses_binary_id_and_harness_equality \
            events::store::semantic_stage::tests::publication_packing_defers_an_owner_that_will_not_fit \
            storage::sqlite::semantic::plan::tests::codex_native_members_are_exact_and_namespace_scoped \
            events::store::configured::tests::domain52::configured_semantic_domain61_component_source_capacity_is_not_conflict \
            events::store::semantic_stage::tests::reserved_native_key_cursor_bounds_probes_and_selectors_reuse_qualified_result \
            events::store::chunk_proofs::tests::shrinking_or_removing_a_proof_cleans_only_its_exact_namespace \
            events::store::relocation::tests::relocation_candidates_preserve_identity_and_bound_work_by_native_matches \
            events::store::tests::cached_statements_recheck_external_schema_and_parser_changes \
            events::store::tests::selected_role_proofs_fence_ledger_sidecar_and_parser_without_event_loads \
            events::store::tests::cold_discovery_committed_witness_skips_repeated_work_and_recovers_changes_and_rollback_aba \
            events::store::tests::cold_discovery_cached_witness_preserves_contract_and_namespace_refusals \
            events::store::tests::event_cache_uses_owner_committed_discovery_witness \
            events::store::tests::recovery_witness_checks_marker_created_by_ack_trigger \
            events::store::tests::recovery_witness_requalifies_mutable_source_journal_rows \
            events::store::configured::tests::domain52::configured_semantic_domain94_name_source_change_refuses_without_effects \
            events::store::configured::tests::domain52::configured_semantic_domain94_name_members_preserve_missing_custody_then_page; do
            case_result=0
            cargo test --locked -p semon-sessions --lib "$test" -- --exact --nocapture > "$RUNNER_TEMP/namespace-fixture-case.log" 2>&1 || case_result=$?
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/namespace-fixture-case.log"; then case_result=1; fi
            cat "$RUNNER_TEMP/namespace-fixture-case.log" >> "$RUNNER_TEMP/namespace-fixture-tests.log"
            echo "CASE name=$test status=$case_result" >> "$RUNNER_TEMP/namespace-fixture-tests.log"
            if [ "$case_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/namespace-fixture-tests.log"
          exit "$result"
      - name: Retain namespace key reservation and fixture results
        if: ${{ !cancelled() && steps.namespace_fixtures.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: namespace-fixture-tests
          path: ${{ runner.temp }}/namespace-fixture-tests.log
      - name: Admitted Catalog search and Query window contracts
        id: query_fixtures
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for test in \
            query::tests::catalog_search_admits_only_selected_archives_before_its_stop_boundary \
            query::tests::catalog_search_qualifies_multi_machine_order_and_conflicts \
            query::tests::the_window_bounds_what_is_read_and_says_where_it_starts \
            query::tests::selected_query_refuses_changed_bytes_generations_and_revocation \
            query::tests::selected_query_preserves_the_independent_tool_reference_and_union_labels \
            query::tests::retained_context_tests::retained_child_fields_use_exact_current_parent_after_original_history_is_preserved; do
            case_result=0
            cargo test --locked -p semon-sessions --lib "$test" -- --exact --nocapture > "$RUNNER_TEMP/query-fixture-case.log" 2>&1 || case_result=$?
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/query-fixture-case.log"; then case_result=1; fi
            cat "$RUNNER_TEMP/query-fixture-case.log" >> "$RUNNER_TEMP/query-fixture-tests.log"
            echo "CASE name=$test status=$case_result" >> "$RUNNER_TEMP/query-fixture-tests.log"
            if [ "$case_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/query-fixture-tests.log"
          exit "$result"
      - name: Retain admitted Catalog search and Query window results
        if: ${{ !cancelled() && steps.query_fixtures.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: query-fixture-tests
          path: ${{ runner.temp }}/query-fixture-tests.log
      - name: Catalog batch publication parity fixture
        id: catalog_batch_fixture
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          test=events::store::tests::catalog_batch_complete_publisher_matches_row_wise_rows_feed_sources_slots_and_repairs
          case_result=0
          cargo test --locked -p semon-sessions --lib "$test" -- --exact --nocapture > "$RUNNER_TEMP/catalog-batch-publisher-case.log" 2>&1 || case_result=$?
          if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/catalog-batch-publisher-case.log"; then case_result=1; fi
          cat "$RUNNER_TEMP/catalog-batch-publisher-case.log"
          echo "CASE name=$test status=$case_result" >> "$RUNNER_TEMP/catalog-batch-publisher-case.log"
          exit "$case_result"
      - name: Retain Catalog batch publication results
        if: ${{ !cancelled() && steps.catalog_batch_fixture.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-batch-publisher-tests
          path: ${{ runner.temp }}/catalog-batch-publisher-case.log
      - name: Configured header ownership and copied-usage fixture contracts
        id: ownership_fixtures
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for group in current_header_repair_ events::store::tests::usage_delete_; do
            case_result=0
            cargo test --locked -p semon-sessions --lib "$group" -- --nocapture > "$RUNNER_TEMP/ownership-fixture-case.log" 2>&1 || case_result=$?
            case "$group" in
              current_header_repair_) expected=4 ;;
              *) expected=3 ;;
            esac
            if ! grep -Fq "test result: ok. $expected passed; 0 failed;" "$RUNNER_TEMP/ownership-fixture-case.log"; then case_result=1; fi
            cat "$RUNNER_TEMP/ownership-fixture-case.log" >> "$RUNNER_TEMP/ownership-fixture-tests.log"
            echo "CASE group=$group expected=$expected status=$case_result" >> "$RUNNER_TEMP/ownership-fixture-tests.log"
            if [ "$case_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/ownership-fixture-tests.log"
          exit "$result"
      - name: Retain header ownership and copied-usage fixture results
        if: ${{ !cancelled() && steps.ownership_fixtures.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ownership-fixture-tests
          path: ${{ runner.temp }}/ownership-fixture-tests.log
      - name: Authenticated published proof rollback and reader lifetime
        id: published_proofs
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for test in \
            events::store::chunk_proofs::tests::oversized_catalog_publication_refuses_without_changing_published_proofs \
            events::store::chunk_proofs::tests::published_proofs_follow_catalog_references_and_survive_gc_until_last_reader_drop \
            events::store::configured::tests::selected57::configured_semantic_selected57_real_two_source_native_range_and_field_oracle \
            events::store::configured::tests::selected57::configured_semantic_selected57_claude_original_provenance_survives_current_reference_move; do
            case_result=0
            cargo test --locked -p semon-sessions --lib "$test" -- --exact --nocapture > "$RUNNER_TEMP/published-proof-case.log" 2>&1 || case_result=$?
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/published-proof-case.log"; then case_result=1; fi
            cat "$RUNNER_TEMP/published-proof-case.log" >> "$RUNNER_TEMP/published-proof-tests.log"
            echo "CASE name=$test status=$case_result" >> "$RUNNER_TEMP/published-proof-tests.log"
            if [ "$case_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/published-proof-tests.log"
          exit "$result"
      - name: Retain authenticated published proof result
        if: ${{ !cancelled() && steps.published_proofs.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-proof-tests
          path: ${{ runner.temp }}/published-proof-tests.log
      - name: Authenticated Catalog repricing transactions
        id: reprice_authority
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for group in direct_catalog_reprice configured_semantic_reprice_preserves_stage_only_authority current_transfer_catalog_reprice_preserves_imported_original_authority events::store::reprice::tests::; do
            group_result=0
            cargo test --locked -p semon-sessions --lib "$group" -- --nocapture > "$RUNNER_TEMP/reprice-authority-case.log" 2>&1 || group_result=$?
            if ! grep -Eq 'running [1-9][0-9]* tests?' "$RUNNER_TEMP/reprice-authority-case.log"; then group_result=1; fi
            cat "$RUNNER_TEMP/reprice-authority-case.log" >> "$RUNNER_TEMP/reprice-authority.log"
            echo "GROUP name=$group status=$group_result" >> "$RUNNER_TEMP/reprice-authority.log"
            if [ "$group_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/reprice-authority.log"
          exit "$result"
      - name: Retain repricing authority result
        if: ${{ !cancelled() && steps.reprice_authority.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reprice-authority
          path: ${{ runner.temp }}/reprice-authority.log
      - name: Current and retained observation contracts
        id: retained_contracts
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          for group in configured_semantic_domain52_identity_pid_and_parent_transition_preserves_custody configured_semantic_domain61_late_child_restarts_complete_native_cohort configured_semantic_domain52_high_degree_family_publishes_bounded_groups_across_restart configured_semantic_domain72_claude_foreign_namespace_projection_isolated configured_semantic_domain67_absent_staged_endpoint_conflicts_without_effects configured_semantic_domain67_stale_epoch_source_collision_has_zero_effects configured_semantic_selected65_private_witness_is_bound_independently_of_rows configured_semantic_real_model_claude_replacement_rollback_stale_and_history archived_event_index_survives_absence_without_current_membership retained_projection_falls_back_to_history_only_when_main_omits_path transcript_snapshot_keeps_original_recipes_during_an_active_append retained_history_list_keeps_indexed_fields_and_positions_across_append family_status_does_not_treat_a_retired_native_selection_as_current family_and_unjoined_trace_extent_share_source_runtime_and_retained_qualification mcp_history_selection_keeps_current_runtime_qualification; do
            group_result=0
            cargo test --locked -p semon-sessions --lib "$group" -- --nocapture > "$RUNNER_TEMP/retained-contract-case.log" 2>&1 || group_result=$?
            if ! grep -Eq 'running [1-9][0-9]* tests?' "$RUNNER_TEMP/retained-contract-case.log"; then group_result=1; fi
            cat "$RUNNER_TEMP/retained-contract-case.log" >> "$RUNNER_TEMP/retained-contract-tests.log"
            echo "GROUP name=$group status=$group_result" >> "$RUNNER_TEMP/retained-contract-tests.log"
            if [ "$group_result" -ne 0 ]; then result=1; fi
          done
          cat "$RUNNER_TEMP/retained-contract-tests.log"
          exit "$result"
      - name: Retain current and retained contract results
        if: ${{ !cancelled() && steps.retained_contracts.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-contract-tests
          path: ${{ runner.temp }}/retained-contract-tests.log
      - name: Retained row authority diagnostic (not qualification)
        id: retained_authority_diagnostic
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        env:
          SEMON_BUILD_TIMING: "1"
        run: |
          python3 - <<'PYSAFE'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          cases = (
              'events::store::configured::tests::configured_semantic_real_model_claude_replacement_rollback_stale_and_history',
              'catalog::tests::family_status_does_not_treat_a_retired_native_selection_as_current',
              'catalog::tests::family_and_unjoined_trace_extent_share_source_runtime_and_retained_qualification',
          )
          prefixes = (
              'semon sessions native: observation_direct_grant_',
              'semon sessions native: observation_stage_refused ',
              'catalog_retained_observation_refused ',
              'catalog_runtime_refused ',
              'catalog_relative_status_refused ',
          )
          report = []
          valid_execution = True
          for index, case in enumerate(cases):
              raw = root / f'retained-authority-case-{index}.log'
              with raw.open('w') as output:
                  result = subprocess.run(
                      ['cargo', 'test', '--locked', '-p', 'semon-sessions', '--lib', case,
                       '--', '--exact', '--nocapture'], stdout=output, stderr=subprocess.STDOUT,
                  )
              stages, results = [], []
              running_one = 0
              stage_count = 0
              with raw.open() as source:
                  for line in source:
                      line = line.rstrip()
                      running_one += line == 'running 1 test'
                      if line.startswith(prefixes):
                          stage_count += 1
                          if len(stages) < 64:
                              stages.append(line[:1024])
                      if line.startswith('test result:'):
                          results.append(line[:1024])
              execution_ok = running_one == 1 and len(results) == 1
              valid_execution &= execution_ok
              report.append(
                  f'CASE name={case} process_status={result.returncode} '
                  f'running_one_count={running_one} result_count={len(results)} '
                  f'stage_count={stage_count} retained_stage_count={len(stages)}'
              )
              report.extend(stages)
              report.extend(results[:1])
          text = '\n'.join(report) + '\n'
          (root / 'retained-authority-diagnostic.txt').write_text(text)
          print(text, end='')
          if not valid_execution:
              raise SystemExit('Exact diagnostic case did not produce one running test and result')
          PYSAFE
      - name: Retain bounded row authority diagnostic
        if: ${{ !cancelled() && steps.retained_authority_diagnostic.outcome != 'skipped' && steps.production.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-authority-diagnostic
          path: ${{ runner.temp }}/retained-authority-diagnostic.txt
      - name: Current Facts refresh status diagnostic (not qualification)
        id: current_facts_status_diagnostic
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        env:
          SEMON_BUILD_TIMING: "1"
        run: |
          python3 - <<'PYSAFE'
          import os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          case = 'catalog::tests::list_status_reuses_native_facts_and_rejects_runtime_or_source_changes'
          raw = root / 'current-facts-status-case.log'
          with raw.open('w') as output:
              execution = subprocess.run(
                  ['cargo', 'test', '--locked', '-p', 'semon-sessions', '--lib', case,
                   '--', '--exact', '--nocapture'], stdout=output, stderr=subprocess.STDOUT,
              )
          diagnostic_prefixes = (
              'catalog_publication_probe stage=observation_grant',
              'catalog_runtime_refused stage=current_row_binding ',
              'semon sessions native: observation_direct_grant_miss ',
              'semon sessions native: observation_direct_grant_diagnostic=',
              'semon sessions native: observation_direct_grant_fields ',
          )
          safe, timings, panics, results = [], [], [], []
          diagnostic_count = timing_count = running_one = 0
          timing_pattern = re.compile(
              r'configured_reservation stage=[A-Za-z0-9_]+(?: [A-Za-z0-9_]+=[0-9]+)+'
          )
          panic_pattern = re.compile(r'panicked at (crates/[A-Za-z0-9_./-]+:[0-9]+:[0-9]+):')
          with raw.open() as source:
              for line in source:
                  line = line.rstrip()
                  running_one += line == 'running 1 test'
                  if line.startswith(diagnostic_prefixes):
                      diagnostic_count += 1
                      if len(safe) < 64:

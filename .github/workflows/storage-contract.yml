          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_stale_record_and_admission_refuse_without_writes -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::tests::copied_usage_layout_is_warmed_by_actual_producer_and_selected_factories -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib native_timing::tests::cleanup_prepare_failure_preserves_error_without_zero_vm_work_or_record -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib native_timing::tests::cold_discovery_progress_separates_active_pages_from_continuation_gaps -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_support_ingest_isolates_witnesses_restart_and_rollback -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_support_mixed_family_refuses_before_ingest -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_stage_authored_keys_preserve_collisions_and_refuse_unported_consumers -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_semantic_support_cache_rejects_transient_and_corrupt_layouts -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::native_usage::namespace_tests:: -- --nocapture
          cargo test --locked -p semon-sessions --lib events::store::native_usage::file_namespace_tests:: -- --nocapture
          cargo test --locked -p semon-sessions --lib events::store::reprice::tests::native_usage_authored_assembly_preserves_factories_and_complete_dependencies -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::reprice::tests::native_usage_metadata_enrollment_initializes_floors_atomically_and_fences_warm_writers -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::reprice::tests::native_usage_metadata_source_keys_and_floors_isolate_restart_and_rollback -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::reprice::tests::native_usage_metadata_proof_reference_owners_refuse_unported_history_before_gc -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::reprice::tests::native_usage_copied_family_rejects_corrupt_constraints_before_payload_dml -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::reprice::tests::native_usage_copied_family_rejects_mixed_shapes_before_payload_dml -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::reprice::tests::native_usage_copied_layout_is_independent_of_core_and_native_layout -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::reprice::tests::native_usage_copied_tree_pricing_collision_restart_and_rollback -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::store::configured::tests::configured_repair_proof_snapshot_uses_admission_and_refuses_unbound_fallback -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib events::tests::configured_ -- --nocapture
      - name: Native Catalog and Query fixture contracts through adapter
        run: |
          cargo test --locked -p semon-sessions --lib catalog::tests:: -- --nocapture
          cargo test --locked -p semon-sessions --lib query::tests::published_catalog -- --nocapture
          cargo test --locked -p semon-sessions --lib query::tests::catalog_query -- --nocapture
      - name: Reported facts persistence after typed error propagation
        run: |
          cargo test --locked -p semon-sessions --lib events::store::tests::scoped_store_restores_only_named_reported_runs_and_preserves_overwritten_history -- --exact --nocapture
          cargo test --locked -p semon-sessions --lib facts::tests::reported_runs -- --nocapture

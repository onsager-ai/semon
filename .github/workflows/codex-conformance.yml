name: Pinned Codex reducer conformance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keep both reusable-workflow jobs on the bundled reference prices.
env:
  SEMON_PRICING_REFRESH: "off"

concurrency:
  group: codex-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semon-targeted-tests:
    name: Semon parser and selected-output tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Semon pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install upstream-pinned Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt, rust-src

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-codex-conformance-semon-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-codex-conformance-semon-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Run parser event fixture tests on the exact head
        run: |
          result=0
          cargo test --locked -p semon-sessions 'events::tests::' || result=$?
          for run in 1 2 3 4 5; do
            cargo test --locked -p semon-sessions events::tests::two_processes_indexing_at_once_end_equal_to_a_cold_read -- --exact || result=$?
          done
          exit "$result"

      - name: Run durable owned-turn lifecycle regressions on the exact head
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p semon-sessions codex_lifecycle::tests::

      - name: Run native sessions integration contracts early on the exact head
        if: ${{ !cancelled() }}
        run: cargo test --locked -p semon-sessions --test sessions

      - name: Run focused native selected-details and transcript contract
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p semon-sessions catalog::tests::selected_details_are_body_free_exact_and_bound_to_the_original_source_generation
          cargo test --locked -p semon-sessions catalog::tests::selected_claude_parent_keeps_codex_unknown_and_idle_child_ranges_readable

      - name: Run parser transaction and selected-output tests on the exact head
        run: cargo test --locked -p semon-sessions 'tx::tests::'

      - name: Run paired reference conformance hooks on the exact head
        run: cargo test --locked -p semon-sessions codex_reference_conformance

      - name: Run source-generation selected-output expansion on the exact head
        run: cargo test --locked -p semon-sessions catalog::tests::selected_output_expansion_keeps_native_blocks_under_source_generation

      - name: Run current storage refusal at product entrypoints on the exact head
        run: cargo test --locked -p semon-sessions catalog::tests::unsupported_storage_is_observable_at_product_read_entrypoints

  upstream-reference:
    name: Pinned Codex reducer reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Semon pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: semon
          persist-credentials: false

      - name: Check out pinned Codex source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openai/codex
          ref: a9b0815167c27ab13719dd12d13b63e02b70d221
          path: codex
          persist-credentials: false

      - name: Install upstream-pinned Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt, rust-src

      - name: Cache upstream Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex/codex-rs/target
          key: ${{ runner.os }}-codex-conformance-upstream-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('codex/codex-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-codex-conformance-upstream-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Copy the original Semon runner into the disposable Codex checkout
        run: |
          mkdir -p codex/codex-rs/rollout-trace/examples
          cp semon/tests/spikes/codex_native_oracle.rs codex/codex-rs/rollout-trace/examples/semon_native_oracle.rs

      - name: Check the copied upstream example format
        working-directory: codex/codex-rs
        run: rustfmt --check --edition 2024 rollout-trace/examples/semon_native_oracle.rs

      - name: Replay synthetic fixtures through the pinned public reducer
        working-directory: codex/codex-rs
        run: |
          cargo run --locked -p codex-rollout-trace --example semon_native_oracle -- \
            "$GITHUB_WORKSPACE/semon/tests/fixtures/compatibility/codex-reference-a9b0815" \
            "$RUNNER_TEMP/codex-native-reference-bundle" \
            "$GITHUB_WORKSPACE/semon/tests/fixtures/compatibility/codex-native-a9b0815/parser-cases.jsonl"

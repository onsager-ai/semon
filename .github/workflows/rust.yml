name: Storage rebuild same-runner timing
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SEMON_PRICING_REFRESH: "off"
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            target
          key: storage-timing-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Rebuild isolated first-page samples
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            cargo test --locked -p semon-sessions --lib initial_catalog_page_precedes_global_native_observation -- --nocapture 2>&1 | tee "$RUNNER_TEMP/rebuild-isolated-$attempt.log" | grep -E 'production-first-page|test result'
          done
      - name: Prepare main on the same runner
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach "$RUNNER_TEMP/storage-main" FETCH_HEAD
          git -C "$RUNNER_TEMP/storage-main" rev-parse HEAD
      - name: Main isolated first-page samples
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-main
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            cargo test --manifest-path "$RUNNER_TEMP/storage-main/Cargo.toml" --locked -p semon-sessions --lib initial_catalog_page_precedes_global_native_observation -- --nocapture 2>&1 | tee "$RUNNER_TEMP/main-isolated-$attempt.log" | grep -E 'production-first-page|test result'
          done
      - name: Rebuild full-suite first-page sample
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib -- --nocapture 2>&1 | tee "$RUNNER_TEMP/rebuild-full.log" | grep -E 'production-first-page|test result|FAILED|panicked at'
      - name: Main full-suite first-page sample
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-main
        run: |
          set -o pipefail
          cargo test --manifest-path "$RUNNER_TEMP/storage-main/Cargo.toml" --locked -p semon-sessions --lib -- --nocapture 2>&1 | tee "$RUNNER_TEMP/main-full.log" | grep -E 'production-first-page|test result|FAILED|panicked at'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: same-runner-timings
          path: ${{ runner.temp }}/*-*.log

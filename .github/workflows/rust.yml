name: Rust CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Fixture processes use deterministic bundled reference prices.
env:
  SEMON_PRICING_REFRESH: "off"

# A newer PR revision supersedes only that PR's earlier Rust run.
concurrency:
  group: rust-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain is used per its documented convention: the ref
      # itself ("stable") selects the toolchain channel, so it is left
      # unpinned to a commit SHA on purpose -- pinning would freeze today's
      # stable Rust release instead of tracking the current one. Stable
      # already supports edition 2024 (needs Rust 1.85+; current stable is
      # 1.95.x), so no nightly toolchain is needed.
      - name: Install Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rusqlite is vendored with the "bundled" feature, which compiles
      # SQLite from C source on every cold build. Cache the registry (crate
      # downloads) and target/ (build artifacts, including that compiled
      # SQLite) keyed on Cargo.lock so an unchanged dependency set restores
      # instead of rebuilding from scratch. target/ is also compiler-version
      # specific, so the key includes the toolchain's cachekey output --
      # otherwise stable rolling to a new release could restore a target/
      # built by the previous compiler. restore-keys keeps that toolchain
      # component (dropping only the Cargo.lock hash) so a fallback restore
      # still matches the current compiler instead of an older one.
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: diag(rebuild) isolated first page
        continue-on-error: true
        env:
          SEMON_BUILD_TIMING: "0"
        run: |
          for attempt in 1 2 3; do
            cargo test -p semon-sessions --lib --locked initial_catalog_page_precedes_global_native_observation -- --nocapture 2>&1 | grep -E "^test |production-first-page|test result" || true
          done
      - name: diag(main) same-runner isolated first page
        continue-on-error: true
        env:
          SEMON_BUILD_TIMING: "0"
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach "$RUNNER_TEMP/diag-main" FETCH_HEAD
          git -C "$RUNNER_TEMP/diag-main" log --oneline -1
          for attempt in 1 2 3; do
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-main" cargo test --manifest-path "$RUNNER_TEMP/diag-main/Cargo.toml" -p semon-sessions --lib --locked initial_catalog_page_precedes_global_native_observation -- --nocapture 2>&1 | grep -E "^test |production-first-page|test result" || true
          done
      - name: diag(rebuild) full-suite first page
        continue-on-error: true
        env:
          SEMON_BUILD_TIMING: "1"
        run: |
          cargo test -p semon-sessions --lib --locked -- --nocapture 2>&1 | grep -E "production-first-page|^test result|panicked at|FAILED|failures:" || true
      - name: diag(main) same-runner full-suite first page
        continue-on-error: true
        env:
          SEMON_BUILD_TIMING: "1"
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-main" cargo test --manifest-path "$RUNNER_TEMP/diag-main/Cargo.toml" -p semon-sessions --lib --locked -- --nocapture 2>&1 | grep -E "production-first-page|^test result|panicked at|FAILED|failures:" || true

name: Rust CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Fixture processes use deterministic bundled reference prices.
env:
  SEMON_PRICING_REFRESH: "off"

# A newer PR revision supersedes only that PR's earlier Rust run.
concurrency:
  group: rust-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain is used per its documented convention: the ref
      # itself ("stable") selects the toolchain channel, so it is left
      # unpinned to a commit SHA on purpose -- pinning would freeze today's
      # stable Rust release instead of tracking the current one. Stable
      # already supports edition 2024 (needs Rust 1.85+; current stable is
      # 1.95.x), so no nightly toolchain is needed.
      - name: Install Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rusqlite is vendored with the "bundled" feature, which compiles
      # SQLite from C source on every cold build. Cache the registry (crate
      # downloads) and target/ (build artifacts, including that compiled
      # SQLite) keyed on Cargo.lock so an unchanged dependency set restores
      # instead of rebuilding from scratch. target/ is also compiler-version
      # specific, so the key includes the toolchain's cachekey output --
      # otherwise stable rolling to a new release could restore a target/
      # built by the previous compiler. restore-keys keeps that toolchain
      # component (dropping only the Cargo.lock hash) so a fallback restore
      # still matches the current compiler instead of an older one.
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Session URL shared vectors (ordinary PR gate)
        run: cargo test --locked -p semon-sessions session_route_shared_vectors -- --nocapture

      - name: Session activity coverage and bounded cold preparation
        run: |
          cargo test --locked -p semon-sessions session_activity:: -- --nocapture
          cargo test --locked -p semon-sessions activity_request_blob_replay_ -- --nocapture
          cargo test --locked -p semon-sessions selected_accounting_refusal_ -- --nocapture
          cargo test --locked -p semon-sessions recovery_producer_batches_ -- --nocapture
          cargo test --locked -p semon-sessions activity_cold_ -- --test-threads=1 --nocapture
          cargo test --locked -p semon-sessions activity_root_and_child_ -- --test-threads=1 --nocapture

      - name: Standalone session bootstrap HTTP regressions
        run: cargo test --locked -p semon-sessions http_session_bootstrap_is_consumed_before_routing -- --nocapture

      - name: cargo fmt --check
        id: rustfmt
        run: cargo fmt --all --check

      - name: Prepare Rust formatting changes for thermal-restricted review
        if: failure() && steps.rustfmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/rustfmt-review.patch"
      - name: Retain formatting changes without bypassing the check
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustfmt-review
          path: ${{ runner.temp }}/rustfmt-review.patch
          if-no-files-found: error

      - name: Verify CLI fixture provenance and exact tool joins
        run: python3 -m unittest discover -s tests/spikes -p test_cli_fixtures.py -v

      - name: Verify harness icon hashes
        run: cd assets/harnesses && sha256sum -c SHA256SUMS

      - name: Native storage boundary
        run: python3 scripts/check-native-storage-boundary.py

      # --no-deps: lint the workspace's own crates only. Clippy would
      # otherwise lint vendor/tiny_http too, since a path dependency's lints
      # aren't capped the way a registry crate's are, and that code is kept
      # as published (vendor/tiny_http/SEMON-PATCH.md).
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- --no-deps -D warnings

      - name: Sealed selected transcript regression
        run: |
          cargo test -p semon-sessions --locked selected_codex_pages_survive_multi_segment_sealing -- --nocapture
          cargo test -p semon-sessions --locked selected_sealed_pages_reject_replacement_truncation_and_corruption -- --nocapture

      - name: Runtime pricing regressions
        run: |
          cargo test -p semon-sessions --lib --locked pricing::runtime::tests::
          cargo test -p semon-sessions --lib --locked events::store::reprice::tests::
          cargo test -p semon-sessions --lib --locked catalog_statement_journal_batch_probe_preserves_catalog_feed_and_transaction_rollback

      - name: Paused full-text find refuses before native reads
        run: |
          cargo test -p semon-sessions --lib --locked paused_find_ -- --nocapture
          cargo test -p semon-cli --bin semon --locked paused_find_ -- --nocapture

      - name: Recovery core journey and selected fallback diagnostics
        env:
          SEMON_BUILD_TIMING: "0"
        run: |
          cargo test -p semon-sessions --locked selected_record_windows_reuse_qualified_bytes_and_reject_rebinding -- --nocapture
          cargo test -p semon-sessions --locked recovery_tests:: -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked selected_transcript_tail_scope_measurement -- --ignored --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked focused_query_keeps_cross_harness_and_literal_native_identity_collision_context -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked focused_query_preserves_whole_file_scan_window_and_skipped_parent_context -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked focused_far_end_and_unsent_handoffs_use_native_owner_evidence_and_union_aliases -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked native_tool_outputs_use_bounded_string_fields_and_preserve_call_context -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked native_relocation_history_witness_survives_failed_publication_and_an_append -- --test-threads=1 --nocapture

      - name: cargo test
        # Keep producer phase timings in a failed test's captured output. This
        # distinguishes bounded foreground discovery from background publication
        # on the actual runner without changing deadlines or successful output.
        run: |
          # Foreground and incremental budgets use normal execution. Keep the
          # existing instrumented full suite as separate regression evidence.
          set +e
          SEMON_BUILD_TIMING=0 cargo test -p semon-sessions --lib --locked viewer::tests::initial_catalog_page_precedes_global_native_observation -- --exact --nocapture > "$RUNNER_TEMP/cold-catalog-default.log" 2>&1
          cold_catalog_default_status=$?
          cat "$RUNNER_TEMP/cold-catalog-default.log"
          set -e
          test "$cold_catalog_default_status" -eq 0
          grep -Fq '1 passed; 0 failed;' "$RUNNER_TEMP/cold-catalog-default.log"
          set +e
          SEMON_BUILD_TIMING=0 cargo test -p semon-sessions --lib --features test-clock,test-ui-account-server --locked viewer::tests::initial_catalog_page_precedes_global_native_observation -- --exact --nocapture > "$RUNNER_TEMP/cold-catalog-viewer.log" 2>&1
          cold_catalog_viewer_status=$?
          cat "$RUNNER_TEMP/cold-catalog-viewer.log"
          set -e
          test "$cold_catalog_viewer_status" -eq 0
          grep -Fq '1 passed; 0 failed;' "$RUNNER_TEMP/cold-catalog-viewer.log"
          SEMON_BUILD_TIMING=0 cargo test -p semon-sessions --locked journal_append_and_warm_restart_ignore_unrelated_history -- --nocapture
          SEMON_BUILD_TIMING=0 cargo test -p semon-sessions --locked native_codex_archive_unarchive_reuses_the_indexed_generation -- --nocapture
          SEMON_BUILD_TIMING=1 cargo test --locked -- --skip initial_catalog_page_precedes_global_native_observation

      - name: Source clock/account strict Clippy
        run: cargo clippy -p semon-sessions --all-targets --features test-clock,test-ui-account-server --locked -- --no-deps -D warnings

      - name: Source feature Query
        run: |
          SEMON_BUILD_TIMING=1 cargo test -p semon-sessions --lib --features test-clock,test-ui-account-server --locked query::

      - name: Source feature Viewer
        run: |
          SEMON_BUILD_TIMING=1 cargo test -p semon-sessions --lib --features test-clock,test-ui-account-server --locked viewer:: -- --skip initial_catalog_page_precedes_global_native_observation

  codex-conformance:
    name: Pinned Codex fixture conformance
    uses: ./.github/workflows/codex-conformance.yml

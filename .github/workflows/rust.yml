# Guards the session foundation and retained migration tools with workspace
# formatting, lint and tests on every pull request and push to main. Historical
# Store export remains independent of the product CLI and retired capture code.
name: Rust CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain is used per its documented convention: the ref
      # itself ("stable") selects the toolchain channel, so it is left
      # unpinned to a commit SHA on purpose -- pinning would freeze today's
      # stable Rust release instead of tracking the current one. Stable
      # already supports edition 2024 (needs Rust 1.85+; current stable is
      # 1.95.x), so no nightly toolchain is needed.
      - name: Install Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rusqlite is vendored with the "bundled" feature, which compiles
      # SQLite from C source on every cold build. Cache the registry (crate
      # downloads) and target/ (build artifacts, including that compiled
      # SQLite) keyed on Cargo.lock so an unchanged dependency set restores
      # instead of rebuilding from scratch. target/ is also compiler-version
      # specific, so the key includes the toolchain's cachekey output --
      # otherwise stable rolling to a new release could restore a target/
      # built by the previous compiler. restore-keys keeps that toolchain
      # component (dropping only the Cargo.lock hash) so a fallback restore
      # still matches the current compiler instead of an older one.
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: Verify CLI fixture provenance and exact tool joins
        run: python3 -m unittest discover -s tests/spikes -p test_cli_fixtures.py -v

      - name: Verify separate native Codex control evidence and provenance
        run: python3 -m unittest discover -s tests/spikes -p test_control_fixtures.py -v

      - name: Verify attachment against the actual pinned E2B SDK without provider calls
        run: |
          python3 -m venv "$RUNNER_TEMP/e2b-sdk"
          "$RUNNER_TEMP/e2b-sdk/bin/pip" install --require-hashes -r scripts/e2b-requirements.txt
          "$RUNNER_TEMP/e2b-sdk/bin/python" scripts/test-e2b-attach.py
      - name: Verify standalone native schema and execution evidence
        run: python3 -m unittest discover -s tests/spikes -p test_standalone_fixtures.py -v

      - name: Verify managed guest private SDK boundary without provider calls
        run: python3 scripts/test-e2b-managed.py

      - name: Verify bounded E2B inventory worker without provider calls
        run: python3 -m unittest discover -s tests/spikes -p 'test_e2b_*.py' -v

      - name: Verify harness icon hashes
        run: cd assets/harnesses && sha256sum -c SHA256SUMS

      # --no-deps: lint the workspace's own crates only. Clippy would
      # otherwise lint vendor/tiny_http too, since a path dependency's lints
      # aren't capped the way a registry crate's are, and that code is kept
      # as published (vendor/tiny_http/SEMON-PATCH.md).
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- --no-deps -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: Verify historical exporters build without product or protocol crates
        run: |
          cargo tree --locked -p semon-forensic-export --edges normal,build --prefix none --format '{p}' > "$RUNNER_TEMP/forensic-export-dependencies.txt"
          cargo tree --locked -p semon-relay-export --edges normal,build --prefix none --format '{p}' > "$RUNNER_TEMP/relay-export-dependencies.txt"
          python3 - "$RUNNER_TEMP/forensic-export-dependencies.txt" "$RUNNER_TEMP/relay-export-dependencies.txt" <<'PY'
          import pathlib, sys
          for path, owner in zip(sys.argv[1:], ("semon-forensic-export", "semon-relay-export")):
              dependencies = pathlib.Path(path).read_text().splitlines()
              unexpected = [line for line in dependencies if line.startswith("semon-") and line.split()[0] != owner]
              if unexpected:
                  raise SystemExit(owner + " gained product/protocol dependencies: " + ", ".join(unexpected))
          PY

      - name: Qualify Relay custody and offline decrypted history against the exact historical implementation
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          rustfmt --edition 2024 --check scripts/relay-history.rs tests/retirement/relay-custody.rs
          git fetch --no-tags origin 0648a99f977971fb177a5dda7a445c4941d64b57
          git worktree add --detach "$RUNNER_TEMP/relay-history-source" 0648a99f977971fb177a5dda7a445c4941d64b57
          python3 scripts/qualify-relay-custody.py --legacy-source "$RUNNER_TEMP/relay-history-source"

      - name: Verify product CLI and workspace exclude retired subsystems
        run: |
          cargo tree --locked -p semon-cli --edges normal,build --prefix none --format '{p}' > "$RUNNER_TEMP/product-cli-dependencies.txt"
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/product-workspace.json"
          python3 - "$RUNNER_TEMP/product-cli-dependencies.txt" "$RUNNER_TEMP/product-workspace.json" <<'PY'
          import json, pathlib, sys
          subsystems = {"semon-store", "semon-codex", "semon-claude", "semon-copilot", "semon-relay"}
          retired = subsystems | {"semon-forensic-export", "semon-relay-export"}
          unexpected = [line for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.split()[0] in retired]
          if unexpected:
              raise SystemExit("Product CLI gained retired subsystem/export dependencies: " + ", ".join(unexpected))
          metadata = json.loads(pathlib.Path(sys.argv[2]).read_text())
          members = set(metadata["workspace_members"])
          unexpected = [p["name"] for p in metadata["packages"] if p["id"] in members and p["name"] in subsystems]
          if unexpected:
              raise SystemExit("Retired workspace packages returned: " + ", ".join(unexpected))
          PY

      - name: Codex private device-login process checks
        run: |
          cargo clippy -p semon-runtime --all-targets --features codex-process --locked -- --no-deps -D warnings
          SEMON_TEST_COORDINATOR_SECRET=offline-fixture E2B_API_KEY=offline-fixture cargo test -p semon-runtime --features codex-process --locked

      - name: E2B private inventory process checks
        run: |
          cargo clippy -p semon-runtime --all-targets --features e2b-process --locked -- --no-deps -D warnings
          SEMON_TEST_COORDINATOR_SECRET=offline-fixture E2B_API_KEY=offline-fixture SEMON_TEST_NETWORK_GUARD=keep cargo test -p semon-runtime --features e2b-process --locked

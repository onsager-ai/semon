name: PostgreSQL follow-up isolated SQLite timing
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SEMON_PRICING_REFRESH: "off"
  SEMON_BUILD_TIMING: "0"
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            target
          key: pgsel-timing-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Compare isolated first pages on one runner
        run: |
          set -euo pipefail
          selected=ecd8d01b14e784aca33fcd6a587c587a8668c200
          baseline=6b348b585513669307befddacc35b4ef16e74cfe
          mkdir "$RUNNER_TEMP/pgsel-timing"
          printf '%s\n' "$selected" > "$RUNNER_TEMP/pgsel-timing/selected-sha"
          printf '%s\n' "$baseline" > "$RUNNER_TEMP/pgsel-timing/baseline-sha"
          for revision in selected baseline; do
            if test "$revision" = selected; then git checkout --detach "$selected"; else git checkout --detach "$baseline"; fi
            cargo test --locked -p semon-sessions --lib initial_catalog_page_precedes_global_native_observation --no-run --message-format=json > "$RUNNER_TEMP/pgsel-timing/$revision-build.jsonl"
            python3 - "$RUNNER_TEMP/pgsel-timing" "$revision" <<'PY'
          import json, pathlib, shutil, sys
          root, revision = pathlib.Path(sys.argv[1]), sys.argv[2]
          artifacts = [json.loads(line) for line in (root/f'{revision}-build.jsonl').read_text().splitlines()]
          executables = [row['executable'] for row in artifacts if row.get('reason') == 'compiler-artifact' and row.get('executable') and row['target']['name'] == 'semon_sessions']
          assert len(executables) == 1, executables
          shutil.copy2(executables[0], root/f'{revision}-test')
          PY
          done
          for revision in baseline selected; do
            "$RUNNER_TEMP/pgsel-timing/$revision-test" initial_catalog_page_precedes_global_native_observation --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/pgsel-timing/$revision-warmup.log"
          done
          for sample in 1 2 3 4 5; do
            for revision in baseline selected; do
              "$RUNNER_TEMP/pgsel-timing/$revision-test" initial_catalog_page_precedes_global_native_observation --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/pgsel-timing/$revision-$sample.log"
            done
          done
          python3 - "$RUNNER_TEMP/pgsel-timing" <<'PY'
          import json, pathlib, re, statistics, sys
          root = pathlib.Path(sys.argv[1])
          samples = {}
          for revision in ('selected', 'baseline'):
              rows = {n: [] for n in (0, 256, 2048)}
              for sample in range(1, 6):
                  log = root/f'{revision}-{sample}.log'
                  values = re.findall(r'production-first-page unrelated=(\d+) latency_us=(\d+)', log.read_text())
                  assert len(values) == 3, values
                  for n, latency in values:
                      rows[int(n)].append(int(latency))
              assert all(len(values) == 5 for values in rows.values()), rows
              samples[revision] = rows
          result = {}
          for n in (0, 256, 2048):
              pairs = [{'pair': i+1, 'main_us': a, 'selected_us': b, 'difference_us': b-a, 'delta_percent': (b/a-1)*100} for i, (a, b) in enumerate(zip(samples['baseline'][n], samples['selected'][n]))]
              main = statistics.median(samples['baseline'][n])
              selected = statistics.median(samples['selected'][n])
              result[n] = {'pairs': pairs, 'main_median_us': main, 'selected_median_us': selected, 'delta_percent': (selected/main-1)*100, 'paired_difference_median_us': statistics.median(p['difference_us'] for p in pairs), 'paired_delta_median_percent': statistics.median(p['delta_percent'] for p in pairs)}
          print(json.dumps(result, indent=2))
          (root/'medians.json').write_text(json.dumps(result, indent=2)+'\n')
          PY
          rm "$RUNNER_TEMP/pgsel-timing/selected-test" "$RUNNER_TEMP/pgsel-timing/baseline-test"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pgsel-isolated-timing
          path: ${{ runner.temp }}/pgsel-timing/

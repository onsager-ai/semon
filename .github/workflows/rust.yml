name: Cursor standalone viewer timing

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SEMON_PRICING_REFRESH: "off"

jobs:
  product-viewer-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db9296188515bf0dc5e8941be75b55309de3ef91
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cursor-product-timing-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pg-f1-${{ runner.os }}-
      - name: Compare unchanged viewer deadlines on product with default features
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/viewer-timing"
          cargo test -p semon-sessions --lib --locked --no-run
          result=0
          for round in 1 2 3; do
            for case in viewer::tests::fifty_views_are_checked_by_the_pools_threads_alone viewer::tests::initial_catalog_page_precedes_global_native_observation; do
              name="${case##*::}"
              cargo test -p semon-sessions --lib --locked "$case" -- --exact --nocapture --test-threads=1 > "$RUNNER_TEMP/viewer-timing/$name-$round.log" 2>&1 || result=1
              tail -n 12 "$RUNNER_TEMP/viewer-timing/$name-$round.log"
            done
          done
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: product-viewer-timing
          path: ${{ runner.temp }}/viewer-timing/

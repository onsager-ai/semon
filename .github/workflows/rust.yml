name: Cold path targeted diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [product, main]
    env:
      SEMON_PRICING_REFRESH: "off"
      SEMON_BUILD_TIMING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Keep exact fixture bodies
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          text = Path('crates/semon-sessions/src/viewer.rs').read_text()
          for name in ['initial_catalog_page_precedes_global_native_observation', 'fifty_views_are_checked_by_the_pools_threads_alone']:
              start = text.index('    fn ' + name + '() {')
              end = text.index('\n    #[test]', start)
              Path('/tmp/' + name).write_text(text[start:end])
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.source == 'main'
        with:
          ref: 8ec0a01c
      - name: Match main fixtures
        if: matrix.source == 'main'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('crates/semon-sessions/src/viewer.rs')
          text = p.read_text()
          for name in ['initial_catalog_page_precedes_global_native_observation', 'fifty_views_are_checked_by_the_pools_threads_alone']:
              start = text.index('    fn ' + name + '() {')
              end = text.index('\n    #[test]', start)
              text = text[:start] + Path('/tmp/' + name).read_text() + text[end:]
          p.write_text(text)
          PYTHON
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-f1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pg-f1-${{ runner.os }}-
      - name: Stage profiles
        run: |
          set +e
          cargo test -p semon-sessions --lib --locked viewer::tests::initial_catalog_page_precedes_global_native_observation -- --exact --nocapture > /tmp/cold.log 2>&1
          a=$?
          cargo test -p semon-sessions --lib --locked viewer::tests::fifty_views_are_checked_by_the_pools_threads_alone -- --exact --nocapture > /tmp/fifty.log 2>&1
          b=$?
          grep -E 'production-first-page|bounded initial|test result:|panicked|timed out' /tmp/cold.log /tmp/fifty.log || true
          exit $((a || b))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: timing-${{ matrix.source }}
          path: |
            /tmp/cold.log
            /tmp/fifty.log

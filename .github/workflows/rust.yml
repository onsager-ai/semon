name: Rust CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Fixture processes use deterministic bundled reference prices.
env:
  SEMON_PRICING_REFRESH: "off"

# A newer PR revision supersedes only that PR's earlier Rust run.
concurrency:
  group: rust-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain is used per its documented convention: the ref
      # itself ("stable") selects the toolchain channel, so it is left
      # unpinned to a commit SHA on purpose -- pinning would freeze today's
      # stable Rust release instead of tracking the current one. Stable
      # already supports edition 2024 (needs Rust 1.85+; current stable is
      # 1.95.x), so no nightly toolchain is needed.
      - name: Install Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rusqlite is vendored with the "bundled" feature, which compiles
      # SQLite from C source on every cold build. Cache the registry (crate
      # downloads) and target/ (build artifacts, including that compiled
      # SQLite) keyed on Cargo.lock so an unchanged dependency set restores
      # instead of rebuilding from scratch. target/ is also compiler-version
      # specific, so the key includes the toolchain's cachekey output --
      # otherwise stable rolling to a new release could restore a target/
      # built by the previous compiler. restore-keys keeps that toolchain
      # component (dropping only the Cargo.lock hash) so a fallback restore
      # still matches the current compiler instead of an older one.
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-

      # Diagnostic only: leave both normal isolated and full-parallel gates
      # below unchanged, and retain counters even if this diagnostic fails.
      - name: Cold Index writer diagnostic (not qualification)
        continue-on-error: true
        env:
          SEMON_BUILD_TIMING: "1"
        run: cargo test -p semon-sessions --locked initial_catalog_page_precedes_global_native_observation -- --nocapture

      - name: Cold Catalog foreground and background gate
        env:
          SEMON_BUILD_TIMING: "0"
        run: cargo test -p semon-sessions --locked initial_catalog_page_precedes_global_native_observation -- --nocapture

      - name: Session URL shared vectors (ordinary PR gate)
        run: cargo test --locked -p semon-sessions session_route_shared_vectors -- --nocapture

      - name: Standalone session bootstrap HTTP regressions
        run: cargo test --locked -p semon-sessions http_session_bootstrap_is_consumed_before_routing -- --nocapture

      # Run on the original checkout, before formatting review can change it.
      # --no-deps keeps the vendored tiny_http lint policy unchanged.
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- --no-deps -D warnings

      - name: cargo fmt --check
        id: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      - name: Prepare Rust formatting changes for thermal-restricted review
        if: failure() && steps.rustfmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/rustfmt-review.patch"
      - name: Retain formatting changes without bypassing the check
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustfmt-review
          path: ${{ runner.temp }}/rustfmt-review.patch
          if-no-files-found: error

      - name: Measure bounded upload codecs on non-private native fixtures
        run: python3 scripts/benchmark-upload-compression.py --mib 1 | tee "$RUNNER_TEMP/upload-compression.json"

      - name: Verify CLI fixture provenance and exact tool joins
        run: python3 -m unittest discover -s tests/spikes -p test_cli_fixtures.py -v

      - name: Verify Model retirement and independent reference provenance
        run: python3 -m unittest discover -s tests/spikes -p test_model_retirement.py -v

      - name: Verify separate native Codex control evidence and provenance
        run: python3 -m unittest discover -s tests/spikes -p test_control_fixtures.py -v

      - name: Verify attachment against the actual pinned E2B SDK without provider calls
        run: |
          python3 -m venv "$RUNNER_TEMP/e2b-sdk"
          "$RUNNER_TEMP/e2b-sdk/bin/pip" install --require-hashes -r scripts/e2b-requirements.txt
          "$RUNNER_TEMP/e2b-sdk/bin/python" scripts/test-e2b-attach.py
      - name: Verify standalone native schema and execution evidence
        run: python3 -m unittest discover -s tests/spikes -p test_standalone_fixtures.py -v

      - name: Verify managed guest private SDK boundary without provider calls
        run: python3 scripts/test-e2b-managed.py

      - name: Verify bounded E2B inventory worker without provider calls
        run: python3 -m unittest discover -s tests/spikes -p 'test_e2b_*.py' -v

      - name: Verify harness icon hashes
        run: cd assets/harnesses && sha256sum -c SHA256SUMS

      - name: Sealed selected transcript regression
        run: |
          cargo test -p semon-sessions --locked selected_codex_pages_survive_multi_segment_sealing -- --nocapture
          cargo test -p semon-sessions --locked selected_sealed_pages_reject_replacement_truncation_and_corruption -- --nocapture

      - name: Runtime pricing regressions
        run: |
          cargo test -p semon-sessions --lib --locked pricing::runtime::tests::
          cargo test -p semon-sessions --lib --locked events::store::reprice::tests::
          cargo test -p semon-sessions --lib --locked catalog_statement_journal_batch_probe_preserves_catalog_feed_and_transaction_rollback

      - name: Collection pause boundaries before broad regressions
        run: |
          python3 -m unittest discover -s tests/spikes -p test_collection_pause.py -v
          python3 tests/ssh/test_controller_supervisor.py
          cargo test -p semon-sessions --lib --locked paused_find_ -- --nocapture
          cargo test -p semon-sessions --lib --locked collection_control_refuses_ -- --nocapture
          cargo test -p semon-cli --bin semon --locked paused_delivery_refuses_ -- --nocapture
          cargo test -p semon-control --bins --locked collection_ -- --nocapture
          cargo test -p semon-ssh --lib --locked collection_ssh_ -- --nocapture
          cargo test -p semon-ssh --example controller-install --locked collection_controller_install_refuses -- --nocapture

      - name: Recovery core journey and selected fallback diagnostics
        env:
          SEMON_BUILD_TIMING: "0"
        run: |
          cargo test -p semon-sessions --locked selected_record_windows_reuse_qualified_bytes_and_reject_rebinding -- --nocapture
          cargo test -p semon-sessions --locked recovery_tests:: -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked selected_transcript_tail_scope_measurement -- --ignored --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked focused_query_keeps_cross_harness_and_literal_native_identity_collision_context -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked focused_query_preserves_whole_file_scan_window_and_skipped_parent_context -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked focused_far_end_and_unsent_handoffs_use_native_owner_evidence_and_union_aliases -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked native_tool_outputs_use_bounded_string_fields_and_preserve_call_context -- --test-threads=1 --nocapture
          cargo test -p semon-sessions --locked native_relocation_history_witness_survives_failed_publication_and_an_append -- --test-threads=1 --nocapture

      - name: Concurrent Event writer repetition gate
        run: |
          for attempt in 1 2 3 4 5; do
            cargo test -p semon-sessions --lib --locked events::tests::two_processes_indexing_at_once_end_equal_to_a_cold_read -- --exact --nocapture
          done

      - name: cargo test
        # Keep producer phase timings in a failed test's captured output. This
        # distinguishes bounded foreground discovery from background publication
        # on the actual runner without changing deadlines or successful output.
        run: |
          # Foreground and incremental budgets use normal execution. Keep the
          # existing instrumented full suite as separate regression evidence.
          SEMON_BUILD_TIMING=0 cargo test -p semon-sessions --locked journal_append_and_warm_restart_ignore_unrelated_history -- --nocapture
          SEMON_BUILD_TIMING=0 cargo test -p semon-sessions --locked native_codex_archive_unarchive_reuses_the_indexed_generation -- --nocapture
          SEMON_BUILD_TIMING=1 cargo test --locked

      - name: Source clock/account strict Clippy
        run: cargo clippy -p semon-sessions --all-targets --features test-clock,test-ui-account-server --locked -- --no-deps -D warnings

      - name: Source feature Query
        run: |
          SEMON_BUILD_TIMING=1 cargo test -p semon-sessions --lib --features test-clock,test-ui-account-server --locked query::

      - name: Source feature Viewer
        run: |
          SEMON_BUILD_TIMING=1 cargo test -p semon-sessions --lib --features test-clock,test-ui-account-server --locked viewer::

      - name: Verify product CLI and workspace exclude retired subsystems
        run: |
          cargo tree --locked -p semon-cli --edges normal,build --prefix none --format '{p}' > "$RUNNER_TEMP/product-cli-dependencies.txt"
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/product-workspace.json"
          python3 - "$RUNNER_TEMP/product-cli-dependencies.txt" "$RUNNER_TEMP/product-workspace.json" <<'PY'
          import json, pathlib, sys
          subsystems = {"semon-store", "semon-codex", "semon-claude", "semon-copilot", "semon-relay"}
          retired = subsystems | {"semon-forensic-export", "semon-relay-export"}
          unexpected = [line for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.split()[0] in retired]
          if unexpected:
              raise SystemExit("Product CLI gained retired subsystem/export dependencies: " + ", ".join(unexpected))
          metadata = json.loads(pathlib.Path(sys.argv[2]).read_text())
          members = set(metadata["workspace_members"])
          unexpected = [p["name"] for p in metadata["packages"] if p["id"] in members and p["name"] in retired]
          if unexpected:
              raise SystemExit("Retired workspace packages returned: " + ", ".join(unexpected))
          PY

      - name: Codex private device-login process checks
        run: |
          cargo clippy -p semon-runtime --all-targets --features codex-process --locked -- --no-deps -D warnings
          SEMON_TEST_COORDINATOR_SECRET=offline-fixture E2B_API_KEY=offline-fixture cargo test -p semon-runtime --features codex-process --locked

      - name: E2B private inventory process checks
        run: |
          cargo clippy -p semon-runtime --all-targets --features e2b-process --locked -- --no-deps -D warnings
          SEMON_TEST_COORDINATOR_SECRET=offline-fixture E2B_API_KEY=offline-fixture SEMON_TEST_NETWORK_GUARD=keep cargo test -p semon-runtime --features e2b-process --locked

  codex-conformance:
    name: Pinned Codex fixture conformance
    uses: ./.github/workflows/codex-conformance.yml

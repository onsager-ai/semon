name: Typed native witness measurement
on:
  workflow_dispatch:
  push:
    branches:
      - task/477-typed-witness-measurement-20261101
permissions:
  contents: read
concurrency:
  group: typed-witness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMON_PRICING_REFRESH: "off"
      SEMON_PG_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_f1 password=ephemeral-f1 dbname=postgres connect_timeout=2"
      SEMON_PG_ADMIN_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=ephemeral-ci-admin dbname=postgres connect_timeout=2"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-f1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pg-f1-${{ runner.os }}-
      - name: Create ephemeral restricted application role
        env:
          PGPASSWORD: ephemeral-ci-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE semon_f1 LOGIN PASSWORD 'ephemeral-f1' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT, CREATE ON DATABASE postgres TO semon_f1;
          SQL
      - name: Inventory native boundary
        run: python3 scripts/check-native-storage-boundary.py
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: cargo fmt --all --check
      - name: Retain exact formatting patch
        if: ${{ !cancelled() && steps.formatting.outcome == 'failure' }}
        run: |
          cargo fmt --all
          git -c gc.auto=0 -c maintenance.auto=false diff --binary -- '*.rs' > "$RUNNER_TEMP/typed-witness-rustfmt.patch"
          git -c gc.auto=0 -c maintenance.auto=false apply --reverse "$RUNNER_TEMP/typed-witness-rustfmt.patch"
      - name: Production library compiles without prototype
        run: cargo check --locked -p semon-sessions --lib
      - name: Genuine SQLite and private PG reconstruction and refusal
        id: reconstruction
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls typed_witness_genuine_fixture_ -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/typed-witness-tests.log"
          grep -F 'test result: ok. 2 passed; 0 failed;' "$RUNNER_TEMP/typed-witness-tests.log"
          test "$(grep -c 'typed_witness_cases positive=2 negative=10' "$RUNNER_TEMP/typed-witness-tests.log")" -eq 2
          test "$(grep -c 'typed_witness_production_refusal unchanged_head=true pending_claim_paths_unchanged=true publication_not_activated=true' "$RUNNER_TEMP/typed-witness-tests.log")" -eq 2
          test "$(grep -c 'typed_witness_pg_production_refusal kind=Busy reason=whole_stage_budget' "$RUNNER_TEMP/typed-witness-tests.log")" -eq 1
          test "$(grep -c 'typed_presentation_cases backend=.* exact_roundtrip=17 immutable_entry_checks=17 negative=103 publication_activated=false' "$RUNNER_TEMP/typed-witness-tests.log")" -eq 2
      - name: Focused library lint
        if: ${{ !cancelled() && steps.reconstruction.outcome == 'success' }}
        run: cargo clippy --locked -p semon-sessions --all-targets --features postgres-test-tls -- --no-deps -D warnings
      - name: Retain measurements and formatting evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typed-witness-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/typed-witness-tests.log
            ${{ runner.temp }}/typed-witness-rustfmt.patch
          if-no-files-found: error
      - name: Require formatting
        if: ${{ !cancelled() && steps.formatting.outcome != 'success' }}
        run: exit 1

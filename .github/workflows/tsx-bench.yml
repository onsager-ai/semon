# The TSX bench for docs/design/tsx.md: bundles one sample (a typed port of tooltip.js, the sidebar's session tree and a
# clamped brief) for each runtime (a hand-written h(), Preact, Solid, lit-html) with each bundler (esbuild, Bun, Vite), and
# writes install footprint, bundle times, output sizes, the viewer's banned-string test on each bundle, a single-file
# transform and tsc --noEmit to the job summary. One job. Nothing here is part of the Rust build or touches the viewer.
name: TSX bench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/design/tsx-bench/**'
      - '.github/workflows/tsx-bench.yml'

permissions:
  contents: read

concurrency:
  group: tsx-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bundlers and runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Install hyperfine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq hyperfine

      - name: Run the bench
        run: bash docs/design/tsx-bench/bench.sh

      - name: Write the job summary
        if: always()
        run: cat docs/design/tsx-bench/res/results.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsx-bench
          path: |
            docs/design/tsx-bench/out/
            docs/design/tsx-bench/res/
          if-no-files-found: ignore
          retention-days: 14

name: Star Catalog experiment

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SEMON_PRICING_REFRESH: "off"

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-star-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Fixture parity and atomicity
        run: |
          cargo test --locked -p semon-sessions --lib model::tests::star_catalog:: -- --skip star_catalog_scale --nocapture
      - name: Scale experiment (about 1 GB, 20k sessions)
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib model::tests::star_catalog::star_catalog_scale -- --exact --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/star-catalog-scale.log"
      - name: Preserve timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: star-catalog-scale
          path: ${{ runner.temp }}/star-catalog-scale.log
          if-no-files-found: ignore

name: Prepare UI migration inputs

on:
  push:
    branches: [feat/428-full-storybook-migration-20261019]

permissions:
  contents: read

concurrency:
  group: storybook-dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    if: ${{ contains(github.event.head_commit.message, '[storybook-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
      - run: npm --prefix ui install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: storybook-dependency-lock
          path: ui/package-lock.json
          if-no-files-found: error
  preview:
    if: ${{ !contains(github.event.head_commit.message, '[storybook-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            tests/ui/package-lock.json
      - name: Install locked product and preview tooling
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix tests/ui ci --no-audit --no-fund
      - name: Test the static preview server and executable migration plan
        id: server-tests
        run: node --test tests/ui/storybook-server.test.mjs tests/ui/storybook-plan.test.mjs
      - name: Install pinned Playwright Chromium
        id: browser
        if: ${{ !cancelled() && steps.server-tests.outcome == 'success' }}
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium
      - name: Check preview types
        id: typecheck
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm --prefix ui run storybook:typecheck
      - name: Build actual production stories
        id: build
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm --prefix ui run storybook:build
      - name: Validate exhaustive contract coverage
        id: contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm --prefix tests/ui run storybook:contract
      - name: Capture production stories and interaction states
        id: capture
        if: ${{ !cancelled() && steps.contract.outcome == 'success' }}
        continue-on-error: true
        run: npm --prefix tests/ui run storybook:capture
      - name: Report functional rendering independently of approval
        if: ${{ !cancelled() && steps.capture.outcome != 'skipped' }}
        run: node tests/ui/storybook-report.mjs --render-only
      - name: Prepare authored formatting corrections for review
        if: ${{ !cancelled() }}
        run: |
          npm --prefix ui run format
          npm --prefix ui exec -- prettier --write 'ui/.storybook/*.{mjs,tsx,css}' 'ui/stories/*.{ts,tsx}' ui/tsconfig.storybook.json
          git diff --binary > "$RUNNER_TEMP/storybook-format-review.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: storybook-preview-feedback
          path: |
            tests/ui/storybook-static
            tests/ui/out/storybook
            ${{ runner.temp }}/storybook-format-review.patch
          if-no-files-found: warn
      - name: Report render failures separately from pending approvals
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        run: node tests/ui/storybook-report.mjs
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: consumer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: onsager-ai/dev-skills
          ref: 7bc8f25f90994045df487517d9e43ff5ae078320
          path: canonical
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
      - name: Prepare generated projections against the reviewed prerequisite
        run: |
          node canonical/agent-config/sync.mjs --repo consumer --source canonical --revision 7bc8f25f90994045df487517d9e43ff5ae078320
          node consumer/.agents/sync.mjs --repo consumer --source canonical --check
          git -C consumer add --intent-to-add .agents .claude
          git -C consumer diff --binary > "$RUNNER_TEMP/agent-config-review.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-config-review
          path: ${{ runner.temp }}/agent-config-review.patch
          if-no-files-found: error
      - name: Census Storybook capture and mask owners
        working-directory: consumer
        run: node tests/ui/storybook-census.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: storybook-capture-census
          path: consumer/tests/ui/out/storybook/census
          if-no-files-found: warn

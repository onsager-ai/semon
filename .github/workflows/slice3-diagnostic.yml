name: Storage slice diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            target
          key: slice3-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Produce formatting patch
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/rustfmt.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustfmt
          path: ${{ runner.temp }}/rustfmt.patch
      - run: cargo test --locked -p semon-sessions --lib storage::conformance:: -- --nocapture
      - run: cargo test --locked -p semon-sessions --lib facts::tests:: -- --nocapture
      - run: cargo clippy --all-targets --locked -- --no-deps -D warnings

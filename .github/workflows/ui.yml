name: Grant publication and stable-order diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [live]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMON_PRICING_REFRESH: "off"
      SEMON_BUILD_TIMING: "1"
      SEMON_ORDER_SCHEMES: desktop-dark
      SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out
      SEMON_BIN: ${{ github.workspace }}/target/debug/semon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: viewer-test-binaries
          run-id: 41700956301
          github-token: ${{ github.token }}
          path: target/debug
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
      - uses: dtolnay/rust-toolchain@stable
        id: rust-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ui-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ui-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-
      - name: Enable existing fixed refusal labels for forensic binary only
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('crates/semon-sessions/src/storage/sqlite/semantic.rs')
          s = p.read_text()
          s, count = re.subn(r'#\[cfg\(test\)\]\n(\s*)(eprintln!\("semantic_record_conflict: [^"\n]+"\);)', lambda m: 'if crate::native_timing::enabled() {\n' + m[1] + m[2] + '\n' + m[1] + '}', s)
          assert count > 10, count
          p.write_text(s)
          PY
          cargo build --locked -p semon-cli --bin semon --features semon-sessions/test-clock
      - name: Browser prerequisites
        run: |
          chmod +x target/debug/semon
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          npm --prefix tests/ui ci --no-audit --no-fund
          cd tests/ui
          npx playwright install --with-deps chromium
      - name: Retain synthetic fixture state without changing the live oracle
        run: |
          mkdir -p tests/ui/out
          python3 - <<'PY'
          from pathlib import Path
          file = Path('tests/ui/native-fixture.mjs')
          text = file.read_text()
          old = "const capture = (value) => (output = (output + value).slice(-16384));"
          new = "const capture = (value) => { fs.appendFileSync(path.join(process.env.SEMON_UI_OUT, 'native-live.log'), value); output = (output + value).slice(-16384); };"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "fs.rmSync(root, { recursive: true, force: true });"
          new = "fs.cpSync(root, path.join(process.env.SEMON_UI_OUT, 'native-root'), { recursive: true }); " + old
          assert text.count(old) == 1
          file.write_text(text.replace(old, new))
          file = Path('tests/ui/checks/order.mjs')
          text = file.read_text()
          layout = "() => ({main: document.querySelector('#main')?.scrollTop, document: document.scrollingElement?.scrollTop, topbar: document.querySelector('#topbar')?.getBoundingClientRect().bottom, list: document.querySelector('.session-list')?.getBoundingClientRect().top, heading: document.querySelector('h1')?.textContent, text: document.querySelector('#main')?.innerText.slice(0, 500)})"
          old = "const before = await rows(page, '.session-list .nrow');"
          assert text.count(old) == 1
          text = text.replace(old, old + "\n      const layoutBefore = await page.evaluate(" + layout + ");\n      await page.screenshot({path: process.env.SEMON_UI_OUT + '/order-before.png', fullPage: true});")
          old = "assert.ok(still(before, held), 'row coordinates and scroll stay fixed');"
          assert text.count(old) == 1
          new = "console.log('ORDER_LAYOUT', JSON.stringify({before: before.slice(0, 8), held: held.slice(0, 8), layoutBefore, layoutAfter: await page.evaluate(" + layout + ")}));\n      await page.screenshot({path: process.env.SEMON_UI_OUT + '/order-after.png', fullPage: true});\n      " + old
          file.write_text(text.replace(old, new))
          PY
      - name: Unchanged native publication and order checks
        run: node tests/ui/checks/${{ matrix.suite }}.mjs
      - name: Bounded durable publication state
        if: always()
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          for file in Path('tests/ui/out/native-root').glob('*'):
              if not file.is_file() or file.open('rb').read(16) != b'SQLite format 3\x00':
                  continue
              print('DATABASE', file.name)
              db = sqlite3.connect(file)
              names = [row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
              print('TABLES', ','.join(names))
              for name in names:
                  if name in ('meta', 'storage_source_journal', 'session_catalog_invalidations', 'catalog_semantic_sources') or 'stage' in name:
                      columns = [row[1] for row in db.execute(f'PRAGMA table_info("{name}")')]
                      count = db.execute(f'SELECT count(*) FROM "{name}"').fetchone()[0]
                      print('STATE', name, 'count', count, 'columns', columns)
                      for row in db.execute(f'SELECT * FROM "{name}" LIMIT 8'):
                          print(tuple(str(value)[:400] for value in row))
              for query in (
                  "SELECT 'root_bytes',count(*),min(length(CAST(manifest AS BLOB))),max(length(CAST(manifest AS BLOB))) FROM storage_proof_presentation_roots",
                  "SELECT 'history_bytes',session_key,length(CAST(metadata AS BLOB)) FROM session_history_catalog ORDER BY session_key LIMIT 64",
                  "SELECT 'history_slots',session_key,count(*) FROM session_history_slots GROUP BY session_key ORDER BY session_key LIMIT 64",
                  "SELECT 'direct_grants',owner_kind,count(*),max(length(CAST(direct_capture AS BLOB))) FROM storage_catalog_native_observation_grants GROUP BY owner_kind",
              ):
                  for row in db.execute(query):
                      print(row)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: grant-${{ matrix.suite }}-diagnostic
          path: tests/ui/out

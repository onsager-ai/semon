name: Native 477 reader diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  SEMON_PRICING_REFRESH: "off"
jobs:
  checks:
    name: viewer / ${{ matrix.suite }}
    if: ${{ github.event_name != 'workflow_dispatch' || !(inputs.native_foundation_measurement || inputs.selected_readiness_measurement) || inputs.refresh_diagnostics }}
    runs-on: ubuntu-latest
    # The diagnostic lane runs the unchanged journey twice plus a phase sweep.
    # Product deadlines and every other suite's existing allowance stay unchanged.
    timeout-minutes: ${{ matrix.suite == 'performance' && inputs.refresh_diagnostics && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        suite: [navigation, transcript, accessibility, live, order-desktop-dark]
    env:
      SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out
      SEMON_CATALOG_OUT: ${{ github.workspace }}/tests/ui/out/catalog-phases
      SEMON_BIN: ${{ github.workspace }}/target/debug/semon
      SEMON_UI_COVERAGE: ${{ inputs.exhaustive && 'exhaustive' || 'representative' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: viewer-test-binaries
          run-id: 41712781845
          github-token: ${{ github.token }}
          path: target/debug
      - name: Download selected UI reference
        if: matrix.suite == 'visual' || matrix.suite == 'transport'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: viewer-ui-reference-binary
          path: target/ui-reference
      - name: Restore executable permissions
        run: chmod +x target/debug/semon target/debug/examples/ui-account-server
      - name: Restore baseline executable permissions
        if: matrix.suite == 'performance' && inputs.refresh_diagnostics
        run: chmod +x target/debug/semon-refresh-baseline
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      # Keep signed Ubuntu packages; avoid the intermittently unreachable Azure mirror.
      - name: Configure Ubuntu browser dependency mirrors
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null

      - name: Install the check tooling and Chromium
        working-directory: tests/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install pinned UI consumer tooling
        run: npm --prefix ui ci --no-audit --no-fund

      - name: Browser touch infrastructure regression tests
        if: matrix.suite == 'interaction'
        run: node --test tests/ui/tap-hit.test.mjs tests/ui/capture-paint.test.mjs

      - name: Independent shared-account and application-shell lifecycle
        if: matrix.suite == 'interaction'
        env:
          SEMON_CATALOG_OUT: ${{ github.workspace }}/tests/ui/out/catalog-recovery
        run: |
          node --test tests/ui/text-audit.test.mjs
          node tests/ui/gallery.mjs
          node tests/ui/compact-gallery.mjs
          node tests/ui/native-controls.mjs
          node --test ui/tests/browser-lifecycle.mjs ui/tests/application-lifecycle.mjs ui/tests/native-shell-lifecycle.mjs ui/tests/select-lifecycle.mjs ui/tests/code-scroll.mjs ui/tests/control-observation-browser.mjs ui/tests/jump-toolbar.mjs ui/tests/catalog-viewer-browser.mjs ui/tests/runtime-leaf-browser.mjs ui/tests/continuity-refinement-browser.mjs ui/tests/staging-viewer-browser.mjs ui/tests/passive-reading-browser.mjs

      - name: Actual default catalog producer, keyboard and visual geometry
        if: matrix.suite == 'interaction'
        env:
          SEMON_CATALOG_SERVED_BIN: ${{ github.workspace }}/target/debug/semon
          SEMON_CATALOG_SERVED_SOURCE: ${{ github.sha }}
          SEMON_CATALOG_SERVED_EVIDENCE: ${{ github.workspace }}/tests/ui/out/catalog-default.json
          SEMON_OVERVIEW_VISUAL_OUT: ${{ github.workspace }}/tests/ui/out/overview-default
          SEMON_CATALOG_VISUAL_OUT: ${{ github.workspace }}/tests/ui/out/catalog-default
        run: node --test ui/tests/catalog-served.mjs ui/tests/overview-served.mjs

      - name: Capture exact reader and browser failure state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path('tests/ui/lib.mjs')
          text = file.read_text()
          old = "  page.errors = [];"
          new = old + "\n  const readerEvents = [];\n  page.on('response', response => { const url = new URL(response.url()); if (url.pathname.startsWith('/api/')) { readerEvents.push({at: Date.now(), status: response.status(), path: url.pathname, query: url.search}); if (readerEvents.length > 40) readerEvents.shift(); }});\n  page.on('close', () => console.log('READER_EVENTS', JSON.stringify(readerEvents)));"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "pathname: location.pathname,"
          new = old + "\n          text: document.querySelector('#page')?.innerText.slice(0, 1500),\n          nestedBusy: [...document.querySelectorAll('[aria-busy]')].map(x => x.outerHTML.slice(0, 500)),"
          assert text.count(old) == 4
          text = text.replace(old, new)
          old = "const pageErrors = 'errors' in page ?"
          new = "console.log('GOTO_STATE', JSON.stringify(state), JSON.stringify(readerEvents));\n      " + old
          # readerEvents belongs to served(), so the shared goto reads a page field.
          text = text.replace("  const readerEvents = [];", "  const readerEvents = page.readerEvents = [];")
          new = new.replace('JSON.stringify(readerEvents)', 'JSON.stringify(page.readerEvents)')
          assert text.count(old) == 1
          file.write_text(text.replace(old, new))
          file = Path('tests/ui/checks/viewer-backlog.mjs')
          text = file.read_text()
          old = "      assert(\n        rows.length > 0 &&"
          assert text.count(old) == 1
          file.write_text(text.replace(old, "      console.log('METADATA_ROWS', JSON.stringify(rows));\n" + old))
          file = Path('tests/ui/checks/turns.mjs')
          text = file.read_text()
          old = "if (!t) return { st, found: false };"
          new = "if (!t) return { st, found: false, busy: document.querySelector('#page')?.getAttribute('aria-busy'), turns: [...document.querySelectorAll('.turn')].map(x => x.dataset.turn), text: document.querySelector('#page')?.innerText.slice(0, 700) };"
          assert text.count(old) == 1
          file.write_text(text.replace(old, new))
          file = Path('tests/ui/native-fixture.mjs')
          text = file.read_text()
          old = "const capture = (value) => (output = (output + value).slice(-16384));"
          new = "const capture = (value) => { fs.mkdirSync(process.env.SEMON_UI_OUT, { recursive: true }); fs.appendFileSync(path.join(process.env.SEMON_UI_OUT, 'native-live.log'), value); output = (output + value).slice(-16384); };"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "fs.rmSync(root, { recursive: true, force: true });"
          assert text.count(old) == 1
          file.write_text(text.replace(old, "fs.cpSync(root, path.join(process.env.SEMON_UI_OUT, 'native-root'), { recursive: true }); " + old))
          PY

      - name: Write the sample fixtures
        run: |
          echo "SEMON_NOW=$(node tests/ui/fixture.mjs "$RUNNER_TEMP/sample")" >> "$GITHUB_ENV"
          node tests/ui/fixture.mjs "$RUNNER_TEMP/sample-extras" --extras > /dev/null

      - name: Serve the fixtures
        env:
          SEMON_BUILD_TIMING: '1'
        run: |
          serve() { # name port dir
            SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/semon sessions --serve --listen "127.0.0.1:$2" \
              --claude-home "$3/claude" --claude-json "$3/.claude.json" --codex-home "$3/codex" --copilot-home "$3/copilot" --proc-root "$3/proc" --cache "$3/index.json" \
              < /dev/null > "$RUNNER_TEMP/$1.log" 2>&1 &
            for _ in $(seq 1 100); do
              url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/$1.log" || true)
              [ -n "$url" ] && break
              sleep 0.2
            done
            [ -n "$url" ] || { cat "$RUNNER_TEMP/$1.log"; exit 1; }
            echo "${url%%/?t=*} ${url##*t=}"
          }
          read -r base token < <(serve sample 8765 "$RUNNER_TEMP/sample")
          [ -n "$token" ] || { cat "$RUNNER_TEMP"/sample*.log; exit 1; }
          echo "SEMON_BASE=$base" >> "$GITHUB_ENV"
          echo "SEMON_TOKEN=$token" >> "$GITHUB_ENV"
          read -r base token < <(serve sample-extras 8766 "$RUNNER_TEMP/sample-extras")
          [ -n "$token" ] || { cat "$RUNNER_TEMP"/sample*.log; exit 1; }
          echo "SEMON_EXTRA_BASE=$base" >> "$GITHUB_ENV"
          echo "SEMON_EXTRA_TOKEN=$token" >> "$GITHUB_ENV"
          curl -fsS -o /dev/null "$base/?t=$token"
          SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/examples/ui-account-server \
            127.0.0.1:8768 "$RUNNER_TEMP/sample-extras/claude" "$RUNNER_TEMP/sample-extras/codex" \
            "$RUNNER_TEMP/sample-extras/proc" "$RUNNER_TEMP/sample-extras/account-index.json" \
            < /dev/null > "$RUNNER_TEMP/account-menu.log" 2>&1 &
          for _ in $(seq 1 100); do
            url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/account-menu.log" || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { cat "$RUNNER_TEMP/account-menu.log"; exit 1; }
          base="${url%%/?t=*}"; token="${url##*t=}"
          echo "SEMON_ACCOUNT_BASE=$base" >> "$GITHUB_ENV"
          echo "SEMON_ACCOUNT_TOKEN=$token" >> "$GITHUB_ENV"
          curl -fsS -o /dev/null "$base/?t=$token"

      - name: Fixture gaps against the sample's data
        if: matrix.suite == 'navigation'
        working-directory: tests/ui
        run: node gaps.mjs --base "$SEMON_BASE" --token "$SEMON_TOKEN"

      - name: Functional checks
        if: contains(fromJSON('["navigation","transcript","shell","interaction","accessibility"]'), matrix.suite)
        working-directory: tests/ui
        run: node checks/run.mjs --group "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
      - name: Compare actual native and selected complete reading UI
        if: ${{ !cancelled() && matrix.suite == 'visual' }}
        run: |
          chmod +x target/ui-reference/semon
          SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/ui-reference/semon sessions --serve --listen 127.0.0.1:8770 \
            --claude-home "$RUNNER_TEMP/sample/claude" --claude-json "$RUNNER_TEMP/sample/.claude.json" --codex-home "$RUNNER_TEMP/sample/codex" --copilot-home "$RUNNER_TEMP/sample/copilot" --proc-root "$RUNNER_TEMP/sample/proc" --cache "$RUNNER_TEMP/ui-reference-index.json" \
            < /dev/null > "$RUNNER_TEMP/ui-reference.log" 2>&1 &
          for _ in $(seq 1 100); do
            url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/ui-reference.log" || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { cat "$RUNNER_TEMP/ui-reference.log"; exit 1; }
          cd tests/ui
          export SEMON_PRESERVATION_BASE="${url%%/?t=*}" SEMON_PRESERVATION_TOKEN="${url##*t=}"
          failed=0
          node preservation.mjs || failed=1
          SEMON_PIXEL_SCOPE=main node pixels.mjs || failed=1
          exit "$failed"

      - name: Live updates while the logs are written
        if: ${{ !cancelled() && matrix.suite == 'live' }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
        run: node checks/live.mjs

      - name: Errors mode
        if: ${{ !cancelled() && matrix.suite == 'performance' }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
        run: node checks/errnav.mjs

      - name: Long-session performance
        if: ${{ !cancelled() && matrix.suite == 'performance' }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
          SEMON_PERF_SOURCE: ${{ github.sha }}
          SEMON_PERF_REFRESH_DIAGNOSTICS: ${{ inputs.refresh_diagnostics && '1' || '0' }}
        run: node checks/perf.mjs

      - name: Same-run pinned baseline live-refresh comparison
        if: ${{ !cancelled() && matrix.suite == 'performance' && inputs.refresh_diagnostics }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon-refresh-baseline
          SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out/refresh-baseline
          SEMON_PERF_SOURCE: c402e481dbe23bcf03841e47b5f7eccd14c0e426
          SEMON_PERF_REFRESH_DIAGNOSTICS: '1'
        run: node checks/perf.mjs

      # Requests, bytes and long tasks per screen (perf step 0). Report only: it prints the lines over tests/ui/perf-budget.json
      # and fails only when it could not measure.
      - name: Request and main-thread budget
        if: ${{ !cancelled() && matrix.suite == 'performance' }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
        run: node checks/budget.mjs

      # Keep the historical two-machine routes on a second actual-reference
      # comparison; every frame uses the pinned compat=1 binary and strict gate.
      - name: Two machines in one viewer against the selected complete UI
        if: ${{ !cancelled() && matrix.suite == 'transport' }}
        env:
          SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out/two-machines
        run: |
          [ "$(node tests/ui/fixture.mjs "$RUNNER_TEMP/second" --second)" = "$SEMON_NOW" ]
          chmod +x target/ui-reference/semon
          SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/semon sessions --serve --listen 127.0.0.1:8767 --claude-json "$RUNNER_TEMP/sample/.claude.json" \
            --machine "$RUNNER_TEMP/sample" --machine "$RUNNER_TEMP/second" < /dev/null > "$RUNNER_TEMP/two-machines.log" 2>&1 &
          for _ in $(seq 1 100); do
            url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/two-machines.log" || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { cat "$RUNNER_TEMP/two-machines.log"; exit 1; }
          candidate_base="${url%%/?t=*}"; candidate_token="${url##*t=}"
          SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/ui-reference/semon sessions --serve --listen 127.0.0.1:8772 --claude-json "$RUNNER_TEMP/sample/.claude.json" \
            --machine "$RUNNER_TEMP/sample" --machine "$RUNNER_TEMP/second" < /dev/null > "$RUNNER_TEMP/two-machines-reference.log" 2>&1 &
          for _ in $(seq 1 100); do
            reference_url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/two-machines-reference.log" || true)
            [ -n "$reference_url" ] && break
            sleep 0.2
          done
          [ -n "$reference_url" ] || { cat "$RUNNER_TEMP/two-machines-reference.log"; exit 1; }
          cd tests/ui
          SEMON_BASE="$candidate_base" SEMON_TOKEN="$candidate_token" \
            SEMON_PRESERVATION_BASE="${reference_url%%/?t=*}" SEMON_PRESERVATION_TOKEN="${reference_url##*t=}" \
            SEMON_PIXEL_SCOPE=two-machines node pixels.mjs

      # A second machine the way one really arrives: the sample fixture pushed over loopback (plain http, so no TLS) to `semon
      # receive`, which writes it under recv/machines/laptop. The token is written to a 0600 file and never echoed. Both the
      # receiver and `semon push --watch` keep running for the step below, as they would on a real pair of machines.
      # The model built from that copy must equal the machine's own, byte for byte (tests/ui/pushed-parity.mjs).
      - name: Pushed data, received and compared with the machine's own model
        id: pushed-parity
        if: ${{ !cancelled() && matrix.suite == 'transport' }}
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
          SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out/pushed
        run: |
          recv="$RUNNER_TEMP/recv"; fixture_root="$RUNNER_TEMP/sample"
          mkdir -p "$RUNNER_TEMP/recv-home" "$RUNNER_TEMP/pushed"
          (umask 077; target/debug/semon receive token add laptop --dir "$recv" \
            2> "$RUNNER_TEMP/token-add.log" | tr -d '\n' > "$RUNNER_TEMP/recv.token")
          chmod 600 "$RUNNER_TEMP/recv.token"
          [ "$(wc -c < "$RUNNER_TEMP/recv.token")" -eq 43 ] || { cat "$RUNNER_TEMP/token-add.log"; echo "no token was written"; exit 1; }
          setsid nohup target/debug/semon receive --listen 127.0.0.1:0 --dir "$recv" \
            < /dev/null > "$RUNNER_TEMP/receive.log" 2>&1 &
          for _ in $(seq 1 100); do
            url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*' "$RUNNER_TEMP/receive.log" || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { cat "$RUNNER_TEMP/receive.log"; exit 1; }
          XDG_STATE_HOME="$RUNNER_TEMP/push-state" SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/semon push --watch \
            --to "$url" --token-file "$RUNNER_TEMP/recv.token" --state "$RUNNER_TEMP/push-state.json" \
            --claude-home "$fixture_root/claude" --claude-json "$fixture_root/.claude.json" --codex-home "$fixture_root/codex" --copilot-home "$fixture_root/copilot" --proc-root "$fixture_root/proc" --cache "$RUNNER_TEMP/push-index.json" \
            < /dev/null > "$RUNNER_TEMP/push.log" 2>&1 &
          SEMON_TEST_NOW="$SEMON_NOW" node tests/ui/pushed-parity.mjs --home "$fixture_root" --received "$recv" --scratch "$RUNNER_TEMP/pushed"

      # The viewer over the pushed copy alone (--no-local), and the subset of the suite that shows the pushed data renders as
      # the local one does: the fixture gaps (the served model and every transcript against the retained fixture data, so the
      # pushed transcripts are the machine's own), and the pixel comparison, served against served (the pushed copy against the
      # machine's own server), of root Sessions, the sessions list, Analytics and two
      # session transcripts (harbor, a Claude session with a Codex run and a subagent under it, and deps, a Codex run), at
      # 390×844 light and dark and 1280×860 light. The rest of the suite is about the viewer, not the data, and runs on the
      # local fixture above.
      - name: Pushed data in the viewer
        if: ${{ !cancelled() && matrix.suite == 'transport' && steps.pushed-parity.outcome == 'success' }}
        env:
          SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out/pushed
          SEMON_PIXEL_SCOPE: pushed
          # The pushed copy's screens are compared with the same screens on the machine's own server (started above), not with a
          # mockup: the same viewer over the same data must draw the same pixels.
          SEMON_REF_BASE: ${{ env.SEMON_BASE }}
          SEMON_REF_TOKEN: ${{ env.SEMON_TOKEN }}
        run: |
          [ -d "$RUNNER_TEMP/recv/machines/laptop" ] || { echo "nothing was received"; exit 1; }
          reader="$RUNNER_TEMP/pushed/reader"
          SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/semon sessions --serve --listen 127.0.0.1:8769 \
            --machines "$RUNNER_TEMP/recv" --no-local --claude-home "$reader/claude" --claude-json "$reader/.claude.json" --codex-home "$reader/codex" --copilot-home "$reader/copilot" \
            --proc-root "$reader/proc" --cache "$reader/serve-index.json" < /dev/null > "$RUNNER_TEMP/pushed-viewer.log" 2>&1 &
          for _ in $(seq 1 100); do
            url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/pushed-viewer.log" || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { cat "$RUNNER_TEMP/pushed-viewer.log"; exit 1; }
          export SEMON_BASE="${url%%/?t=*}" SEMON_TOKEN="${url##*t=}"
          cd tests/ui
          node pushed-parity.mjs --native-pages
          failed=0
          node gaps.mjs --base "$SEMON_BASE" --token "$SEMON_TOKEN" || failed=1
          node pixels.mjs || failed=1
          # An empty or short list of screens must not pass: 5 screens at 3 schemes.
          node -e 'const n = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).results.length; if (n !== 15) { console.error("pixels compared " + n + " screens, expected 15"); process.exit(1); } console.log("pixels compared " + n + " screens")' \
            "$SEMON_UI_OUT/pixels.json" || failed=1
          exit "$failed"

      # Lists of sessions keep their rows where they are while updates arrive; what they hold applies when the list is out of sight.
      - name: Stable session order
        if: ${{ !cancelled() && startsWith(matrix.suite, 'order-') }}
        working-directory: tests/ui
        env:
          SEMON_BUILD_TIMING: '1'
          SEMON_ORDER_SCHEMES: ${{ matrix.suite == 'order-phone' && 'phone-light,phone-dark' || matrix.suite == 'order-desktop-light' && 'desktop-light' || 'desktop-dark' }}
        run: node checks/order.mjs
      - name: Retain bounded per-case visual binding provenance
        if: ${{ always() && (matrix.suite == 'visual' || matrix.suite == 'transport') }}
        run: node tests/ui/visual-provenance.mjs
      - name: Qualify existing visual bindings against current captures
        if: ${{ always() && (matrix.suite == 'visual' || matrix.suite == 'transport') }}
        run: node tests/ui/visual-pathname-audit.mjs
      - name: Propose qualified visual binding maintenance
        if: ${{ always() && (matrix.suite == 'visual' || matrix.suite == 'transport') }}
        env:
          SEMON_VISUAL_PROPOSAL_SUITE: ${{ matrix.suite }}
        run: node tests/ui/visual-binding-proposal.mjs
      - name: Server logs
        if: ${{ always() }}
        run: cat "$RUNNER_TEMP"/sample*.log "$RUNNER_TEMP"/account-menu.log "$RUNNER_TEMP"/two-machines.log "$RUNNER_TEMP"/two-machines-reference.log "$RUNNER_TEMP"/receive.log "$RUNNER_TEMP"/push.log "$RUNNER_TEMP"/pushed-viewer.log || true

      - name: Upload reports, screenshots and diffs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-ui-${{ matrix.suite }}
          path: tests/ui/out
          if-no-files-found: warn


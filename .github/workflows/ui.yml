# The session viewer's browser checks (#40 M4, decision D2). Builds `semon` with a test clock, writes the synthetic sample
# fixture (tests/ui/fixture.mjs) and its extras variant, serves them and an embedding-API fixture, and runs, in Chromium
# through Playwright:
#   - the fixture's gaps against the sample mockup's data (tests/ui/gaps.mjs, listed in tests/ui/gaps.json),
#   - the mockup's check scripts, ported to the served viewer (tests/ui/checks/),
#   - a pixel comparison of every screen with the mockup (tests/ui/pixels.mjs), at 390×844 light and dark and 1280×860.
# and, on fixtures of its own that it writes to while the page is open, the live-update check (tests/ui/checks/live.mjs) and
# the errors-mode check (tests/ui/checks/errnav.mjs) and the stable-order check (tests/ui/checks/order.mjs).
# Then the sample pushed to `semon receive` by `semon push`, whose model must equal the machine's own and whose viewer must
# render it like the local one (tests/ui/pushed-parity.mjs, and a subset of the gaps and pixel checks).
# Node and Playwright are CI-only tooling in tests/ui/package.json; the Rust build doesn't depend on them. Nothing here
# touches a real ~/.claude or ~/.codex: the server reads only the fixture.
name: Viewer UI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser:
    name: viewer browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unpinned on purpose, as in rust.yml: the ref selects the stable channel.
      - name: Install Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ui-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ui-cargo-${{ steps.rust-toolchain.outputs.cachekey }}-

      # The test-clock feature lets SEMON_TEST_NOW pin the server's clock to the fixture's.
      - name: Build semon with the test clock
        run: cargo build --locked -p semon-store --bin semon --features semon-sessions/test-clock

      - name: Build the embedding API fixture
        run: cargo build --locked -p semon-sessions --example ui-account-server --features test-clock,test-ui-account-server

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install the check tooling and Chromium
        working-directory: tests/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser-check infrastructure regression tests
        run: node --test tests/ui/pixel-diff.test.mjs tests/ui/tap-hit.test.mjs tests/ui/checks/viewer-cache.test.mjs tests/ui/checks/model-delta.test.mjs

      - name: Write the sample fixtures
        run: |
          echo "SEMON_NOW=$(node tests/ui/fixture.mjs "$RUNNER_TEMP/sample")" >> "$GITHUB_ENV"
          node tests/ui/fixture.mjs "$RUNNER_TEMP/sample-extras" --extras > /dev/null

      - name: Serve the fixtures
        run: |
          serve() { # name port dir
            SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/semon sessions --serve --listen "127.0.0.1:$2" \
              --claude-home "$3/claude" --claude-json "$3/.claude.json" --codex-home "$3/codex" --proc-root "$3/proc" --cache "$3/index.json" \
              < /dev/null > "$RUNNER_TEMP/$1.log" 2>&1 &
            for _ in $(seq 1 100); do
              url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/$1.log" || true)
              [ -n "$url" ] && break
              sleep 0.2
            done
            [ -n "$url" ] || { cat "$RUNNER_TEMP/$1.log"; exit 1; }
            echo "${url%%/?t=*} ${url##*t=}"
          }
          read -r base token < <(serve sample 8765 "$RUNNER_TEMP/sample")
          [ -n "$token" ] || { cat "$RUNNER_TEMP"/sample*.log; exit 1; }
          echo "SEMON_BASE=$base" >> "$GITHUB_ENV"
          echo "SEMON_TOKEN=$token" >> "$GITHUB_ENV"
          read -r base token < <(serve sample-extras 8766 "$RUNNER_TEMP/sample-extras")
          [ -n "$token" ] || { cat "$RUNNER_TEMP"/sample*.log; exit 1; }
          echo "SEMON_EXTRA_BASE=$base" >> "$GITHUB_ENV"
          echo "SEMON_EXTRA_TOKEN=$token" >> "$GITHUB_ENV"
          curl -fsS -o /dev/null "$base/?t=$token"
          SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/examples/ui-account-server \
            127.0.0.1:8768 "$RUNNER_TEMP/sample-extras/claude" "$RUNNER_TEMP/sample-extras/codex" \
            "$RUNNER_TEMP/sample-extras/proc" "$RUNNER_TEMP/sample-extras/account-index.json" \
            < /dev/null > "$RUNNER_TEMP/account-menu.log" 2>&1 &
          for _ in $(seq 1 100); do
            url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/account-menu.log" || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { cat "$RUNNER_TEMP/account-menu.log"; exit 1; }
          base="${url%%/?t=*}"; token="${url##*t=}"
          echo "SEMON_ACCOUNT_BASE=$base" >> "$GITHUB_ENV"
          echo "SEMON_ACCOUNT_TOKEN=$token" >> "$GITHUB_ENV"
          curl -fsS -o /dev/null "$base/?t=$token"

      - name: Fixture gaps against the sample's data
        working-directory: tests/ui
        run: node gaps.mjs --base "$SEMON_BASE" --token "$SEMON_TOKEN"

      - name: Mockup check scripts on the served viewer
        if: ${{ !cancelled() }}
        working-directory: tests/ui
        run: node checks/run.mjs

      - name: Pixel comparison with the mockup
        if: ${{ !cancelled() }}
        working-directory: tests/ui
        run: node pixels.mjs

      - name: Live updates while the logs are written
        if: ${{ !cancelled() }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
        run: node checks/live.mjs

      # Lists of sessions keep their rows where they are while updates arrive; what they hold applies when the list is out of sight.
      - name: Stable session order
        if: ${{ !cancelled() }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
        run: node checks/order.mjs

      # "N errors" stepping through failed steps spread over unloaded pages, with a failure written while it is open.
      - name: Errors mode
        if: ${{ !cancelled() }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
        run: node checks/errnav.mjs

      - name: Long-session performance
        if: ${{ !cancelled() }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
        run: node checks/perf.mjs

      # Requests, bytes and long tasks per screen (perf step 0). Report only: it prints the lines over tests/ui/perf-budget.json
      # and fails only when it could not measure.
      - name: Request and main-thread budget
        if: ${{ !cancelled() }}
        working-directory: tests/ui
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
        run: node checks/budget.mjs

      # One viewer over two machines' homes (the sample and a second machine, `desktop`): its Machines screens, held to
      # their baselines against the overhaul mockup (the "two-machines" section of tests/ui/pixel-baseline.json), at 390×844
      # and 1280×860, light and dark.
      - name: Two machines in one viewer
        if: ${{ !cancelled() }}
        env:
          SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out/two-machines
          SEMON_PIXEL_SCREENS: machines,machine-
          SEMON_PIXEL_SCHEMES: all
          SEMON_PIXEL_BASELINE: two-machines
        run: |
          [ "$(node tests/ui/fixture.mjs "$RUNNER_TEMP/second" --second)" = "$SEMON_NOW" ]
          SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/semon sessions --serve --listen 127.0.0.1:8767 --claude-json "$RUNNER_TEMP/sample/.claude.json" \
            --machine "$RUNNER_TEMP/sample" --machine "$RUNNER_TEMP/second" < /dev/null > "$RUNNER_TEMP/two-machines.log" 2>&1 &
          for _ in $(seq 1 100); do
            url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/two-machines.log" || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { cat "$RUNNER_TEMP/two-machines.log"; exit 1; }
          cd tests/ui
          SEMON_BASE="${url%%/?t=*}" SEMON_TOKEN="${url##*t=}" node pixels.mjs

      # A second machine the way one really arrives: the sample fixture pushed over loopback (plain http, so no TLS) to `semon
      # receive`, which writes it under recv/machines/laptop. The token is written to a 0600 file and never echoed. Both the
      # receiver and `semon push --watch` keep running for the step below, as they would on a real pair of machines.
      # The model built from that copy must equal the machine's own, byte for byte (tests/ui/pushed-parity.mjs).
      - name: Pushed data, received and compared with the machine's own model
        if: ${{ !cancelled() }}
        env:
          SEMON_BIN: ${{ github.workspace }}/target/debug/semon
          SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out/pushed
        run: |
          recv="$RUNNER_TEMP/recv"; fixture_root="$RUNNER_TEMP/sample"
          mkdir -p "$RUNNER_TEMP/recv-home" "$RUNNER_TEMP/pushed"
          (umask 077; target/debug/semon receive token add laptop --dir "$recv" \
            2> "$RUNNER_TEMP/token-add.log" | tr -d '\n' > "$RUNNER_TEMP/recv.token")
          chmod 600 "$RUNNER_TEMP/recv.token"
          [ "$(wc -c < "$RUNNER_TEMP/recv.token")" -eq 43 ] || { cat "$RUNNER_TEMP/token-add.log"; echo "no token was written"; exit 1; }
          setsid nohup target/debug/semon receive --listen 127.0.0.1:0 --dir "$recv" \
            < /dev/null > "$RUNNER_TEMP/receive.log" 2>&1 &
          for _ in $(seq 1 100); do
            url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*' "$RUNNER_TEMP/receive.log" || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { cat "$RUNNER_TEMP/receive.log"; exit 1; }
          XDG_STATE_HOME="$RUNNER_TEMP/push-state" SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/semon push --watch \
            --to "$url" --token-file "$RUNNER_TEMP/recv.token" --state "$RUNNER_TEMP/push-state.json" \
            --claude-home "$fixture_root/claude" --claude-json "$fixture_root/.claude.json" --codex-home "$fixture_root/codex" --proc-root "$fixture_root/proc" --cache "$RUNNER_TEMP/push-index.json" \
            < /dev/null > "$RUNNER_TEMP/push.log" 2>&1 &
          SEMON_TEST_NOW="$SEMON_NOW" node tests/ui/pushed-parity.mjs --home "$fixture_root" --received "$recv" --scratch "$RUNNER_TEMP/pushed"

      # The viewer over the pushed copy alone (--no-local), and the subset of the suite that shows the pushed data renders as
      # the local one does: the fixture gaps (the served model and every transcript against the sample mockup's data, so the
      # pushed transcripts are the machine's own), and the pixel comparison, served against served (the pushed copy against the
      # machine's own server), of Home, the sessions list, Analytics and two
      # session transcripts (harbor, a Claude session with a Codex run and a subagent under it, and deps, a Codex run), at
      # 390×844 light and dark and 1280×860 light. The rest of the suite is about the viewer, not the data, and runs on the
      # local fixture above.
      - name: Pushed data in the viewer
        if: ${{ !cancelled() }}
        env:
          SEMON_UI_OUT: ${{ github.workspace }}/tests/ui/out/pushed
          SEMON_PIXEL_SCREENS: home,sessions,analytics,session-harbor,session-deps
          # The pushed copy's screens are compared with the same screens on the machine's own server (started above), not with a
          # mockup: the same viewer over the same data must draw the same pixels.
          SEMON_REF_BASE: ${{ env.SEMON_BASE }}
          SEMON_REF_TOKEN: ${{ env.SEMON_TOKEN }}
        run: |
          [ -d "$RUNNER_TEMP/recv/machines/laptop" ] || { echo "nothing was received"; exit 1; }
          reader="$RUNNER_TEMP/pushed/reader"
          SEMON_TEST_NOW="$SEMON_NOW" setsid nohup target/debug/semon sessions --serve --listen 127.0.0.1:8769 \
            --machines "$RUNNER_TEMP/recv" --no-local --claude-home "$reader/claude" --claude-json "$reader/.claude.json" --codex-home "$reader/codex" \
            --proc-root "$reader/proc" --cache "$reader/serve-index.json" < /dev/null > "$RUNNER_TEMP/pushed-viewer.log" 2>&1 &
          for _ in $(seq 1 100); do
            url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/pushed-viewer.log" || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { cat "$RUNNER_TEMP/pushed-viewer.log"; exit 1; }
          export SEMON_BASE="${url%%/?t=*}" SEMON_TOKEN="${url##*t=}"
          cd tests/ui
          failed=0
          node gaps.mjs --base "$SEMON_BASE" --token "$SEMON_TOKEN" || failed=1
          node pixels.mjs || failed=1
          # An empty or short list of screens must not pass: 5 screens at 3 schemes.
          node -e 'const n = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).results.length; if (n !== 15) { console.error("pixels compared " + n + " screens, expected 15"); process.exit(1); } console.log("pixels compared " + n + " screens")' \
            "$SEMON_UI_OUT/pixels.json" || failed=1
          exit "$failed"

      - name: Server logs
        if: ${{ always() }}
        run: cat "$RUNNER_TEMP"/sample*.log "$RUNNER_TEMP"/account-menu.log "$RUNNER_TEMP"/two-machines.log "$RUNNER_TEMP"/receive.log "$RUNNER_TEMP"/push.log "$RUNNER_TEMP"/pushed-viewer.log || true

      - name: Upload reports, screenshots and diffs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-ui
          path: tests/ui/out
          if-no-files-found: warn

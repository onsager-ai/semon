name: 380 actual expanded reading diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: viewer-test-binaries
          run-id: 38997873684
          github-token: ${{ github.token }}
          path: target/debug
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: viewer-ui-reference-binary
          run-id: 38997873684
          github-token: ${{ github.token }}
          path: target/ui-reference
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: viewer-ui-before-binary
          run-id: 38997873684
          github-token: ${{ github.token }}
          path: target/ui-before
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
      - name: Install matching browser tools
        working-directory: tests/ui
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve the exact candidate, before and reference artifacts
        run: |
          chmod +x target/debug/semon target/ui-before/semon target/ui-reference/semon
          now=$(node tests/ui/fixture.mjs "$RUNNER_TEMP/sample")
          echo "SEMON_NOW=$now" >> "$GITHUB_ENV"
          serve() {
            local name=$1 bin=$2 port=$3 url
            SEMON_TEST_NOW="$now" setsid nohup "$bin" sessions --serve --listen "127.0.0.1:$port" \
              --claude-home "$RUNNER_TEMP/sample/claude" --claude-json "$RUNNER_TEMP/sample/.claude.json" \
              --codex-home "$RUNNER_TEMP/sample/codex" --copilot-home "$RUNNER_TEMP/sample/copilot" \
              --proc-root "$RUNNER_TEMP/sample/proc" --cache "$RUNNER_TEMP/$name-index.json" \
              < /dev/null > "$RUNNER_TEMP/$name.log" 2>&1 &
            for _ in $(seq 1 150); do
              url=$(grep -m1 -o 'http://127.0.0.1:[0-9]*/?t=[0-9a-f]*' "$RUNNER_TEMP/$name.log" || true)
              [ -n "$url" ] && break
              sleep 0.2
            done
            [ -n "$url" ] || return 1
            echo "::add-mask::${url##*t=}"
            printf '%s\n' "$url" > "$RUNNER_TEMP/$name.url"
          }
          serve candidate target/debug/semon 8765
          serve before target/ui-before/semon 8771
          serve reference target/ui-reference/semon 8770
          candidate=$(cat "$RUNNER_TEMP/candidate.url")
          reference=$(cat "$RUNNER_TEMP/reference.url")
          echo "SEMON_BASE=${candidate%%/?t=*}" >> "$GITHUB_ENV"
          echo "SEMON_TOKEN=${candidate##*t=}" >> "$GITHUB_ENV"
          echo "SEMON_PRESERVATION_BASE=${reference%%/?t=*}" >> "$GITHUB_ENV"
          echo "SEMON_PRESERVATION_TOKEN=${reference##*t=}" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin fea65b1ae9fd67d987c41d0cf103e82b57fe8b16
          git show fea65b1ae9fd67d987c41d0cf103e82b57fe8b16:crates/semon-sessions/src/viewer.generated.js > "$RUNNER_TEMP/current-viewer.js"
          git fetch --no-tags --depth=1 origin eb535ff8920fe9aa54e78babc9649cf6c9400ad6
          git show eb535ff8920fe9aa54e78babc9649cf6c9400ad6:crates/semon-sessions/src/viewer.generated.js > "$RUNNER_TEMP/before-viewer.js"
      - name: Matching before and after, including expanded reading states
        working-directory: tests/ui
        env:
          SEMON_PRESERVATION_CANDIDATE: fea65b1ae9fd67d987c41d0cf103e82b57fe8b16
        run: |
          SEMON_PRESERVATION_EXPECTED_JS="$RUNNER_TEMP/current-viewer.js" node preservation-state.mjs
          before=$(cat "$RUNNER_TEMP/before.url")
          SEMON_BASE="${before%%/?t=*}" SEMON_TOKEN="${before##*t=}" SEMON_UI_OUT=out/before \
            SEMON_PRESERVATION_EXPECTED_JS="$RUNNER_TEMP/before-viewer.js" \
            SEMON_PRESERVATION_CANDIDATE=eb535ff8920fe9aa54e78babc9649cf6c9400ad6 node preservation-state.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: expanded-reading-evidence
          path: tests/ui/out
          if-no-files-found: warn
          retention-days: 7

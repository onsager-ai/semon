name: Compact selected recipe qualification (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SEMON_PRICING_REFRESH: "off"
  SEMON_PG_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_f1 password=ephemeral-f1 dbname=postgres connect_timeout=2"
  SEMON_PG_ADMIN_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=ephemeral-ci-admin dbname=postgres connect_timeout=2"
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        id: format
      - if: failure() && steps.format.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/compact-rustfmt.patch"
      - if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compact-rustfmt
          path: ${{ runner.temp }}/compact-rustfmt.patch
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-f1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pg-f1-${{ runner.os }}-
      - name: Restricted role
        env:
          PGPASSWORD: ephemeral-ci-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE semon_f1 LOGIN PASSWORD 'ephemeral-f1' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT, CREATE ON DATABASE postgres TO semon_f1;
          SQL
      - name: Compile
        run: cargo test -p semon-sessions --lib --locked --features postgres-test-tls --no-run
      - name: Exact behavioral cases
        run: |
          result=0
          for test in \
            query::tests::focused_tail_does_not_load_growing_session_busy_metadata \
            storage::query::tests::observed_growing_busy_catalog_prepares_exact_selected_recipe_within_budget \
            storage::postgres::catalog_effects::tests::query_recipe::pg_query_recipe_loader_native_exact_owner_grant_and_payload \
            storage::postgres::catalog_effects::tests::query_recipe::pg_query_recipe_loader_imported_keeps_original_binding_and_rechecks_receipt \
            storage::postgres::catalog_effects::tests::native_history::pg_withdrawal_preserves_current_and_older_original_custody \
            storage::postgres::catalog_effects::tests::businessflow::pg_vertical140_ordinary_model_after_ingest_and_restart_without_sqlite \
            model::tests::pg_post_ingest_staged_publication_diagnoses_large_bidirectional_message_pages \
            model::tests::staged_codex_native_spawn_and_relay_replay_matches_shared_builder \
            model::tests::staged_owner_replay_keeps_agent_messages_and_inline_turns \
            model::tests::catalog_runtime_staged_parent_turn_survives_bidirectional_message_pages; do
            cargo test -p semon-sessions --lib --locked --features postgres-test-tls "$test" -- --exact --nocapture --test-threads=1 > "$RUNNER_TEMP/compact-case.log" 2>&1 || result=1
            echo "CASE $test"
            tail -n 12 "$RUNNER_TEMP/compact-case.log"
            grep -Fq 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/compact-case.log" || result=1
            cat "$RUNNER_TEMP/compact-case.log" >> "$RUNNER_TEMP/compact-cases.log"
          done
          exit "$result"
      - name: Retain case logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compact-cases
          path: ${{ runner.temp }}/compact-cases.log
      - name: Strict clippy
        if: always()
        run: cargo clippy -p semon-sessions --all-targets --locked --features postgres-test-tls -- --no-deps -D warnings

  timings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [main, 4ed9b37e5c518a4b4351835dd5bff89ca458a5dd, 276bb827]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-f1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pg-f1-${{ runner.os }}-
      - name: Frozen source and compile
        run: |
          git rev-parse HEAD
          cargo test -p semon-sessions --lib --locked --features postgres-test-tls --no-run
      - name: Unchanged viewer timings
        run: |
          result=0
          for test in initial_catalog_page_precedes_global_native_observation fifty_views_are_checked_by_the_pools_threads_alone; do
            /usr/bin/time -f 'WALL_SECONDS=%e' cargo test -p semon-sessions --lib --locked --features postgres-test-tls "viewer::tests::$test" -- --exact --nocapture --test-threads=1 > "$RUNNER_TEMP/timing-$test.log" 2>&1 || result=1
            grep -E 'production-first-page|bounded initial page took|test result:|WALL_SECONDS=|not within' "$RUNNER_TEMP/timing-$test.log" || true
          done
          exit "$result"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: viewer-timing-${{ matrix.revision }}
          path: ${{ runner.temp }}/timing-*.log

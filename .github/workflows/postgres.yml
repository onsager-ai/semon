# Diagnostic branch only; never an integration gate or a replacement for postgres.yml.
name: 477 post-ingest oversized PostgreSQL diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMON_PRICING_REFRESH: "off"
      SEMON_PG_READ_DIAGNOSTIC: "1"
      SEMON_PG_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_f1 password=ephemeral-f1 dbname=postgres connect_timeout=2"
      SEMON_PG_ADMIN_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=ephemeral-ci-admin dbname=postgres connect_timeout=2"
      SEMON_PG_SOURCE_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_source password=ephemeral-source dbname=postgres connect_timeout=2"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-f1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pg-f1-${{ runner.os }}-
      - name: Create ephemeral restricted application roles
        env:
          PGPASSWORD: ephemeral-ci-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE semon_f1 LOGIN PASSWORD 'ephemeral-f1' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT, CREATE ON DATABASE postgres TO semon_f1;
          ALTER ROLE semon_f1 SET session_preload_libraries = 'auto_explain';
          ALTER ROLE semon_f1 SET auto_explain.log_min_duration = '100ms';
          ALTER ROLE semon_f1 SET auto_explain.log_analyze = on;
          ALTER ROLE semon_f1 SET auto_explain.log_buffers = on;
          ALTER ROLE semon_f1 SET auto_explain.log_timing = off;
          ALTER ROLE semon_f1 SET log_min_duration_statement = '100ms';
          CREATE ROLE semon_source LOGIN PASSWORD 'ephemeral-source' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE postgres TO semon_source;
          SQL
      - name: Resolve optional driver lock in CI
        run: cargo metadata --format-version 1 > "$RUNNER_TEMP/pg-metadata.json"
      - name: Compile diagnostic tests once
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls --no-run 2>&1 | tee "$RUNNER_TEMP/477-compile.log"
      - name: PostgreSQL empty stage probe and fenced resume
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls model::tests::pg_semantic_stage_empty_probe_resumes_without_mutation -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-empty-probe.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/477-pg-empty-probe.log"
      - name: Aggregate and count-only refusal bounds
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls storage::postgres::semantic_stage::publication_refusal_tests::aggregate_and_count_only_refusals_remain_busy -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-oversized-bounds.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/477-pg-oversized-bounds.log"
      - name: Post-ingest oversized PostgreSQL refusal diagnosis and size bounds
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls model::tests::pg_post_ingest_staged_publication_diagnoses_large_bidirectional_message_pages -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-oversized.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/477-pg-oversized.log"
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls storage::postgres::semantic_stage::publication_refusal_tests::aggregate_and_count_only_refusals_remain_busy -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-oversized-bounds.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/477-pg-oversized-bounds.log"
      - name: PostgreSQL Catalog batch pagination
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls model::tests::pg_catalog_page_crosses_batch_boundary_with_tied_timestamps -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-batch-pagination.log"
      - name: Repeat pagination with and without auto_explain
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          result=0
          for attempt in 1 2 3; do
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls model::tests::pg_catalog_page_crosses_batch_boundary_with_tied_timestamps -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-pagination-explain-$attempt.log" || result=1
          done
          PGPASSWORD=ephemeral-ci-admin psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE semon_f1 RESET session_preload_libraries; ALTER ROLE semon_f1 RESET log_min_duration_statement;"
          for attempt in 1 2 3; do
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls model::tests::pg_catalog_page_crosses_batch_boundary_with_tied_timestamps -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-pagination-plain-$attempt.log" || result=1
          done
          exit "$result"
      - name: PostgreSQL Catalog search parity and refusal tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls storage::postgres::catalog_effects::tests::pg_catalog124_ -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-search-counts.log"
          grep -F 'test result: ok. 5 passed; 0 failed;' "$RUNNER_TEMP/477-pg-search-counts.log"
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls storage::postgres::source_journal::tests::pg_catalog_search_ -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-catalog-search.log"
          grep -F 'test result: ok. 2 passed; 0 failed;' "$RUNNER_TEMP/477-pg-catalog-search.log"
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls storage::postgres::source_journal::tests::pg_codex_header_search_projection_tracks_metadata_commit_and_delete -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-pg-header-search.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/477-pg-header-search.log"
      - name: Explain repaired count queries under the restricted role
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/477-explain.sql"
          from pathlib import Path
          import re
          source = Path('crates/semon-sessions/src/storage/postgres/catalog_effects/search.rs').read_text()
          queries = re.findall(r'query_one\("(WITH memberships AS MATERIALIZED [^"\n]+)"', source)
          assert len(queries) == 2
          print(r"""DO $$
          DECLARE fixture record; found_schema text;
          BEGIN
            FOR fixture IN SELECT n.nspname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relname='semon_pg_native_catalog_search_documents' AND c.relkind='r' LOOP
              EXECUTE format('SELECT %L FROM %I.semon_pg_native_catalog_search_documents WHERE convert_from(namespace,''UTF8'') LIKE ''pg-page-batches-%%'' GROUP BY namespace,generation HAVING count(*)=220 LIMIT 1',fixture.nspname,fixture.nspname) INTO found_schema;
              IF found_schema IS NOT NULL THEN
                PERFORM set_config('semon.plan_schema',found_schema,false);
                EXIT;
              END IF;
            END LOOP;
            IF found_schema IS NULL THEN RAISE EXCEPTION '110-session pagination fixture not found'; END IF;
          END $$;
          SELECT current_setting('semon.plan_schema') AS fixture_schema \gset
          SELECT set_config('search_path',:'fixture_schema',false);
          """)
          print("SELECT encode(namespace,'hex') AS ns,encode(generation,'hex') AS generation FROM semon_pg_native_catalog_search_documents WHERE convert_from(namespace,'UTF8') LIKE 'pg-page-batches-%' GROUP BY namespace,generation HAVING count(*)=220 LIMIT 1 \\gset")
          print("\\connect 'host=127.0.0.1 port=5432 user=semon_f1 password=ephemeral-f1 dbname=postgres'")
          print("BEGIN; SELECT set_config('search_path',:'fixture_schema',true); SET LOCAL semon.namespace = :'ns';")
          print("SELECT current_user,rolsuper,rolbypassrls FROM pg_roles WHERE rolname=current_user;")
          for query in queries:
              query = query.replace('$1::bytea', "decode(:'ns','hex')").replace('$1', "decode(:'ns','hex')").replace('$2', "decode(:'generation','hex')").replace('$3', "convert_to('current','UTF8')")
              print('EXPLAIN (ANALYZE, BUFFERS, TIMING OFF) ' + query + ';')
          admitted = Path('crates/semon-sessions/src/storage/postgres/catalog_effects/snapshot/admitted.rs').read_text()
          read_query = re.search(r'"(WITH visible AS \(.*?)",\s*&\[', admitted, re.S).group(1)
          print("SELECT count(*) AS rows,sum(octet_length(metadata)) AS metadata_bytes FROM semon_pg_native_catalog_rows WHERE namespace_digest=sha256(decode(:'ns','hex')) AND namespace=decode(:'ns','hex') AND generation=decode(:'generation','hex');")
          print("SELECT last_ms AS cursor_last,encode(session_key,'hex') AS cursor_key FROM semon_pg_native_catalog_rows WHERE namespace_digest=sha256(decode(:'ns','hex')) AND namespace=decode(:'ns','hex') AND generation=decode(:'generation','hex') ORDER BY last_ms DESC,session_key OFFSET 64 LIMIT 1 \\gset")
          for cursor in (False, True):
              params = {1: "decode(:'ns','hex')", 2: "decode(:'generation','hex')", 3: 'NULL', 4: 'NULL', 5: 'NULL', 6: 'NULL', 7: ":'cursor_last'::bigint" if cursor else 'NULL', 8: "decode(:'cursor_key','hex')" if cursor else 'NULL', 9: 'false', 10: '36' if cursor else '65', 11: 'false'}
              print('EXPLAIN (ANALYZE, BUFFERS, TIMING OFF) ' + re.sub(r'\$(\d+)', lambda match: params[int(match.group(1))], read_query) + ';')
          print('ROLLBACK;')
          PY
          PGPASSWORD=ephemeral-ci-admin psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/477-explain.sql" 2>&1 | tee "$RUNNER_TEMP/477-repaired-plans.log"
      - name: Formatting
        id: formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee "$RUNNER_TEMP/477-format.log"
      - name: Prepare exact formatting patch
        if: ${{ !cancelled() && steps.formatting.outcome == 'failure' }}
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/477-format.patch"
      - name: Storage boundary
        if: ${{ !cancelled() }}
        run: python3 scripts/check-native-storage-boundary.py
      - name: Strict PostgreSQL Clippy
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p semon-sessions --all-targets --features postgres-test-tls -- --no-deps -D warnings 2>&1 | tee "$RUNNER_TEMP/477-clippy.log"
      - name: Collect PostgreSQL query plans and durations
        if: ${{ !cancelled() }}
        run: docker logs "${{ job.services.postgres.id }}" > "$RUNNER_TEMP/477-postgres-server.log" 2>&1
      - name: Retain continuation diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 477-pg-post-ingest-oversized-diagnostic
          path: ${{ runner.temp }}/477-*

name: Compact selected recipe qualification (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SEMON_PRICING_REFRESH: "off"
  SEMON_PG_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_f1 password=ephemeral-f1 dbname=postgres connect_timeout=2"
  SEMON_PG_ADMIN_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=ephemeral-ci-admin dbname=postgres connect_timeout=2"
jobs:
  timings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [8ec0a01c0ede44edfe658ce26f230319d0fdce0f]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
      - name: Use the exact base fifty-view fixture for the main comparison
        run: |
          git fetch --no-tags --depth=1 origin 4ed9b37e5c518a4b4351835dd5bff89ca458a5dd
          git show FETCH_HEAD:crates/semon-sessions/src/viewer.rs > "$RUNNER_TEMP/base-viewer.rs"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          name = '    fn fifty_views_are_checked_by_the_pools_threads_alone()'
          base = Path(os.environ['RUNNER_TEMP'], 'base-viewer.rs').read_text()
          target = Path('crates/semon-sessions/src/viewer.rs')
          source = target.read_text()
          start = base.index(name)
          end = base.index('\n    #[test]', start)
          before = source.index(name)
          after = source.index('\n    #[test]', before)
          target.write_text(source[:before] + base[start:end] + source[after:])
          print('main production, exact unchanged base fifty-view fixture; no limit or assertion changes')
          PYTHON
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-f1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pg-f1-${{ runner.os }}-
      - name: Frozen source and compile
        run: |
          git rev-parse HEAD
          cargo test -p semon-sessions --lib --locked --no-run
      - name: Unchanged viewer timings
        run: |
          result=0
          for test in initial_catalog_page_precedes_global_native_observation fifty_views_are_checked_by_the_pools_threads_alone; do
            /usr/bin/time -f 'WALL_SECONDS=%e' cargo test -p semon-sessions --lib --locked "viewer::tests::$test" -- --exact --nocapture --test-threads=1 > "$RUNNER_TEMP/timing-$test.log" 2>&1 || result=1
            grep -Fq 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/timing-$test.log" || result=1
            grep -E 'production-first-page|bounded initial page took|test result:|WALL_SECONDS=|not within' "$RUNNER_TEMP/timing-$test.log" || true
          done
          exit "$result"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: viewer-timing-${{ matrix.revision }}
          path: ${{ runner.temp }}/timing-*.log

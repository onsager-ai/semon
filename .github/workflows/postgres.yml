name: PostgreSQL foundation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SEMON_PRICING_REFRESH: "off"
jobs:
  viewer-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkpoint: baseline
            revision: a243261cea013d2951a68006a0bda18da62d47c2
          - checkpoint: product
            revision: d2db2056be9965756186ec3289e113d7b711ae2a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-f1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pg-f1-${{ runner.os }}-
      - name: Exact source and unchanged viewer timeout
        shell: bash
        run: |
          git rev-parse HEAD | tee "$RUNNER_TEMP/viewer-source.txt"
          result=0
          for attempt in 1 2 3; do
            case_log="$RUNNER_TEMP/viewer-$attempt.log"
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls viewer::tests::concurrent_native_reads_keep_whole_generation_fenced_pages_while_logs_grow -- --exact --nocapture --test-threads=1 > "$case_log" 2>&1 || result=1
            tail -n 18 "$case_log"
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$case_log"; then result=1; fi
          done
          exit "$result"
      - name: Retain paired baseline and product diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: viewer-ratchet-${{ matrix.checkpoint }}
          path: ${{ runner.temp }}/viewer-*.txt
      - name: Retain exact timing test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: viewer-timing-${{ matrix.checkpoint }}
          path: ${{ runner.temp }}/viewer-*.log

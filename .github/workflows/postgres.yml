# Diagnostic branch only; never an integration gate or a replacement for postgres.yml.
name: 477 continuation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMON_PRICING_REFRESH: "off"
      SEMON_PG_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_f1 password=ephemeral-f1 dbname=postgres connect_timeout=2"
      SEMON_PG_ADMIN_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=ephemeral-ci-admin dbname=postgres connect_timeout=2"
      SEMON_PG_SOURCE_TEST_DSN: "host=127.0.0.1 port=5432 user=semon_source password=ephemeral-source dbname=postgres connect_timeout=2"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-f1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pg-f1-${{ runner.os }}-
      - name: Create ephemeral restricted application roles
        env:
          PGPASSWORD: ephemeral-ci-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE semon_f1 LOGIN PASSWORD 'ephemeral-f1' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT, CREATE ON DATABASE postgres TO semon_f1;
          CREATE ROLE semon_source LOGIN PASSWORD 'ephemeral-source' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE postgres TO semon_source;
          SQL
      - name: Resolve optional driver lock in CI
        run: cargo metadata --format-version 1 > "$RUNNER_TEMP/pg-metadata.json"
      - name: Compile diagnostic tests once
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls --no-run 2>&1 | tee "$RUNNER_TEMP/477-compile.log"
      - name: Continuation proof acceptance and refusal
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls storage::catalog::source_continuation_tests:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-continuation-proof.log"
          grep -F 'test result: ok. 7 passed; 0 failed;' "$RUNNER_TEMP/477-continuation-proof.log"
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls source_change::append_plan_requires_a_well_formed_custody_generation -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-continuation-plan.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/477-continuation-plan.log"
      - name: Real PG ordinary ingest restart append and relocation
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p semon-sessions --lib --features postgres-test-tls storage::postgres::catalog_effects::tests::businessflow::pg_vertical140_ordinary_model_after_ingest_and_restart_without_sqlite -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/477-continuation-businessflow.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/477-continuation-businessflow.log"
      - name: Real SQLite and PostgreSQL owned versus external revision fences
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          result=0
          case_number=0
          for test in catalog::tests::full_catalog_revision_fence_counts_owned_scan_and_refuses_external_advance_atomically storage::postgres::catalog_effects::tests::revision_fence::pg_full_catalog_revision_fence_counts_owned_scan_and_refuses_external_advance_atomically; do
            case_number=$((case_number+1))
            output="$RUNNER_TEMP/477-revision-fence-$case_number.log"
            cargo test --locked -p semon-sessions --lib --features postgres-test-tls "$test" -- --exact --nocapture --test-threads=1 > "$output" 2>&1 || result=1
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$output"; then result=1; fi
            tail -n 70 "$output"
          done
          exit "$result"
      - name: Formatting
        id: formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee "$RUNNER_TEMP/477-format.log"
      - name: Prepare exact formatting patch
        if: ${{ !cancelled() && steps.formatting.outcome == 'failure' }}
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/477-format.patch"
      - name: Storage boundary
        if: ${{ !cancelled() }}
        run: python3 scripts/check-native-storage-boundary.py
      - name: Strict PostgreSQL Clippy
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p semon-sessions --all-targets --features postgres-test-tls -- --no-deps -D warnings 2>&1 | tee "$RUNNER_TEMP/477-clippy.log"
      - name: Retain continuation diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 477-continuation-diagnostic
          path: ${{ runner.temp }}/477-*

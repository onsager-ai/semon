name: SSH inactive boundaries and retained security
on:
  pull_request:
    paths:
      - 'crates/semon-ssh/**'
      - 'crates/semon-control/**'
      - 'scripts/ssh-native-fixture.sh'
      - 'tests/spikes/ssh-native-controller.py'
      - 'scripts/ssh-fixture.sh'
      - 'tests/ssh/**'
      - 'tests/spikes/test_collection_pause.py'
      - '.github/workflows/ssh.yml'
permissions:
  contents: read
jobs:
  inactive-and-offline-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - name: Refuse stale SSH before credentials or transport admission
        run: |
          python3 -m unittest discover -s tests/spikes -p test_collection_pause.py -v
          cargo test -p semon-ssh --lib --locked collection_ssh_ -- --nocapture
          cargo test -p semon-ssh --example controller-install --locked collection_controller_install_refuses -- --nocapture
      - name: Retained offline security, receipt identity and non-SSH checkpoint custody
        run: |
          cargo test -p semon-ssh --locked
          cargo test -p semon-control --bin semon-ssh-controller --locked collection_controller_refuses
          python3 tests/ssh/test_controller_supervisor.py

  # Source #380 / Hub #267: real-SSH feature qualification is explicitly deferred
  # after the inactive boundary checks above. Kept verbatim as historical oracles;
  # skipped jobs are not passes and require a future scope decision to reactivate.
  openssh:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/ssh-fixture.sh cargo test -p semon-ssh --locked --features real-ssh-tests

  native-controller:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build controlled fixture artifacts
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          cargo build -p semon-control --bin semon-ssh-controller --example ssh-controller-qualification -p semon-ssh --example controller-install --locked
          cargo test -p semon-control --bin semon-ssh-controller collection_controller_refuses --locked
          cargo build -p semon-cli --bin semon --locked
          python3 tests/ssh/test_controller_supervisor.py
      - name: Install pinned offline probe dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/native-probe"
          "$RUNNER_TEMP/native-probe/bin/pip" install -r tests/spikes/requirements-control.txt
      - name: Verify complete pinned native package
        run: |
          mkdir "$RUNNER_TEMP/native-package"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/native-package.tar.gz" https://github.com/openai/codex/releases/download/rust-v0.160.0/codex-package-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' 4fcc47ab57f52ff75363951a8761146cd10c8288bd86fed45487dbb204a16b71 "$RUNNER_TEMP/native-package.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/native-package.tar.gz" -C "$RUNNER_TEMP/native-package"
          rm "$RUNNER_TEMP/native-package.tar.gz"
      - name: Retained optional controller security and captured-history readback
        run: |
          # Ubuntu's host AppArmor user-namespace restriction also restricts
          # capabilities in Docker's nested namespace, including its loopback.
          # This exclusive ephemeral fixture runner must permit the isolation
          # that the controller probes; restore its host setting on every exit.
          namespace_key=kernel.apparmor_restrict_unprivileged_userns
          if sysctl "$namespace_key" >/dev/null 2>&1; then
            namespace_previous=$(sysctl -n "$namespace_key")
            trap 'sudo sysctl -q -w "$namespace_key=$namespace_previous"' EXIT
            sudo sysctl -q -w "$namespace_key=0"
          fi
          SEMON_CODEX_PACKAGE="$RUNNER_TEMP/native-package" SEMON_SSH_BINARY="$PWD/target/debug/semon" scripts/ssh-native-fixture.sh "$RUNNER_TEMP/native-probe/bin/python" tests/spikes/ssh-native-controller.py --installer "$PWD/target/debug/examples/controller-install" --controller "$PWD/target/debug/examples/ssh-controller-qualification" --codex "$RUNNER_TEMP/native-package/bin/codex" --output "$RUNNER_TEMP/native-controller-report.json"
